  function takeMeta(remote) {
    var m = Object.assign({}, remote || {});
    if (m._schema) schema = Number(m._schema) || schema;
    delete m._schema;
    return m;
  }
  /* ของเครื่องนี้ที่ยังไม่ได้ส่ง (local.keys / local.meta / local.settings) ชนะเสมอ
     — มันจะถูกส่งทับตามไปในรอบถัดไป */
  function applyRemote(res, local) {
    var changed = false;
    (res.records || []).forEach(function (r) {
      if (COLLS.indexOf(r.coll) < 0) return;
      if (r.deleted || !r.data) delete base.c[r.coll][r.id];
      else base.c[r.coll][r.id] = JSON.stringify(r.data);
      if (local.keys[r.coll + '/' + r.id]) return;
      if (r.deleted || !r.data) removeLocal(SP.state, r.coll, r.id);
      else upsertLocal(SP.state, r.coll, r.data);
      changed = true;
    });
    if (res.meta) {
      var m = takeMeta(res.meta);
      m.docId = docId;
      base.meta = JSON.stringify(metaForServer(m));
      if (!local.meta) {
        VOLATILE_META.forEach(function (k) { m[k] = SP.state.meta[k]; });
        SP.state.meta = m; changed = true;
      }
    }
    if (res.settings) {
      base.settings = JSON.stringify(res.settings);
      if (!local.settings) { SP.state.settings = res.settings; changed = true; }
    }
    if (changed) { ls().lsSet(ls().stateKey(docId), SP.state); rerender(); }
  }

  /* ห้าม re-render ใต้มือคนที่กำลังพิมพ์/เปิดฟอร์มค้าง — caret กระโดดและค่าที่พิมพ์ค้างหาย
     เลื่อนไปทำตอนออกจากช่อง หรือรอบซิงก์ถัดไป */
  function busyEditing() {
    var a = document.activeElement;
    if (a && a.matches && a.matches('input,textarea,select,[contenteditable="true"]')) return true;
    var mo = document.getElementById('modal-layer'), dr = document.getElementById('drawer-layer');
    return !!((mo && mo.firstElementChild) || (dr && dr.firstElementChild));
  }
  function rerender() {
    if (busyEditing()) { renderPending = true; SP.Render.header(); return; }
    renderPending = false;
    SP.Render.current();
  }
  function flushRender() { if (renderPending && !busyEditing()) rerender(); }

  // ---- รอบซิงก์ ---------------------------------------------------------------
  function setStatus(s, err) {
    status = s;
    if (err !== undefined) lastError = err;
    if (s === 'ok') lastOkAt = new Date();
    if (SP.Render && SP.Render.header && SP.state) SP.Render.header();
  }

  function sync() {
    if (!isOnline || !docId || !base || !SP.state || relocking) return Promise.resolve();
    if (inflight) { again = true; return Promise.resolve(); }
    clearTimeout(retryTimer);
    if (SP.state.meta.docId !== docId) SP.state.meta.docId = docId;   // นำเข้า JSON ของเอกสารอื่นมาทับ — ยึด docId ของ server
    var snap = snapshot(SP.state);
    var d = diff(snap, base);
    var p;
    inflight = true;
    if (hasChanges(d)) {
      setStatus('saving');
      var body = { docId: docId, since: seq, by: SP.ui.me || '', upserts: {}, deletes: d.deletes };
      Object.keys(d.upserts).forEach(function (coll) {
        body.upserts[coll] = d.upserts[coll].map(function (id) { return JSON.parse(snap.c[coll][id]); });
      });
      if (d.meta)     body.meta = JSON.parse(snap.meta);
      if (d.settings) body.settings = JSON.parse(snap.settings);
      p = req('POST', '/sync', body).then(function (res) {
        base = snap;                 // server รับภาพนี้แล้ว — การแก้ระหว่างรอจะต่างจาก base และถูกส่งรอบหน้า
        seq = res.seq;
        applyRemote(res, diff(snapshot(SP.state), base));
      });
    } else {
      p = req('GET', '/sync?docId=' + encodeURIComponent(docId) + '&since=' + seq).then(function (res) {
        seq = res.seq;
        applyRemote(res, diff(snapshot(SP.state), base));
      });
    }
    return p.then(function () {
      inflight = false;
      persist();
      setStatus('ok', '');
      if (again) { again = false; return sync(); }
    }, function (e) {
      inflight = false; again = false;
      persist();
      if (e.status === 401) return;
      setStatus('offline', e.message);
      clearTimeout(retryTimer);
      retryTimer = setTimeout(sync, RETRY_MS);
    });
  }
  /* Store.flush() เรียกทุกครั้งที่ autosave — หน่วงนิดหน่อยให้การพิมพ์ต่อเนื่องรวมเป็น batch เดียว */
  function schedule() {
    if (!isOnline || !started) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(sync, 300);
  }
  function start() {
    if (!isOnline || started) return;
    started = true;
    setInterval(function () { if (!document.hidden) sync(); }, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
    window.addEventListener('online', function () { sync(); });
    document.addEventListener('focusout', function () { setTimeout(flushRender, 0); });
    document.addEventListener('click', function () { setTimeout(flushRender, 50); });
    sync();
  }

  // ---- boot ----------------------------------------------------------------
  function stateFromServer(doc) {
    var st = { meta: takeMeta(doc.meta), settings: doc.settings || {} };
    st.schema = schema;
    COLLS.forEach(function (c) { st[c] = (doc.records && doc.records[c]) || []; });
    st.meta.docId = doc.docId;
    if (typeof st.meta.editsSinceSave !== 'number') st.meta.editsSinceSave = 0;
    return ls().migrate(st);
  }
  /* ใส่การแก้ของเครื่องนี้ที่ยังไม่ได้ขึ้น server (ปิดแท็บตอนเน็ตหลุด / token หมดอายุ) ทับลงบน state ของ server */
  function rebase(serverState, local, oldBase) {
    var snapL = snapshot(local);
    var d = diff(snapL, oldBase);
    if (!hasChanges(d)) return 0;
    Object.keys(d.upserts).forEach(function (coll) {
      d.upserts[coll].forEach(function (id) { upsertLocal(serverState, coll, JSON.parse(snapL.c[coll][id])); });
    });
    Object.keys(d.deletes).forEach(function (coll) {
      d.deletes[coll].forEach(function (id) { removeLocal(serverState, coll, id); });
    });
    if (d.meta) { var keep = serverState.meta.docId; serverState.meta = local.meta; serverState.meta.docId = keep; }
    if (d.settings) serverState.settings = local.settings;
    return d.n + (d.meta ? 1 : 0) + (d.settings ? 1 : 0);
  }

  /* done(state, note) — note = ข้อความ toast · fail(err) = ไม่มีทั้ง server และแคช */
  function boot(done, fail) {
    var seed = ls().readSeed();
    if (seed && seed.schema) schema = seed.schema;
    var saved = ls().lsGet(SYNC_KEY);
    req('GET', '/doc' + (saved && saved.docId ? '?docId=' + encodeURIComponent(saved.docId) : '')).then(function (doc) {
      docId = doc.docId; seq = doc.seq;
      var st = stateFromServer(doc);
      base = snapshot(st);
      var note = '';
      if (saved && saved.docId === docId && saved.base) {
        var local = ls().readLocal(docId);
        if (local) {
          var n = rebase(st, local, saved.base);
          if (n) note = 'พบการแก้ไข ' + n + ' รายการในเครื่องนี้ที่ยังไม่ได้บันทึกขึ้น server — กำลังส่งขึ้นไป';
        }
      }
      persist();
      done(st, note);
    }, function (e) {
      if (e.status === 401) return;
      if (e.code === 'NO_DOC' && !(saved && saved.docId)) {
        // ฐานข้อมูลว่าง — ตั้งเอกสารแรกจากแคชในเครื่อง (ถ้ามี) หรือ seed ของหน้า แล้วส่งขึ้นไปทั้งชุด
        var first = (seed && ls().readLocal(seed.meta.docId)) || seed;
        docId = first.meta.docId; seq = 0; base = emptySnap();
        done(first, 'ฐานข้อมูลยังว่าง — กำลังสร้างเอกสารแรกบน server');
        return;
      }
      if (e.code === 'NO_DOC') {
        // เอกสารที่เครื่องนี้จำไว้ไม่มีบน server แล้ว (ถูกแทนด้วยการนำเข้าใหม่) — ลืมแล้วโหลดใหม่
        ls().lsDel(SYNC_KEY);
        location.reload();
        return;
      }
      // server ล่ม/เน็ตหลุด — ใช้แคชในเครื่องไปก่อนแล้วลองส่งซ้ำ
      var cache = saved && saved.docId ? ls().readLocal(saved.docId) : null;
      if (cache && saved.base) {
        docId = saved.docId; seq = saved.seq || 0; base = saved.base;
        status = 'offline'; lastError = e.message;
        done(cache, 'เชื่อมต่อ server ไม่ได้ — แสดงข้อมูลที่แคชไว้ในเครื่อง การแก้ไขจะส่งขึ้นไปเมื่อกลับมาออนไลน์');
        return;
      }
      fail(e);
    });
  }

  // ---- ส่วนแสดงผล -------------------------------------------------------------
  function fmtTime(d) { return d ? d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : ''; }
  function badge() {
    var U = SP.U;
    if (status === 'offline')
      return '<span class="savebadge dirty" title="' + U.attr(lastError) + '"><span class="dot"></span>ออฟไลน์ — รอส่งขึ้น server</span>';
    if (status === 'saving' || pending())
      return '<span class="savebadge dirty"><span class="dot"></span>กำลังบันทึก…</span>';
    return '<span class="savebadge clean">' + U.ic('check-circle') + 'บันทึกลงฐานข้อมูลแล้ว' +
           (lastOkAt ? ' · ' + fmtTime(lastOkAt) : '') + '</span>';
  }
  function banner() {
    if (status !== 'offline') return '';
    var U = SP.U;
    return '<div class="wrap"><div class="banner banner-warn" style="margin:8px 0">' + U.ic('alert') +
      '<div><b>ยังไม่ได้บันทึกขึ้น server</b> — ' + U.esc(lastError || 'เชื่อมต่อไม่ได้') +
      '<br><span class="small">การแก้ไขเก็บไว้ในเครื่องนี้ก่อน และจะส่งขึ้นไปเองเมื่อเชื่อมต่อได้ (ลองใหม่ทุก ' + (RETRY_MS / 1000) + ' วินาที)</span></div>' +
      '<button class="btn btn-sm" data-act="sync:now">' + U.ic('refresh') + 'ลองอีกครั้ง</button></div></div>';
  }
  function info() {
    return { docId: docId, seq: seq, status: status, lastOkAt: lastOkAt, lastError: lastError, pending: pending() };
  }
  /* ล้างแคชของเครื่องนี้ แล้วโหลดจาก server ใหม่ — การแก้ที่ยังไม่ได้ส่งจะหาย */
  function resetCache() {
    relocking = true;
    if (docId) ls().lsDel(ls().stateKey(docId));
    ls().lsDel(SYNC_KEY);
    location.reload();
  }

  return {
    online: online, hasToken: hasToken, clearToken: clearToken, login: login,
    pinHash: pinHash, storedPinHash: storedPinHash,
    boot: boot, start: start, sync: sync, schedule: schedule, pending: pending,
    badge: badge, banner: banner, info: info, resetCache: resetCache,
    docId: function () { return docId; }
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 04 — NORM
   ตัวแปลงค่าจากสเปรดชีต พอร์ตมาจาก js/mock-data.js:222-338 พร้อมแก้ 3 จุด
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Norm = (function () {
  'use strict';

  /* value — ต่อยอด mock-data.js:269-270
     แก้: parseFloat แทน parseInt (รองรับ "4.5 ล้าน"), เลขไทย, ตัวคูณ ล้าน, ฿
     การแปลงเลขไทยย้ายไปอยู่ที่ SP.U.arabic() แล้ว — ตัว parser วันที่ก็ใช้ตัวเดียวกัน
     เก็บสำเนาเดียวดีกว่าสองชุดที่จะเพี้ยนออกจากกันวันใดวันหนึ่ง */
  function value(raw) {
    if (typeof raw === 'number') return Math.round(raw);
    var s = SP.U.arabic(raw);
    s = s.replace(/["',\s฿]/g, '').trim();
    if (!s || s === '-' || s.toUpperCase() === 'N/A') return 0;
    var million = /ล้าน|ลบ\./.test(s);
    var n = parseFloat(s.replace(/[^\d.]/g, ''));
    if (!isFinite(n)) return 0;
    return Math.round(million ? n * 1e6 : n);
  }

  /* budget level — แก้บั๊กจริงของ mock-data.js:280-285 ที่ใช้ startsWith()
     startsWith คืน Level 4 เงียบ ๆ ให้ทั้ง "Level 1" (ขึ้นต้น L)
     และ " 1 (E-Bid)" (มีช่องว่างนำ ซึ่งมีอยู่จริงในไฟล์ต้นทาง) */
  function budget(raw) {
    var m = String(raw == null ? '' : raw).trim().match(/[1-5]/);
    return m ? 'Level ' + m[0] : 'Level 4';
  }

  /* stage — คัดลอก cascade ของ mock-data.js:288-306 ตรงตัว (ห้ามปรับลำดับ
     มันจูนมาตามคำที่ทีมนี้ใช้จริงในสเปรดชีต) แต่ผลลัพธ์ยังเป็น "รหัสชุดเดิม S0–S9"
     แล้วค่อยส่งผ่าน C.migrateStage() ทีเดียวตอนท้าย — จุดแปลงรหัสจึงมีที่เดียว
     ในระบบ ไม่ต้องไล่แก้หลายที่ทุกครั้งที่โครงขั้นเปลี่ยน */
  function legacyStage(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return 'S0';
    var m = s.match(/^S[0-9]+(-[0-9]+)?(_WON)?/i);
    if (m) {
      var code = m[0].toUpperCase();
      if (code === 'S4-1') code = 'S5';
      if (code === 'S7_WON') code = 'S8_WON';
      return code;
    }
    var ls = s.toLowerCase();
    function has() {
      for (var i = 0; i < arguments.length; i++) if (ls.indexOf(arguments[i]) >= 0) return true;
      return false;
    }
    if (has('won', 'ชนะ')) return 'S8_WON';
    if (has('lost', 'ไม่สำเร็จ', 'สูญเสีย')) return 'S9';
    /* S10 ไม่มีในชุดรหัสเดิม แต่ migrateStage() ปล่อยผ่านเพราะมีอยู่ใน STAGES
       ใช้วลีเฉพาะเจาะจง ไม่ใช้คำว่า "พัก" หรือ "hold" ลอย ๆ ที่ไปชนข้อความอื่นได้ */
    if (has('ไม่ได้ทำต่อ', 'พักโครงการ', 'ชะลอ', 'on hold', 'parked', 'dropped')) return 'S10';
    if (has('กำลังดำเนินการจัดซื้อ', 'e-bidding', 's7')) return 'S7';
    if (has('รอกระบวนการจัดซื้อ', 'รออนุมัติ', 's6')) return 'S6';
    if (has('พิจารณา', 's5', 's4-1')) return 'S5';
    if (has('tor', 'เสนอราคา', 's4')) return 'S4';
    if (has('demo', 'trial', 's3')) return 'S3';
    if (has('คฉ', 'ความต้องการ', 's2')) return 'S2';
    if (has('ติดต่อ', 'เข้าพบ', 's1')) return 'S1';
    return 'S0';
  }

  /* สเปรดชีตของทีมใช้รหัสชุดเดิมทั้งหมด จึงแปลงเป็นชุดใหม่ให้เสมอ
     ผลลัพธ์เห็นได้ในตัวอย่าง 5 แถวแรกของ wizard ก่อนกดนำเข้าจริง */
  function stage(raw) { return SP.C.migrateStage(legacyStage(raw)); }

  /* product group — ขยาย mock-data.js:308 (เดิมเป็น ternary บรรทัดเดียวที่ออก ERP ไม่ได้)
     ลำดับสำคัญ: Custom มาก่อนสุด เพราะ RCM จะโดน /การเงิน/ ดูดไป ERP
     และ Checkup จะโดน /เวชระเบียน/ ดูดไป HIS ทั้งที่ทั้งคู่เป็นงานพัฒนาเฉพาะ
     MEDIQ มาก่อน KIOSK เพราะ "MediQ — Kiosk" คือสินค้า MediQ ไม่ใช่ดีลฮาร์ดแวร์ */
  var PG_RULES = [
    ['Custom', /rcm|เคลม|เบิกจ่าย|รับรู้รายได้|checkup|ตรวจสุขภาพ|แฟ้มข้อมูลสุขภาพ|ระบาดวิทยา/i],
    ['MEDIQ',  /mediq|เมดิคิว|ระบบคิว|คิวอัตโนมัติ|queue/i],
    ['KIOSK',  /kiosk|คีออส|ตู้|ฮาร์ดแวร์|hardware|เครื่องอ่านบัตร/i],
    ['HIS',    /medicore|\bhis\b|เวชระเบียน|paperless|ไร้กระดาษ|ผู้ป่วยใน|\bipd\b|\bemr\b/i],
    ['ERP',    /\berp\b|บัญชี|พัสดุ|คลัง|การเงิน/i]
  ];
  function productGroup(product, explicit) {
    if (explicit) {
      var e = String(explicit).trim();
      // ไฟล์ระบุหมวดมาเอง = ไฟล์ชนะเสมอ ตัวเดาไม่มีทางถูก 100% กับคำก้ำกึ่ง
      var keys = Object.keys(SP.C.PRODUCT_GROUPS);
      for (var i = 0; i < keys.length; i++) {
        if (e.toUpperCase() === keys[i].toUpperCase()) return keys[i];
        if (e.toLowerCase() === SP.C.PRODUCT_GROUPS[keys[i]].nameTH.toLowerCase()) return keys[i];
      }
    }
    var p = String(product == null ? '' : product);
    for (var k = 0; k < PG_RULES.length; k++) if (PG_RULES[k][1].test(p)) return PG_RULES[k][0];
    return 'Custom';
  }

  function customerGroup(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return 'รพ.รัฐ';
    if (SP.C.CUSTOMER_GROUPS.indexOf(s) >= 0) return s;
    if (/ทหาร|กองทัพ|ค่าย|เสนารักษ์/.test(s)) return 'ทหารบก';
    if (/เอกชน|private/i.test(s)) return 'รพ.เอกชน';
    return 'รพ.รัฐ';
  }

  function interest(budgetCode) {
    if (budgetCode === 'Level 1' || budgetCode === 'Level 5') return 'hot';
    if (budgetCode === 'Level 2' || budgetCode === 'Level 3') return 'warm';
    return 'cold';
  }

  /* คีย์จับคู่ตอนรวมข้อมูล — ไม่สนช่องว่างเป็นเรื่องจำเป็น ไม่ใช่ทางเลือก:
     ไฟล์ต้นทางมี 'รพ.ค่ายธนรัตน์ ' และ 'รพ.ค่ายสุรศักดิมนตรี ' ที่มีช่องว่างท้าย
     แต่ห้ามฉลาดถึงขั้นตัดคำนำหน้า รพ./โรงพยาบาล — false positive ระหว่าง
     รพ.ค่ายทหารที่ชื่อคล้ายกันแย่กว่าการรวมด้วยมือ */
  function key(name) { return String(name || '').replace(/\s+/g, '').toLowerCase(); }
  function jobKey(name, pg) { return key(name) + '|' + pg; }

  function levenshtein(a, b) {
    a = key(a); b = key(b);
    if (a === b) return 0;
    if (!a.length || !b.length) return Math.max(a.length, b.length);
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur.slice();
    }
    return prev[b.length];
  }

  /* แถวหัวข้อกลุ่ม (🔵/🟢) — mock-data.js:245 ข้ามทิ้ง แต่ที่นี่เก็บไว้เป็น
     sectionLabel เพราะสไลด์ประชุมจัดกลุ่มตามป้ายพวกนี้พอดี
     นี่คือการอ่าน emoji ที่อยู่ใน "ข้อมูล" ไม่เกี่ยวกับกฎห้าม emoji ใน UI */
  var EMOJI = /^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/u;
  function sectionLabel(cell) { return String(cell || '').replace(EMOJI, '').trim(); }
  function isSectionRow(cell) { return EMOJI.test(String(cell || '')); }

  /* ---- คีย์จับคู่ "ลูกค้า" — คนละตัวกับ key() ด้านบนโดยเจตนา ----------------
     key() ห้ามตัดคำนำหน้า รพ./โรงพยาบาล (ดูคอมเมนต์ของมัน) เพราะการรวม job
     ใช้คีย์นั้น และ false positive ระหว่าง รพ.ค่ายทหารชื่อคล้ายกันแย่กว่าการรวมมือ
     แก้ key() เมื่อไหร่ = job เดิมจะถูก re-merge/un-merge เงียบ ๆ ตอน import ครั้งหน้า
     จึงเพิ่มคีย์ตัวที่สองที่ดุกว่า ใช้กับ customers เท่านั้น

     วัดกับข้อมูลจริงแล้ว: 'ส.ประสาทวิทยา ' และ 'สถาบันประสาทวิทยา' ได้คีย์เดียวกัน
     เพราะ 'สถาบัน' อยู่ในรายการคำนำหน้า จึงไม่ต้องมีตารางขยาย 'ส.' -> 'สถาบัน' */
  var CUST_PREFIX = /^(โรงพยาบาล|รพ\.|ร\.พ\.|รพ|สถาบัน|ส\.|ศูนย์การแพทย์|คลินิก|hospital|hosp\.)/i;
  var CUST_SUFFIX = /(medicalcenter|hospital|international|อินเตอร์เนชั่นแนล|จำกัดมหาชน|จำกัด)$/i;
  function custKey(name) {
    var s = String(name == null ? '' : name);
    if (s.normalize) s = s.normalize('NFC');
    s = SP.U.arabic(s)
      .replace(/[​ ]/g, '')
      .replace(/\s+/g, '')
      .toLowerCase();
    s = s.replace(/\((?:สาขา|branch)[^)]*\)/gi, '');
    for (var i = 0; i < 4 && CUST_PREFIX.test(s); i++) s = s.replace(CUST_PREFIX, '');
    for (var j = 0; j < 3 && CUST_SUFFIX.test(s); j++) s = s.replace(CUST_SUFFIX, '');
    return s.replace(/[.\-–—\/,'"()]/g, '');
  }

  /* ตัวเลขในชื่อโรงพยาบาลไทยคือ "ตัวระบุสาขา" ไม่ใช่สัญญาณรบกวน
     บางปะกอก 1 / 3 / 8 / 9 · รามคำแหง / รามคำแหง 2 · มหาชัย / มหาชัย 2 / 3
     เป็นคนละโรงพยาบาลกันทั้งหมด ถ้าเลขไม่ตรงให้ถือว่าคนละรายทันที ไม่ต้องวัดระยะต่อ */
  function digitsOf(k) {
    var m = String(k).match(/\d+/g);
    return m ? m.sort().join(',') : '';
  }

  function matchCustomer(name, customers) {
    var k = custKey(name);
    var none = { customer:null, score:0, how:'none' };
    if (!k || !customers || !customers.length) return none;

    var i, c;
    for (i = 0; i < customers.length; i++) {
      if (custKey(customers[i].name) === k) return { customer:customers[i], score:1, how:'exact' };
    }
    for (i = 0; i < customers.length; i++) {
      c = customers[i];
      var al = c.aliases || [];
      for (var a = 0; a < al.length; a++) {
        if (custKey(al[a]) === k) return { customer:c, score:1, how:'alias' };
      }
    }

    /* ไม่มีขั้น "contains" โดยเจตนา — กับข้อมูลจริงมันรวม รพ.คนละแห่งเข้าด้วยกัน
       ('กรุงไทย เวสเทิร์น' -> 'กรุงไทย', 'ศิครินทร์ สมุทรปราการ' -> 'ศิครินทร์')
       และห้ามใช้ levenshtein แบบตัดหัวฝั่งยาวให้เท่าฝั่งสั้นด้วย เพราะทุกชื่อที่เป็น
       "คำขึ้นต้นเดียวกัน" จะได้ระยะ 0 ซึ่งคือ false positive ที่แย่ที่สุดเท่าที่เป็นไปได้
       ส่วนต่อท้ายอย่าง 'อินเตอร์เนชั่นแนล' ถูก custKey ตัดทิ้งไปแล้ว จึงไม่ต้องพึ่งการตัดหัว */
    var best = none;
    var kd = digitsOf(k);
    for (i = 0; i < customers.length; i++) {
      var bk = custKey(customers[i].name);
      if (!bk) continue;
      if (digitsOf(bk) !== kd) continue;                       // เลขสาขาไม่ตรง = คนละแห่ง
      if (Math.abs(bk.length - k.length) > 3) continue;        // ยาวต่างกันมาก = คนละชื่อ
      var minLen = Math.min(k.length, bk.length);
      if (minLen < 4) continue;
      var d = levenshtein(k, bk);
      var tol = Math.max(1, Math.round(minLen * 0.15));
      if (d <= tol) {
        var sc = 0.8 + 0.19 * (1 - d / (tol + 1));
        if (sc > best.score) best = { customer:customers[i], score:sc, how:'fuzzy' };
      }
    }
    return best;
  }

  /* จับคู่แบบเข้มงวด: เท่ากันเป๊ะหรือเป็น alias เท่านั้น
     ใช้ตอนนำเข้า "ทะเบียน" ซึ่งทุกแถวคือคนละโรงพยาบาลโดยนิยาม การเดาจึงไม่มีที่ยืน
     ส่วน matchCustomer ที่ยอมเดา ใช้กับการจับคู่ "ข้ามไฟล์" เช่น Contact Log */
  function matchStrict(name, customers) {
    var k = custKey(name);
    if (!k) return { customer:null, score:0, how:'none' };
    for (var i = 0; i < customers.length; i++) {
      if (custKey(customers[i].name) === k) return { customer:customers[i], score:1, how:'exact' };
      var al = customers[i].aliases || [];
      for (var a = 0; a < al.length; a++) {
        if (custKey(al[a]) === k) return { customer:customers[i], score:1, how:'alias' };
      }
    }
    return { customer:null, score:0, how:'none' };
  }

  /* ---- ตัวแปลงค่าของ customers / activities ------------------------------- */
  function leadStatus(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return 'new';
    if (SP.C.LEAD_STATUS[s]) return s;
    if (/นำเสนอ|present|เสนอราคา/i.test(s)) return 'presented';
    if (/ยังไม่|ไม่ได้ติดต่อ|not\s*contact/i.test(s)) return 'new';
    if (/ติดต่อ|contact/i.test(s)) return 'contacted';
    return 'new';
  }
  function priority(raw) {
    var m = String(raw == null ? '' : raw).trim().toUpperCase().match(/[ABC]/);
    return m ? m[0] : 'B';
  }
  /* ช่องทาง: ลำดับสำคัญ — 'walk in - โทรจาก ปชส.' ต้องได้ walkin ไม่ใช่ call
     จึงเช็ค walk-in ก่อน แล้วค่อยไล่ช่องทางที่เจาะจงน้อยลง */
  function channel(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return 'other';
    if (SP.C.ACT_CHANNELS[s]) return s;
    if (/walk\s*in|เดินเข้า|เข้าไปที่/i.test(s)) return 'walkin';
    if (/สาธิต|demo|trial/i.test(s))            return 'demo';
    if (/line|ไลน์/i.test(s))                    return 'line';
    if (/mail|เมล/i.test(s))                     return 'email';
    if (/ประชุม|เข้าพบ|นัดพบ|นัดหมาย|meeting/i.test(s)) return 'meet';
    if (/โทร|call|phone/i.test(s))               return 'call';
    return 'other';
  }
  function actStatus(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return 'todo';
    if (SP.C.ACT_STATUS[s]) return s;
    if (/ทำแล้ว|เสร็จ|done|complete/i.test(s)) return 'done';
    if (/รอ|wait|pending/i.test(s))            return 'waiting';
    return 'todo';
  }
  function registryAction(raw) {
    var s = String(raw == null ? '' : raw).trim().toUpperCase();
    return SP.C.REGISTRY_ACTIONS[s] ? s : '';
  }

  /* ชื่อกับเบอร์อยู่ช่องเดียวกันจริงในชีต: 'คุณวิมล 02 574 5000 ต่อ 8818' */
  function splitContact(raw) {
    var s = SP.U.arabic(raw).trim();
    if (!s) return { name:'', phone:'' };
    var m = s.match(/([\d][\d\s\-()]{6,}(?:\s*ต่อ\s*\d+)?)\s*$/);
    if (!m) return { name:s, phone:'' };
    return { name:s.slice(0, m.index).trim().replace(/[,\-–—]+$/, '').trim(), phone:m[1].trim() };
  }

  /* คืน "ทุก" หมวดที่เข้าเกณฑ์ — 'Kiosk, Queue, Smart OPD' เป็น KIOSK + MEDIQ จริง
     ห้ามแตะ productGroup() เอกพจน์ด้านบน: job พึ่งพฤติกรรม "กฎแรกชนะ" ของมันอยู่ */
  function productGroups(text) {
    var p = String(text == null ? '' : text), out = [];
    for (var k = 0; k < PG_RULES.length; k++) {
      if (PG_RULES[k][1].test(p) && out.indexOf(PG_RULES[k][0]) < 0) out.push(PG_RULES[k][0]);
    }
    return out;
  }

  /* ผูก job ที่ยังไม่มี customerId เข้ากับทะเบียน — เรียกจากสองที่:
     (1) migrate() ตอนอัปเป็น schema 4 ซึ่งตอนนั้น customers[] ยังว่าง = ไม่ทำอะไร
     (2) ท้าย commit ของการ import Master List ซึ่งคือ backfill จริง
     implement ครั้งเดียว สองคนเรียก จึงไม่มีทางเพี้ยนออกจากกัน

     ไม่สร้าง customer จาก job เด็ดขาด — จะกลายเป็นทะเบียนซ้อนทะเบียน
     งานที่ผูกไม่ได้ให้ไปโผล่เป็นรายการ "ยังไม่ผูกลูกค้า" ในแท็บลูกค้าแทน */
  function linkJobsToCustomers(doc) {
    var res = { linked:0, ambiguous:[], unmatched:[] };
    if (!doc || !Array.isArray(doc.jobs) || !Array.isArray(doc.customers)) return res;
    if (!doc.customers.length) return res;
    doc.jobs.forEach(function (j) {
      if (j.customerId) return;
      var r = matchCustomer(j.customerName, doc.customers);
      if (r.customer && r.score >= 0.9) { j.customerId = r.customer.id; res.linked++; }
      else if (r.customer)              { res.ambiguous.push({ job:j, guess:r }); }
      else                              { res.unmatched.push(j); }
    });
    return res;
  }

  function date(raw, refIso) {
    var p = SP.U.parseTH(raw, refIso);
    return p ? p.iso : null;
  }

  /* job เปล่าที่มีทุกฟิลด์ — seed, import และการเพิ่มด้วยมือใช้ตัวเดียวกัน
     เพื่อให้ทุก record มีรูปร่างเดียวกันเสมอ */
  function blankJob(over) {
    var j = {
      id:'', seedBatch:'',
      customerName:'', customerGroup:'รพ.รัฐ', province:'', sectionLabel:'', bedSize:null,
      trialRequestedAt:null, trialPlannedDate:null, trialStart:null, trialEnd:null,
      contacts:[], incumbent:'', intel:'', relatedTo:[], egpProjectId:'',
      product:'', productGroup:'Custom', value:0,
      stage:'S0', budgetCode:'Level 4', budgetYear:'',
      expectedRevenue:null, salesStatus:'', detail:'', remark:'',
      assignedTo:[], interest:'cold',
      isNewThisWeek:false, newSince:null, workStatus:'active',
      blockReason:'', waitingFor:'', waitingOn:'', statusSince:null,
      deliveredAt:null, paid:false, paidAt:null,
      parkedAt:null, parkReason:'', reviveOn:null,
      presentVisible:true, presentOrder:null, highlight:false, weekNote:'',
      stageHistory:[], createdAt:SP.U.nowISO(), updatedAt:SP.U.nowISO()
    };
    if (over) Object.keys(over).forEach(function (k) { j[k] = over[k]; });
    return j;
  }

  /* ล้อแบบเดียวกับ blankJob — seed / import / เพิ่มมือ ต้องได้รูปร่างเดียวกัน
     ไม่มีฟิลด์ nameKey: คีย์ที่ derive ได้ห้าม persist เพราะจะเก่าตอนส่งไฟล์ต่อ
     และทำให้ seed บวมโดยไม่จำเป็น — 115 เรคอร์ดคำนวณสดได้สบาย */
  function blankCustomer(over) {
    var c = {
      id:'', seedBatch:'',
      name:'', aliases:[],
      zone:'', province:'', hospitalType:'', ownerType:'', ownerGroup:'', schemes:'',
      approachDept:'', approachNote:'', fitProducts:'', productGroups:[],
      customerGroup:'รพ.รัฐ', priority:'B', bedSize:null,
      leadStatus:'new', salesOwner:'',
      lastContactAt:null, nextActionAt:null, nextActionNote:'',
      lineNote:'', sourceUrl:'', remark:'',
      registry:{ action:'', similarity:'', reason:'', reviewedAt:null },
      active:true, createdAt:SP.U.nowISO(), updatedAt:SP.U.nowISO()
    };
    if (over) Object.keys(over).forEach(function (k) { c[k] = over[k]; });
    return c;
  }
  function blankContact(over) {
    var k = {
      id:'', customerId:'', name:'', role:'', phone:'', email:'', line:'',
      isPrimary:false, note:'', active:true,
      createdAt:SP.U.nowISO(), updatedAt:SP.U.nowISO()
    };
    if (over) Object.keys(over).forEach(function (x) { k[x] = over[x]; });
    return k;
  }
  function blankActivity(over) {
    var a = {
      id:'', seedBatch:'', importKey:'',
      customerId:null, contactId:null, jobId:null,
      date:null, doneDate:null,
      channel:'other', channelNote:'',
      topic:'', result:'', nextAction:'',
      followUpAt:null, followUpNote:'',
      status:'todo', owner:'', lineNote:'',
      createdAt:SP.U.nowISO(), updatedAt:SP.U.nowISO()
    };
    if (over) Object.keys(over).forEach(function (k) { a[k] = over[k]; });
    return a;
  }

  return {
    value:value, budget:budget, stage:stage, legacyStage:legacyStage, productGroup:productGroup,
    customerGroup:customerGroup, interest:interest, date:date,
    key:key, jobKey:jobKey, levenshtein:levenshtein,
    custKey:custKey, matchCustomer:matchCustomer, matchStrict:matchStrict, digitsOf:digitsOf,
    leadStatus:leadStatus, priority:priority, channel:channel, actStatus:actStatus,
    registryAction:registryAction, splitContact:splitContact, productGroups:productGroups,
    linkJobsToCustomers:linkJobsToCustomers,
    sectionLabel:sectionLabel, isSectionRow:isSectionRow,
    blankJob:blankJob, blankCustomer:blankCustomer, blankContact:blankContact, blankActivity:blankActivity,
    PG_RULES:PG_RULES
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 05 — UIKIT + ACTIONS + RENDER ROUTER
   modal/toast เขียนเอง ไม่พึ่ง Bootstrap JS — ตัด dependency เชิงฟังก์ชันตัวเดียว
   ที่เหลืออยู่ออก ทำให้หน้านี้ทำงานครบแม้ไม่มีเน็ตเลย
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Modal = (function () {
  'use strict';
  var U = SP.U, layer = null, cbs = {};

  function el() { return layer || (layer = document.getElementById('modal-layer')); }

  /* opts: {title, icon, html, buttons:[{label,cls,id,keep}], onClick(id)} */
  function open(opts) {
    cbs = {}; cbs.onClick = opts.onClick || function () {};
    var btns = (opts.buttons || [{ label:'ปิด', id:'close', cls:'btn' }]).map(function (b) {
      return '<button class="' + (b.cls || 'btn') + '" data-act="modal:btn" data-id="' + U.attr(b.id) + '">' +
             (b.icon ? U.ic(b.icon) : '') + U.esc(b.label) + '</button>';
    }).join('');
    el().innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>' + (opts.icon ? U.ic(opts.icon, 'ic-lg') : '') + U.esc(opts.title || '') + '</h3>' +
        '<div>' + (opts.html || '') + '</div>' +
        '<div class="modal-ft">' + btns + '</div>' +
      '</div>';
    var first = el().querySelector('input,select,textarea,button');
    if (first) try { first.focus(); } catch (e) {}
  }
  function close() {
    var fn = cbs.onClose;
    el().innerHTML = '';
    cbs = {};
    if (fn) fn();
  }
  function click(id) {
    var fn = cbs.onClick;
    var keepOpen = fn ? fn(id, el()) : false;
    if (!keepOpen) close();
  }
  function isOpen() { return !!el().innerHTML; }

  /* ยืนยันแบบง่าย — ใช้แทน window.confirm ทั้งหมด เพื่อให้ข้อความไทยจัดรูปแบบได้ */
  function confirm(opts, onYes) {
    open({
      title: opts.title, icon: opts.icon || 'alert',
      html: opts.html || '',
      buttons: [
        { label: opts.cancel || 'ยกเลิก', id:'no', cls:'btn' },
        { label: opts.ok || 'ยืนยัน', id:'yes', cls: opts.danger ? 'btn btn-danger' : 'btn btn-primary' }
      ],
      onClick: function (id) { if (id === 'yes') onYes(); }
    });
  }
  return { open:open, close:close, click:click, confirm:confirm, isOpen:isOpen, el:el };
})();

SP.Toast = (function () {
  'use strict';
  function show(msg, kind, ms) {
    var l = document.getElementById('toast-layer');
    var d = document.createElement('div');
    d.className = 'toast ' + (kind || '');
    d.innerHTML = SP.U.ic(kind === 'bad' ? 'alert' : (kind === 'warn' ? 'info' : 'check-circle')) +
                  '<span>' + SP.U.esc(msg) + '</span>';
    l.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, ms || 4200);
  }
  return { show:show };
})();

/* --------------------------------------------------------------------------
   ACTIONS — event delegation ทั้งหน้า ไม่มี inline onclick แม้แต่ที่เดียว
   เหตุผล: ชื่อ รพ. หรือข้อความ blockReason ที่มี ' จะทำ handler ในแอตทริบิวต์พัง
   และ innerHTML re-render ทำให้ไม่มีอะไรให้ re-bind อยู่แล้ว
   -------------------------------------------------------------------------- */
SP.Actions = (function () {
  'use strict';
  var map = {};
  function on(name, fn) { map[name] = fn; }
  function run(name, ds, ev) {
    var fn = map[name];
    if (!fn) { console.warn('ไม่รู้จัก action:', name); return; }
    try { fn(ds, ev); } catch (e) { console.error('action ' + name + ' ล้มเหลว', e); SP.Toast.show('เกิดข้อผิดพลาด: ' + e.message, 'bad'); }
  }

  /* data-field="<coll>:<id>:<field>" หรือ "meta:<field>" / "settings:<field>" */
  function readEl(t) {
    if (t.type === 'checkbox') return t.checked;
    if (t.type === 'number') return t.value === '' ? null : Number(t.value);
    if (t.multiple) return Array.prototype.slice.call(t.selectedOptions).map(function (o) { return o.value; });
    return t.value;
  }
  function field(t, rerender) {
    var spec = (t.getAttribute('data-field') || '').split(':');
    var v = readEl(t);
    if (spec[0] === 'meta')     { SP.state.meta[spec[1]] = v; SP.Store.touch(); }
    else if (spec[0] === 'settings') { SP.state.settings[spec[1]] = v; SP.Store.touch(); }
    /* settings.brand เป็น object ซ้อน จึงเข้าทางเดิม ("settings:<field>") ไม่ได้ */
    else if (spec[0] === 'brand') {
      SP.state.settings.brand = SP.state.settings.brand || {};
      SP.state.settings.brand[spec[1]] = v;
      SP.Store.touch();
    }
    else if (spec[0] === 'ui')  { SP.ui[spec[1]] = v; SP.Store.saveUI(); }
    else {
      var changes = {}; changes[spec[2]] = v;
      SP.Hooks.beforeField(spec[0], spec[1], spec[2], v, t);
      SP.Store.patch(spec[0], spec[1], changes);
      SP.Hooks.afterField(spec[0], spec[1], spec[2], v, t);
    }
    if (rerender) SP.Render.current();
  }
  return { on:on, run:run, field:field, map:map };
})();

/* hook points ที่ view ต่าง ๆ เอาไปเสียบ (เช่น validation ตอนเปลี่ยน workStatus)

   เป็น "ทะเบียน" ไม่ใช่ช่องเดียว เพราะเดิมเป็น object ที่ใครก็ assign ทับได้
   และ BLOCK 06 ก็ assign ทับไปแล้วจริง ๆ — บล็อกที่มาทีหลังแล้วเขียน
   SP.Hooks.beforeField = ... จะคอมไพล์ผ่านและดูปกติทุกอย่าง ขณะที่ฆ่า
   การบันทึก stageHistory และการตรวจ workStatus ของ BLOCK 06 ไปเงียบ ๆ */
SP.Hooks = (function () {
  var pre = [], post = [];
  return {
    before: function (fn) { pre.push(fn); },
    after:  function (fn) { post.push(fn); },
    beforeField: function () {
      var a = arguments;
      pre.forEach(function (f) { try { f.apply(null, a); } catch (e) { console.error('hook before ล้มเหลว', e); } });
    },
    afterField: function () {
      var a = arguments;
      post.forEach(function (f) { try { f.apply(null, a); } catch (e) { console.error('hook after ล้มเหลว', e); } });
    }
  };
})();

/* --------------------------------------------------------------------------
   RENDER ROUTER
   -------------------------------------------------------------------------- */
SP.Render = (function () {
  'use strict';
  var U = SP.U, C = SP.C;
  var views = {};                    // id -> render function (แต่ละ view ลงทะเบียนเอง)
  function register(id, fn) { views[id] = fn; }

  function counts() {
    var s = SP.state;
    return {
      week: s.jobs.filter(function (j) { return j.isNewThisWeek; }).length,
      board: s.jobs.length,
      /* ตัวเลขบนแท็บต้องเป็น "สิ่งที่ต้องลงมือ" ไม่ใช่ยอดรวม — ลูกค้าที่ยังไม่ติดต่อ
         และการติดต่อที่ยังไม่ปิด คือสองอย่างที่ค้างอยู่จริง */
      customers: (s.customers || []).filter(function (c) { return c.active && c.leadStatus === 'new'; }).length,
      activity: (s.activities || []).filter(function (a) { return a.status !== 'done'; }).length,
      plan: s.plans.filter(function (p) { return !p.done; }).length,
      discuss: s.discussions.filter(function (d) { return d.status === 'open'; }).length
    };
  }

  function header() {
    var s = SP.state, m = s.meta, n = counts();
    var dirty = (m.editsSinceSave || 0) > 0;
    var badge = dirty
      ? '<span class="savebadge dirty" title="ยังไม่ได้บันทึกเป็นไฟล์"><span class="dot"></span>แก้ไข ' +
        m.editsSinceSave + ' ครั้ง หลังบันทึกไฟล์รอบที่ ' + (m.revision || 1) + '</span>'
      : '<span class="savebadge clean">' + U.ic('check-circle') + 'รอบที่ ' + (m.revision || 1) +
        (m.savedBy ? ' · ' + U.esc(m.savedBy) : '') +
        (m.savedAt ? ' · ' + U.esc(U.fmtDate(m.savedAt, 'datetime')) : ' · ยังไม่เคยบันทึกไฟล์') + '</span>';

    if (SP.Sync && SP.Sync.online()) badge = SP.Sync.badge();
    var memWarn = (SP.Sync && SP.Sync.online()) ? SP.Sync.banner() : SP.Store.mode() === 'memory'
      ? '<div class="wrap"><div class="banner banner-bad" style="margin:8px 0">' + U.ic('alert') +
        '<div><b>เบราว์เซอร์นี้บันทึกอัตโนมัติไม่ได้</b><br>ข้อมูลอยู่ในหน่วยความจำเท่านั้น — ' +
        'ไปที่แท็บ “ตั้งค่า” แล้วกด “บันทึกเป็นไฟล์ HTML” ก่อนปิดหน้าต่าง</div>' +
        '<button class="btn btn-sm btn-primary" data-act="export:html">' + U.ic('save') + 'บันทึกเลย</button>' +
        '</div></div>'
      : '';

    var tabs = C.TABS.map(function (t) {
      var c = n[t.id];
      return '<button class="tab" role="tab" aria-selected="' + (SP.ui.activeTab === t.id) + '" ' +
             'data-act="tab" data-id="' + t.id + '">' + U.ic(t.icon) + U.esc(t.th) +
             (c ? '<span class="count">' + c + '</span>' : '') + '</button>';
    }).join('');

    document.getElementById('app-header').innerHTML =
      '<div class="wrap hdr-top">' +
        '<div class="brand">' +
          /* โลโก้แบบคำกินพื้นที่แนวนอน และมีชื่อบริษัทอยู่ในตัวแล้ว จึงไม่พิมพ์ซ้ำ
             ส่วนโลโก้แบบไอคอน/ค่าเริ่มต้น ยังใช้กรอบสี่เหลี่ยมคู่กับชื่อเหมือนเดิม */
          (U.brandIsWide()
            ? '<span class="brand-wordmark">' + U.brandMark('') + '</span>' +
              '<span><span class="brand-title">' + U.esc(m.title) + '</span>' +
              '<span class="brand-sub">' + U.esc(U.weekLabel(m.weekOf)) + '</span></span>'
            : '<span class="brand-mark">' + U.brandMark('ic-lg') + '</span>' +
              '<span><span class="brand-title">' + U.esc((SP.state.settings.brand || {}).name || 'AndamanTech') + '</span>' +
              '<span class="brand-sub">' + U.esc(m.title) + ' · ' + U.esc(U.weekLabel(m.weekOf)) + '</span></span>') +
        '</div>' +
        '<label class="week-pick" title="สัปดาห์ของเอกสารนี้ — แก้ได้ ไม่ใช่คำนวณล้วน">' +
          U.ic('calendar') +
          '<input type="date" data-field="meta:weekOf" value="' + U.attr(m.weekOf) + '" aria-label="สัปดาห์ของเอกสาร">' +
        '</label>' +
        '<span class="spacer"></span>' +
        /* ปุ่มบันทึกเป็นไฟล์ HTML ถูกถอดออกจาก header ตามที่ผู้ใช้ขอ
           ยังเรียกได้จากแท็บ "ตั้งค่า" (data-act="export:html" อันเดิม) */
        '<div class="hdr-actions">' + badge +
          '<button class="btn btn-dark" data-act="report:print">' + U.ic('print') + 'พิมพ์ / PDF</button>' +
        '</div>' +
      '</div>' +
      memWarn +
      '<div class="wrap"><div class="tabs" role="tablist">' + tabs + '</div></div>';
    // ชื่อบริษัทนำหน้าเสมอ — แท็บเบราว์เซอร์หลายอันเปิดพร้อมกันจะได้แยกออก
    document.title = ((SP.state.settings.brand || {}).name || 'AndamanTech') + ' — ' + m.title;
  }

  function view(id) {
    var host = document.getElementById('view-' + id);
    if (!host) return;
    host.innerHTML = views[id] ? views[id]() : '';
  }
  function current() {
    header();
    view(SP.ui.activeTab);
    if (SP.JobEdit && SP.JobEdit.sync) SP.JobEdit.sync();
  }
  function all() {
    header();
    C.TABS.forEach(function (t) {
      var host = document.getElementById('view-' + t.id);
      if (host) host.hidden = (t.id !== SP.ui.activeTab);
    });
    view(SP.ui.activeTab);
  }
  function tab(id) {
    SP.ui.activeTab = id;
    SP.Store.saveUI();
    all();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  return { register:register, header:header, view:view, current:current, all:all, tab:tab, counts:counts };
})();


/* --------------------------------------------------------------------------
   DRAWER — แผงเลื่อนจากขวา ใช้กับฟอร์มที่มีหลายช่อง (เพิ่ม/แก้แผนงาน)
   ดีกว่าแก้ในบรรทัด: ช่องกว้างพอ ป้ายกำกับครบ และไม่ทำให้การ์ดกระโดด
   -------------------------------------------------------------------------- */
SP.Drawer = (function () {
  'use strict';
  var U = SP.U, cbs = {};
  function el() { return document.getElementById('drawer-layer'); }

  /* opts: {title, icon, html, wide, buttons:[{label,cls,id,icon}], onClick(id, root), onClose()} */
  function open(opts) {
    cbs.onClick = opts.onClick || function () {};
    cbs.onClose = opts.onClose || null;
    var btns = (opts.buttons || []).map(function (b) {
      return '<button class="' + (b.cls || 'btn') + '" data-act="drawer:btn" data-id="' + U.attr(b.id) + '">' +
             (b.icon ? U.ic(b.icon) : '') + U.esc(b.label) + '</button>';
    }).join('');
    el().innerHTML =
      '<div class="drawer-back" data-act="drawer:close"></div>' +
      '<aside class="drawer' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
        '<div class="drawer-hd">' + (opts.icon ? U.ic(opts.icon, 'ic-lg') : '') +
          '<h3>' + U.esc(opts.title || '') + '</h3>' +
          '<button class="btn btn-icon btn-ghost" data-act="drawer:close" aria-label="ปิด">' + U.ic('close') + '</button>' +
        '</div>' +
        '<div class="drawer-bd">' + (opts.html || '') + '</div>' +
        '<div class="drawer-ft">' + btns + '</div>' +
      '</aside>';
    var first = el().querySelector('.drawer-bd textarea, .drawer-bd input, .drawer-bd select');
    if (first) try { first.focus(); } catch (e) {}
  }
  function close() {
    var fn = cbs.onClose;
    el().innerHTML = '';
    cbs = {};
    if (fn) fn();
  }
  function isOpen() { return !!el().innerHTML; }
  function click(id) {
    var keep = cbs.onClick ? cbs.onClick(id, el()) : false;
    if (!keep) close();
  }
  /* วาดเนื้อหาใหม่โดยไม่ปิด drawer — ใช้กับฟอร์มที่ผูกข้อมูลแบบสด */
  function setBody(html) {
    var bd = el().querySelector('.drawer-bd');
    if (bd) bd.innerHTML = html;
  }
  function val(sel) {
    var n = el().querySelector(sel);
    return n ? n.value : '';
  }
  return { open:open, close:close, click:click, isOpen:isOpen, el:el, val:val, setBody:setBody };
})();

SP.Actions.on('drawer:btn',   function (ds) { SP.Drawer.click(ds.id); });
SP.Actions.on('drawer:close', function ()   { SP.Drawer.close(); });

/* --------------------------------------------------------------------------
   SP.Menu — ปุ่มตัวกรองแบบติ๊กหลายค่า
   ใช้แทนแถวชิป เพราะบางหมวดมีสิบกว่าค่า (โซน) กางเป็นชิปแล้วกินไปทั้งบรรทัด
   และใช้แทน <select> เพราะ select เลือกได้ค่าเดียว

   สถานะเปิด/ปิดอยู่ในตัวแปรของโมดูล ไม่ใช่ SP.ui ตั้งใจ: มันต้องอยู่รอดแค่ข้ามการ
   วาดใหม่ (ทุกครั้งที่ติ๊ก หน้าถูกวาดใหม่ทั้งก้อน) ไม่ต้องรอดข้ามการรีโหลด —
   ถ้าเก็บลง SP.ui เมนูจะค้างเปิดอยู่ตอนเปิดไฟล์ครั้งถัดไป
   -------------------------------------------------------------------------- */
SP.Menu = (function () {
  'use strict';
  var U = SP.U, open = '';

  function labelOf(entries, v) {
    for (var i = 0; i < entries.length; i++) if (entries[i][0] === v) return entries[i][1];
    return v;
  }
  function toggle(k) { open = (open === k) ? '' : k; SP.Render.current(); }

  /* o = { mkey, label, entries:[[value,label],...], selected:[], act, k }
     act = ชื่อ action ที่จะยิงตอนติ๊ก จะได้ ds.k กับ ds.v (v ว่าง = ล้างหมวดนี้) */
  function render(o) {
    var cur = o.selected || [], on = open === o.mkey;
    var sum = !cur.length ? 'ทั้งหมด'
            : cur.length === 1 ? labelOf(o.entries, cur[0])
            : cur.length + ' ค่า';
    return '<span class="dd">' +
      '<button class="btn btn-sm" data-act="menu:toggle" data-k="' + U.attr(o.mkey) + '" aria-expanded="' + on + '">' +
        '<span class="muted">' + U.esc(o.label) + '</span>' +
        '<b' + (cur.length ? ' class="on"' : '') + '>' + U.esc(sum) + '</b>' +
        U.ic(on ? 'chevron-up' : 'chevron-down') +
      '</button>' +
      (on
        ? '<span class="dd-panel">' +
            o.entries.map(function (e) {
              return '<label class="check dd-item"><input type="checkbox"' +
                (cur.indexOf(e[0]) >= 0 ? ' checked' : '') +
                ' data-act-change="' + U.attr(o.act) + '" data-k="' + U.attr(o.k) +
                '" data-v="' + U.attr(e[0]) + '">' + U.esc(e[1]) + '</label>';
            }).join('') +
            (cur.length
              ? '<button class="btn btn-xs btn-ghost dd-clear" data-act="' + U.attr(o.act) +
                '" data-k="' + U.attr(o.k) + '" data-v="">' + U.ic('refresh') + 'ล้างตัวเลือก</button>'
              : '') +
          '</span>'
        : '') +
    '</span>';
  }

  /* ตัวช่วยสลับค่าใน array ของตัวกรอง — v ว่างแปลว่า "ล้างหมวดนี้" ไม่ใช่ "เลือกทุกค่า" */
  function pick(bag, k, v) {
    var cur = Array.isArray(bag[k]) ? bag[k] : [];
    if (!v) { bag[k] = []; return; }
    var i = cur.indexOf(v);
    bag[k] = (i >= 0) ? cur.filter(function (x) { return x !== v; }) : cur.concat([v]);
  }

  /* ค่าที่เคยเก็บเป็นสตริงเดี่ยวก่อนรองรับหลายค่า ยังค้างอยู่ใน spw_v1_ui ของเครื่องเดิม
     ต้องแปลงตอนอ่าน ไม่งั้น indexOf จะไปวิ่งบนสตริงแล้วกรองมั่ว */
  function toArrays(bag, keys) {
    keys.forEach(function (k) { if (!Array.isArray(bag[k])) bag[k] = bag[k] ? [bag[k]] : []; });
    return bag;
  }

  /* คลิกนอกเมนูให้หุบ — เลื่อนการวาดใหม่ออกไปหนึ่งรอบ เพื่อให้ handler ของปุ่มที่ถูกคลิก
     ทำงานจบก่อน ไม่งั้นปุ่มจะหลุดจาก DOM กลางคัน */
  document.addEventListener('click', function (ev) {
    if (!open) return;
    if (ev.target.closest && ev.target.closest('.dd')) return;
    setTimeout(function () { if (open) { open = ''; SP.Render.current(); } }, 0);
  });

  return { render:render, toggle:toggle, pick:pick, toArrays:toArrays };
})();

SP.Actions.on('tab',        function (ds) { SP.Render.tab(ds.id); });

<script>
/* ============================================================================
   BLOCK 06 — VIEW: board  (+ SP.JobCard ที่ view อื่นเรียกใช้ร่วมกัน)
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.JobCard = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  function stuckDays(j) {
    if (j.workStatus !== 'blocked' && j.workStatus !== 'waiting') return null;
    return U.daysSince(j.statusSince);
  }

  /* แสดงเฉพาะงานที่เลือกไว้บนการ์ดนี้เท่านั้น — ไม่ไล่ลิงก์ย้อนกลับ
     เพราะโครงการส่วนใหญ่เป็นโครงการเดี่ยว การโผล่ของงานที่เจ้าของการ์ดไม่เคยเลือก
     ทำให้อ่านแล้วงงมากกว่าช่วย · ไม่เลือก = ไม่แสดงหัวข้อนี้เลย */
  function relatedJobs(j) {
    return (j.relatedTo || [])
      .map(function (id) { return SP.U.byId(SP.state.jobs, id); })
      .filter(function (o) { return o && o.id !== j.id; });
  }

  /* opts: {compact, showIntel, editable} */
  function render(j, opts) {
    opts = opts || {};
    var days = stuckDays(j);
    var cls = 'job';
    if (!j.presentVisible) cls += ' hidden-present';
    if (days !== null && days > 21) cls += ' stuck';
    var col = C.STAGE_COLORS[j.stage] || '#A3A3A3';
    var isOpen = !!(SP.ui.openJobs && SP.ui.openJobs[j.id]);
    if (isOpen) cls += ' open';

    var acts = opts.editable === false ? '' :
      '<div class="job-acts">' +
        (j.highlight
          ? '<button class="btn btn-icon btn-ghost" style="color:#F79009" data-act="job:highlight" data-id="' + j.id + '" title="เลิกปักหมุดจากหน้าปก" aria-label="เลิกปักหมุด">' + U.ic('star') + '</button>'
          : '<button class="btn btn-icon btn-ghost muted" data-act="job:highlight" data-id="' + j.id + '" title="ปักหมุดขึ้นหน้าปกสไลด์" aria-label="ปักหมุด">' + U.ic('star') + '</button>') +
        '<button class="btn btn-icon btn-ghost ' + (j.presentVisible ? 'muted' : '') + '" data-act="job:present" data-id="' + j.id + '" ' +
          'title="' + (j.presentVisible ? 'ซ่อนงานนี้จากรายงานสรุป' : 'แสดงงานนี้ในรายงานสรุป') + '" ' +
          'aria-label="' + (j.presentVisible ? 'ซ่อนจากรายงาน' : 'แสดงในรายงาน') + '">' +
          U.ic(j.presentVisible ? 'eye' : 'eye-off') + '</button>' +
        '<button class="btn btn-icon btn-ghost muted" data-act="job:edit" data-id="' + j.id + '" title="แก้ไขงานนี้" aria-label="แก้ไข">' +
          U.ic('edit') + '</button>' +
      '</div>';

    var meta = [];
    meta.push(U.stageBadge(j.stage));
    meta.push(U.groupBadge(j.productGroup));
    meta.push(U.levelBadge(j.budgetCode));
    if (j.budgetYear) meta.push('<span class="badge badge-soft">ปีงบ ' + U.esc(j.budgetYear) + '</span>');
    if (j.isNewThisWeek) meta.push('<span class="badge" style="background:#ECFDF3;color:#027A48">' + U.ic('new') + 'ใหม่สัปดาห์นี้</span>');
    var sb = U.statusBadge(j.workStatus);
    if (sb) meta.push(sb);
    if (!j.presentVisible) meta.push('<span class="badge badge-soft">' + U.ic('eye-off') + 'ซ่อนจากรายงาน</span>');

    var sub = [];
    if (j.customerGroup) sub.push(U.esc(j.customerGroup));
    if (j.province) sub.push(U.ic('map-pin') + U.esc(j.province));
    if (j.bedSize) sub.push(U.ic('bed') + U.esc(j.bedSize) + ' เตียง');
    if (j.incumbent) sub.push(U.ic('shield') + 'ระบบเดิม: ' + U.esc(j.incumbent));

    var reason = '';
    if ((j.workStatus === 'blocked' || j.workStatus === 'hold') && j.blockReason) {
      var hold = j.workStatus === 'hold';
      reason = '<div class="job-note" style="background:' + (hold ? '#F5F5F5;color:#333333' : '#FEF3F2;color:#912018') + '">' +
               U.ic(hold ? 'pause' : 'blocked') +
               ' <b>' + (hold ? 'Hold:' : 'หยุดเพราะ:') + '</b> ' + U.nl2br(j.blockReason) +
               (days !== null ? ' <span class="tiny">· ค้างมา ' + days + ' วัน</span>' : '') + '</div>';
    } else if (j.workStatus === 'waiting' && j.waitingFor) {
      reason = '<div class="job-note" style="background:#FFFAEB;color:#93370D">' + U.ic('clock') +
               ' <b>รอ' + (j.waitingOn ? U.esc(j.waitingOn) : '') + ':</b> ' + U.nl2br(j.waitingFor) +
               (days !== null ? ' <span class="tiny">· รอมา ' + days + ' วัน</span>' : '') + '</div>';
    }

    /* Trial: ขั้น S2 ต้องรู้ว่ารอมากี่วันแล้ว · S3 ต้องรู้ว่าเหลือกี่วันก่อนต้องสรุปผล */
    var t = U.trialInfo(j);
    var trial = '';
    if (t.mode !== 'none') {
      var tcls = t.mode === 'overdue' ? 'trial bad' : (t.warn ? 'trial warn' : 'trial');
      var bar = '';
      if (t.mode === 'running' && t.total) {
        bar = '<span class="trial-bar"><i style="width:' +
              Math.max(2, Math.min(100, Math.round(t.day / t.total * 100))) + '%"></i></span>';
      }
      trial = '<div class="' + tcls + '">' + U.ic(t.mode === 'waiting' || t.mode === 'scheduled' ? 'clock' : 'target') +
              '<span>' + U.esc(U.trialText(j)) + '</span>' + bar + '</div>';
    }

    /* ส่งมอบ/ชำระเงิน -- ใช้สีบอกสถานะ เขียว = เงินเข้าแล้ว, เหลือง/แดง = ยังค้าง */
    var dv = U.deliveryInfo(j);
    var delivery = '';
    if (dv.mode !== 'none') {
      var dcls = dv.mode === 'paid' ? 'trial paid' : (dv.warn ? 'trial bad' : 'trial warn');
      delivery = '<div class="' + dcls + '">' + U.ic(dv.mode === 'paid' ? 'check-circle' : 'money') +
                 '<span>' + U.esc(U.deliveryText(j)) + '</span></div>';
    }

    /* พักงาน -- เทาปกติ, แดงเมื่อเลยวันนัดทบทวนหรือพักเกิน 90 วันโดยไม่มีกำหนด */
    var pk = U.parkInfo(j);
    var park = '';
    if (pk.mode !== 'none') {
      park = '<div class="' + (pk.warn ? 'trial bad' : 'trial park') + '">' + U.ic('pause') +
             '<span>' + U.esc(U.parkText(j)) + '</span></div>' +
             (j.parkReason
               ? '<div class="job-note" style="background:#F5F5F5;color:#333333">' + U.ic('pause') +
                 ' <b>ไม่ได้ทำต่อเพราะ:</b> ' + U.nl2br(j.parkReason) + '</div>'
               : '<div class="job-note" style="background:#FEF3F2;color:#912018">' + U.ic('alert') +
                 ' ยังไม่ได้ระบุเหตุผลที่ไม่ได้ทำต่อ</div>');
    }

    var rel = relatedJobs(j);
    var relHtml = rel.length
      ? '<div class="job-meta">' + U.ic('link') + '<span class="tiny muted">งานที่เกี่ยวข้อง:</span> ' +
        rel.map(function (r) {
          return '<button class="chip chip-btn tiny" data-act="job:goto" data-id="' + r.id + '" style="padding-left:8px">' +
                 U.esc(r.customerName) + ' — ' + U.esc(r.product) + '</button>';
        }).join(' ') + '</div>'
      : '';

    /* intel: กล่องเหลืองติดป้ายชัดว่าไม่ขึ้นในรายงาน ให้คนกรอกรู้ตัวตั้งแต่พิมพ์ */
    var intel = (j.intel && opts.showIntel !== false)
      ? '<div class="intel"><div class="intel-hd">' + U.ic('eye-off') + 'ข้อมูลวงใน — ไม่ขึ้นในรายงาน</div>' + U.nl2br(j.intel) + '</div>'
      : '';

    /* รายละเอียด / หมายเหตุ / ผู้ติดต่อ — เดิมดูได้แต่ในฟอร์มแก้ไข
       ย้ายมาโชว์ในส่วนที่คลี่ดูได้ จะได้อ่านจากบอร์ดตรง ๆ ไม่ต้องเปิดฟอร์ม */
    var detailHtml = j.detail
      ? '<div class="job-note"><b>รายละเอียด:</b> ' + U.nl2br(j.detail) + '</div>' : '';
    var remarkHtml = j.remark
      ? '<div class="job-note"><b>หมายเหตุ:</b> ' + U.nl2br(j.remark) + '</div>' : '';
    var people = (j.contacts || []).filter(function (c) { return c.name || c.role; });
    var contactHtml = people.length
      ? '<div class="job-meta tiny">' + U.ic('user', 'muted') + people.map(function (c) {
          return '<span class="chip tiny" style="padding-left:8px">' +
                 U.esc(c.name || '—') + (c.role ? ' · ' + U.esc(c.role) : '') + '</span>';
        }).join(' ') + '</div>'
      : '';
    var egpHtml = j.egpProjectId
      ? '<div class="job-meta tiny muted">' + U.ic('sheet') + ' e-GP: ' + U.esc(j.egpProjectId) + '</div>' : '';

    /* ป้ายบอกว่าข้างในมีอะไร จะได้รู้ว่าควรกดคลี่ใบไหน โดยไม่ต้องคลี่ทุกใบ */
    var peek = [];
    if (j.detail) peek.push(U.ic('sheet') + 'รายละเอียด');
    if (j.weekNote) peek.push(U.ic('info') + 'บันทึกสัปดาห์');
    if (people.length) peek.push(U.ic('user') + 'ผู้ติดต่อ ' + people.length);
    if (j.blockReason || j.waitingFor) peek.push(U.ic('alert') + 'มีเหตุผลค้าง');
    if (t.mode !== 'none') peek.push(U.ic('target') + 'Trial');
    if (dv.mode !== 'none') peek.push(U.ic('money') + (dv.mode === 'paid' ? 'ชำระแล้ว' : 'รอชำระเงิน'));
    if (pk.mode !== 'none') peek.push(U.ic('pause') + 'ไม่ได้ทำต่อ');
    if (rel.length) peek.push(U.ic('link') + 'เกี่ยวข้อง ' + rel.length);
    if (j.intel) peek.push(U.ic('eye-off') + 'ข้อมูลวงใน');
    var peekHtml = (!isOpen && peek.length)
      ? '<div class="peek">' + peek.map(function (x) { return '<span class="badge">' + x + '</span>'; }).join('') + '</div>'
      : '';

    return '<article class="' + cls + '" style="border-color:' + col + '" data-job="' + j.id + '">' +
      '<div class="job-hd" data-act="job:fold" data-id="' + j.id + '" ' +
        'title="' + (isOpen ? 'ยุบการ์ด' : 'คลี่ดูรายละเอียด') + '">' +
        U.ic('chevron-down', 'job-fold') +
        '<div class="job-name">' + U.ic('hospital', 'muted') + ' ' + U.esc(j.customerName) +
          (j.product ? '<div class="small muted" style="font-weight:400">' + U.esc(j.product) + '</div>' : '') +
        '</div>' + acts +
      '</div>' +
      '<div class="job-meta">' + meta.join(' ') + '</div>' +
      '<div class="job-meta"><span class="small muted">มูลค่า</span> ' + U.moneyOrPending(j.value) +
        (j.value > 0 ? '<span class="small muted">· คาดได้ ' + U.esc(U.money(C.jobExpected(j))) + '</span>' : '') +
      '</div>' +
      peekHtml +
      '<div class="job-body">' +
        (sub.length ? '<div class="job-meta tiny muted">' + sub.join(' · ') + '</div>' : '') +
        '<div class="job-meta">' + U.ownersChips(j.assignedTo, { addBtn:true }) + '</div>' +
        contactHtml + egpHtml +
        (j.weekNote ? '<div class="job-note">' + U.ic('info') + ' ' + U.nl2br(j.weekNote) + '</div>' : '') +
        detailHtml + remarkHtml +
        trial + delivery + park + reason + relHtml + intel +
      '</div>' +
    '</article>';
  }

  return { render:render, stuckDays:stuckDays, relatedJobs:relatedJobs };
})();

SP.JobEdit = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  function ownerPicker(j) {
    var owners = SP.state.owners.filter(function (o) { return o.active; });
    var mine = U.normNames(j.assignedTo);
    return owners.map(function (o) {
      var on = mine.indexOf(o.name) >= 0;

             '" data-name="' + U.attr(o.name) + '" style="padding-left:3px">' +
             '<span class="avatar" style="background:' + o.color + '">' + U.esc(U.initials(o.short || o.name)) + '</span>' +
             U.esc(o.name) + '</button>';

  }

  function contactsEditor(j) {
    var rows = (j.contacts || []).map(function (c, i) {
      return '<div class="field-row" style="align-items:flex-end">' +
        '<div class="field" style="flex:1 1 130px"><input class="inp" placeholder="ชื่อผู้ติดต่อ" value="' + U.attr(c.name) +
          '" data-act-input="contact" data-id="' + j.id + '" data-i="' + i + '" data-k="name"></div>' +
        '<div class="field" style="flex:1 1 110px"><input class="inp" placeholder="ตำแหน่ง/ฝ่าย" value="' + U.attr(c.role) +
          '" data-act-input="contact" data-id="' + j.id + '" data-i="' + i + '" data-k="role"></div>' +
        '<div class="field" style="flex:2 1 160px"><input class="inp" placeholder="บันทึก" value="' + U.attr(c.note || '') +
          '" data-act-input="contact" data-id="' + j.id + '" data-i="' + i + '" data-k="note"></div>' +
        '<button class="btn btn-icon btn-danger" data-act="job:contact-del" data-id="' + j.id + '" data-i="' + i +
          '" title="ลบผู้ติดต่อ" aria-label="ลบผู้ติดต่อ" style="margin-bottom:11px">' + U.ic('trash') + '</button>' +
      '</div>';
    }).join('');
    return rows + '<button class="btn btn-sm" data-act="job:contact-add" data-id="' + j.id + '">' + U.ic('plus') + 'เพิ่มผู้ติดต่อ</button>';
  }

  function relatedEditor(j) {
    var others = SP.state.jobs.filter(function (o) { return o.id !== j.id; });
    if (!others.length) {
      return '<div class="hint">ยังไม่มีงานอื่นในระบบให้เชื่อมโยง</div>';
    }
    var cur = j.relatedTo || [];
    return '<div class="rel-pick">' + others.map(function (o) {
      var on = cur.indexOf(o.id) >= 0;
      var g = C.group(o.productGroup);
      return '<button class="chip chip-btn" aria-pressed="' + on + '" ' +
        'data-act="job:related" data-id="' + j.id + '" data-rel="' + o.id + '" ' +
        'title="' + U.attr((on ? 'เอาออกจาก' : 'เพิ่มเป็น') + 'งานที่เกี่ยวข้อง') + '">' +
        U.ic(on ? 'check' : 'plus') +
        '<span style="color:' + (on ? 'inherit' : g.color) + '">' + U.ic(g.icon) + '</span>' +
        U.esc(o.customerName + (o.product ? ' — ' + o.product : '')) +
      '</button>';
    }).join(' ') + '</div>' +
    '<div class="hint">' + (cur.length ? 'เลือกไว้ ' + cur.length + ' งาน' : 'ไม่เลือกก็ได้ — ถ้าเป็นโครงการเดี่ยว หัวข้อนี้จะไม่ขึ้นบนการ์ด') + '</div>';
  }

  function render(j) {
    var levelHint = '';
    if (j.budgetCode === 'Level 1') levelHint = '<div class="hint ok">Level 1 = มีงบปีปัจจุบัน 2569 รอประมูล</div>';
    else if (j.budgetCode === 'Level 2') levelHint = '<div class="hint ' + (j.budgetYear ? 'ok' : 'bad') + '">Level 2 ต้องระบุปีงบประมาณ เช่น 2570</div>';
    else levelHint = '<div class="hint">ไม่บังคับระบุปีงบ (ระบุถ้าทราบ)</div>';

    /* ช่อง Trial โผล่เฉพาะขั้นที่เกี่ยวข้อง ไม่งั้นฟอร์มยาวโดยไม่จำเป็น */
    var stDef = C.stage(j.stage) || {};
    var dvE = U.deliveryInfo(j);
    var pkE = U.parkInfo(j);
    var trialFields = '';
    if (stDef.trial === 'waiting') {
      trialFields = '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>ลูกค้าขอให้สาธิตเมื่อ</label>' +
          '<input class="inp" type="date" data-field="jobs:' + j.id + ':trialRequestedAt" value="' + U.attr(j.trialRequestedAt || '') + '"></div>' +
        '<div class="field" style="flex:1 1 150px"><label>นัดสาธิตวันที่ (ว่าง = ยังไม่กำหนด)</label>' +
          '<input class="inp" type="date" data-field="jobs:' + j.id + ':trialPlannedDate" value="' + U.attr(j.trialPlannedDate || '') + '"></div>' +
        '<div class="field" style="flex:2 1 200px"><div class="hint">' + U.esc(U.trialText(j) || '—') + '</div></div>' +
      '</div>';
    } else if (stDef.trial === 'running') {
      trialFields = '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>เริ่ม Trial</label>' +
          '<input class="inp" type="date" data-field="jobs:' + j.id + ':trialStart" value="' + U.attr(j.trialStart || '') + '"></div>' +
        '<div class="field" style="flex:1 1 150px"><label>ครบกำหนด Trial</label>' +
          '<input class="inp" type="date" data-field="jobs:' + j.id + ':trialEnd" value="' + U.attr(j.trialEnd || '') + '"></div>' +
        '<div class="field" style="flex:2 1 200px"><div class="hint">' + U.esc(U.trialText(j) || '—') + '</div></div>' +
      '</div>';
    }

    /* ช่องส่งมอบ/ชำระเงิน โผล่เฉพาะขั้นที่ส่งมอบแล้ว ด้วยเหตุผลเดียวกับช่อง Trial
       ช่องวันที่ชำระโผล่ต่อเมื่อติ๊กว่าได้รับชำระแล้ว -- ไม่งั้นเป็นช่องที่กรอกไม่ได้ความหมาย */
    if (stDef.delivered) {
      trialFields += '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>วันที่ส่งมอบ / แล้วเสร็จ</label>' +
          '<input class="inp" type="date" data-field="jobs:' + j.id + ':deliveredAt" value="' +
          U.attr(j.deliveredAt || '') + '"></div>' +

      '</div>' +

      '<div class="field"><label>ผู้ติดต่อ</label>' + contactsEditor(j) + '</div>' +

        '<button class="btn btn-sm" data-act="plan:fromjob" data-id="' + j.id + '">' + U.ic('plan') + 'เพิ่มแผนงาน</button>' +
      '</div>' +
      (j.stageHistory && j.stageHistory.length
        ? '<div class="small muted" style="margin-top:10px">' + U.ic('history') + ' ประวัติสถานะ: ' +
          j.stageHistory.slice(-5).map(function (h) {

          }).join(' · ') + '</div>'
        : '') +
