SP.DiscView = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  function card(d) {
    var a = C.ASK_TYPES[d.askType] || C.ASK_TYPES.opinion;
    var j = d.jobId ? U.byId(SP.state.jobs, d.jobId) : null;
    return '<div class="disc' + (d.status === 'decided' ? ' decided' : '') + '">' +
      '<div class="center" style="flex-wrap:wrap">' +
        '<span class="badge" style="background:' + a.bg + ';color:' + a.color + ';border:1px solid ' + a.bd + '">' + U.esc(a.th) + '</span>' +
        SP.PlanView.jobLabel(d.jobId) +
        (d.proposedBy ? U.ownerChip(d.proposedBy) : '') +
        '<span class="badge badge-soft">' + U.esc(C.DISC_STATUS[d.status] || d.status) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-icon btn-ghost muted" data-act="disc:edit" data-id="' + d.id + '" title="แก้ไขวาระนี้" aria-label="แก้ไข">' +
          U.ic('edit') + '</button>' +
      '</div>' +
      '<div class="disc-topic">' + U.esc(d.topic || '(ยังไม่ได้ตั้งหัวข้อ)') + '</div>' +
      (d.context ? '<div class="disc-ctx">' + U.nl2br(d.context) + (j ? ' <span class="tiny muted">— ' + U.esc(j.customerName) + '</span>' : '') + '</div>' : '') +
      (d.options ? '<div class="disc-opts">' + U.ic('info') + ' <b>ตัวเลือก:</b> ' + U.nl2br(d.options) + '</div>' : '') +
      (d.decision
        ? '<div class="disc-min"><b>' + U.ic('check-circle') + ' มติ:</b> ' + U.nl2br(d.decision) +
          '<div class="tiny muted">' + (d.decidedBy ? 'โดย ' + U.esc(d.decidedBy) : '') +
          (d.decidedAt ? ' · ' + U.esc(U.fmtDate(d.decidedAt, 'datetime')) : '') + '</div></div>'
        : '') +
    '</div>';
  }

  /* ---- ฟอร์มเพิ่ม/แก้วาระใน drawer ---------------------------------------
     รูปแบบเดียวกับแผนงาน: ช่องกว้าง มีป้ายกำกับครบ การ์ดในลิสต์ไม่กระโดด
     และกดยกเลิกตอนเพิ่มใหม่ = ไม่เหลือรายการเปล่าค้างในลิสต์ */
  var draftAsk = 'opinion';

  function openDiscDrawer(d, isNew) {
    var owners = SP.state.owners.filter(function (o) { return o.active; });
    function ownerOpts(cur) {
      return '<option value="">— ไม่ระบุ —</option>' +
        owners.map(function (o) {
          return '<option value="' + U.attr(o.name) + '"' + (o.name === cur ? ' selected' : '') + '>' +
                 U.esc(o.name) + '</option>';
        }).join('') +
        (cur && !U.ownerByName(cur) ? '<option value="' + U.attr(cur) + '" selected>' + U.esc(cur) + '</option>' : '');
    }

    var html =
      '<div class="field"><label>ประเภทของเรื่อง</label><div class="seg" id="df-ask">' +
        Object.keys(C.ASK_TYPES).map(function (k) {
          return '<button type="button" data-act="disc:ask" data-v="' + k + '" aria-pressed="' +
                 (d.askType === k) + '">' + U.esc(C.ASK_TYPES[k].th) + '</button>';
        }).join('') + '</div></div>' +
      '<div class="field"><label>หัวข้อที่จะเสนอที่ประชุม</label>' +
        '<textarea class="inp" id="df-topic" rows="2" placeholder="เช่น ขอบเขตเฟส 1 ของ RCM — ใช้ Rule-based ไม่รวม AI">' +
        U.esc(d.topic) + '</textarea></div>' +
      '<div class="field"><label>บริบท / ที่มา</label>' +
        '<textarea class="inp" id="df-context" rows="3" placeholder="ทำไมต้องเอาเข้าที่ประชุม เกิดอะไรขึ้นมาก่อน">' +
        U.esc(d.context) + '</textarea></div>' +
      '<div class="field"><label>ตัวเลือกที่มี (ถ้ามี)</label>' +
        '<textarea class="inp" id="df-options" rows="3" placeholder="1) …&#10;2) …&#10;3) …">' +
        U.esc(d.options) + '</textarea></div>' +
      '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>ผู้เสนอ</label>' +
          '<select class="inp" id="df-by">' + ownerOpts(d.proposedBy) + '</select></div>' +
        '<div class="field" style="flex:2 1 200px"><label>ผูกกับงาน</label>' +
          '<select class="inp" id="df-job"><option value="">— เรื่องทั่วไป (ไม่ผูกงาน) —</option>' +
          SP.state.jobs.map(function (x) {
            return '<option value="' + x.id + '"' + (x.id === d.jobId ? ' selected' : '') + '>' +
                   U.esc(x.customerName + ' — ' + (x.product || '')) + '</option>';
          }).join('') + '</select></div>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="small muted" style="margin-bottom:8px">' + U.ic('edit') +
        ' ช่องจดมติ — กรอกสด ๆ ระหว่างประชุม แล้วไฟล์ที่บันทึกออกไปคือรายงานการประชุม</div>' +
      '<div class="field"><label>มติ / ข้อสรุป</label>' +
        '<textarea class="inp" id="df-decision" rows="3">' + U.esc(d.decision) + '</textarea></div>' +
      '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>ผู้ตัดสิน</label>' +
          '<select class="inp" id="df-decidedby">' + ownerOpts(d.decidedBy) + '</select></div>' +
        '<div class="field" style="flex:1 1 150px"><label>สถานะ</label>' +
          '<select class="inp" id="df-status">' +
          U.opt(Object.keys(C.DISC_STATUS).map(function (k) { return [k, C.DISC_STATUS[k]]; }), d.status) +
          '</select></div>' +
      '</div>';

    SP.Drawer.open({
      title: isNew ? 'เพิ่มวาระประชุม' : 'แก้ไขวาระประชุม', icon: 'discuss', html: html,
      buttons: (isNew ? [] : [{ label:'ลบ', id:'del', cls:'btn btn-danger', icon:'trash' }])
        .concat([
          { label:'ยกเลิก', id:'no', cls:'btn' },
          { label: isNew ? 'เพิ่ม' : 'บันทึก', id:'save', cls:'btn btn-primary', icon:'check' }
        ]),
      onClick: function (id, root) {
        if (id === 'del') {
          SP.Store.remove('discussions', d.id);
          SP.Render.current();
          SP.Toast.show('ลบวาระแล้ว', 'ok');
          return;
        }
        if (id !== 'save') {
          if (isNew) SP.Store.remove('discussions', d.id);   // ยกเลิกตอนเพิ่ม = ไม่เหลือรายการเปล่า
          SP.Render.current();
          return;
        }
        var decision = root.querySelector('#df-decision').value.trim();
        SP.Store.patch('discussions', d.id, {
          askType:    draftAsk || d.askType,
          topic:      root.querySelector('#df-topic').value.trim(),
          context:    root.querySelector('#df-context').value.trim(),
          options:    root.querySelector('#df-options').value.trim(),
          proposedBy: root.querySelector('#df-by').value,
          jobId:      root.querySelector('#df-job').value || null,
          decision:   decision,
          decidedBy:  root.querySelector('#df-decidedby').value,
          status:     root.querySelector('#df-status').value,
          /* จดมติแล้วประทับเวลาให้เอง เลขาจะได้ไม่ต้องกรอกวันที่ */
          decidedAt:  decision ? (d.decidedAt || U.nowISO()) : null
        });
        SP.Render.current();
        SP.Toast.show(isNew ? 'เพิ่มวาระแล้ว' : 'บันทึกแล้ว', 'ok');
      }
    });
    draftAsk = d.askType;
  }

  function setDraftAsk(v) {
    draftAsk = v;
    var seg = SP.Drawer.el().querySelector('#df-ask');
    if (!seg) return;
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false');
    });
  }

  function render() {
    var open = SP.state.discussions.filter(function (d) { return d.status !== 'decided'; });
    var done = SP.state.discussions.filter(function (d) { return d.status === 'decided'; });
    return '<div class="sect-hd"><h2>' + U.ic('discuss', 'ic-lg') + 'เรื่องขอความเห็น / ขอมติจากที่ประชุม</h2>' +
        '<span class="sub">' + open.length + ' เรื่องรอสรุป</span><span class="spacer"></span>' +
        '<button class="btn btn-primary btn-sm" data-act="disc:add">' + U.ic('plus') + 'เพิ่มวาระ</button></div>' +
      (open.length
        ? '<div class="stack">' + open.map(card).join('') + '</div>'
        : '<div class="empty">ยังไม่มีวาระรอสรุป — กด “เพิ่มวาระ” หรือกดปุ่ม “ขอความเห็นเรื่องนี้” บนการ์ดงาน</div>') +
      (done.length
        ? '<details style="margin-top:16px"><summary class="muted" style="cursor:pointer">ตัดสินแล้ว (' + done.length + ')</summary>' +
          '<div class="stack" style="margin-top:10px">' + done.map(card).join('') + '</div></details>'
        : '');
  }
  return { render:render, card:card, openDiscDrawer:openDiscDrawer, setDraftAsk:setDraftAsk };
})();

SP.Render.register('discuss', SP.DiscView.render);

function newDisc(jobId, context) {
  return SP.Store.add('discussions', {
    id: SP.U.uid('D'), seedBatch:'manual', jobId: jobId || null,
    topic:'', context: context || '', options:'',
    askType:'opinion', proposedBy: SP.ui.me || '', status:'open',
    decision:'', decidedBy:'', decidedAt:null
  });
}
SP.Actions.on('disc:add', function () {
  SP.DiscView.openDiscDrawer(newDisc(null, ''), true);
});
SP.Actions.on('disc:fromjob', function (ds) {
  var j = SP.U.byId(SP.state.jobs, ds.id);
  var d = newDisc(ds.id, j ? (j.customerName + ' — ' + (j.product || '')) : '');
  SP.Render.tab('discuss');
  SP.DiscView.openDiscDrawer(d, true);
});
SP.Actions.on('disc:edit', function (ds) {
  var d = SP.U.byId(SP.state.discussions, ds.id);
  if (d) SP.DiscView.openDiscDrawer(d, false);
});
SP.Actions.on('disc:ask', function (ds) { SP.DiscView.setDraftAsk(ds.v); });
</script>

<script>
/* ============================================================================
   BLOCK 09 — VIEW: settings  (ผู้รับผิดชอบ · เอกสาร · ส่งต่อ · JSON · reset)
   อ้างอิงผู้รับผิดชอบด้วย "ชื่อ" ไม่ใช่ id เพราะคอลัมน์ผู้รับผิดชอบใน Excel
   มีแต่ชื่อ ถ้าใช้ id ต้องมีชั้น resolve ทุกครั้งที่ import และคนเปิดไฟล์ก็อ่านไม่ออก
   ทีมมี 4-5 คน ค่าใช้จ่ายของ cascade rename ต่ำกว่าชั้น id มาก
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Settings = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  // ---- นับการอ้างอิงถึงชื่อคนหนึ่ง ๆ ทั่วทั้งเอกสาร -----------------------
  /* ทุกฟังก์ชันในกลุ่มนี้ไล่ collection ด้วยมือ — เพิ่ม collection ที่มีชื่อคนแล้ว
     ลืมมาแก้ที่นี่ = ชื่อผู้ดูแลที่ import เข้ามาจะกลายเป็นกำพร้าที่มองไม่เห็น
     เปลี่ยนชื่อก็ไม่ตาม ปุ่มสแกนก็ไม่เจอ (customers.salesOwner / activities.owner) */
  function refs(name) {
    var r = { jobs:[], plans:[], discussions:[], customers:[], activities:[] };
    SP.state.jobs.forEach(function (j) { if (U.normNames(j.assignedTo).indexOf(name) >= 0) r.jobs.push(j); });
    SP.state.plans.forEach(function (p) { if (p.owner === name) r.plans.push(p); });
    SP.state.discussions.forEach(function (d) {
      if (d.proposedBy === name || d.decidedBy === name) r.discussions.push(d);
    });
    (SP.state.customers || []).forEach(function (c) { if (c.salesOwner === name) r.customers.push(c); });
    (SP.state.activities || []).forEach(function (a) { if (a.owner === name) r.activities.push(a); });
    r.total = r.jobs.length + r.plans.length + r.discussions.length + r.customers.length + r.activities.length;
    return r;
  }
  /* ข้อความสรุปที่เดียว ใช้ร่วมกันทุกจุดที่โชว์จำนวนการอ้างถึง — เดิมมีสามสำเนา
     ที่เขียนสตริงเอง ซึ่งแปลว่าเพิ่ม collection แล้วต้องไล่แก้สามที่และจะลืมที่หนึ่ง
     ตัดหมวดที่เป็นศูนย์ทิ้ง เพื่อไม่ให้ประโยคยาวขึ้นสำหรับคนที่ยังไม่ได้ใช้ทะเบียน */
  function refsText(r) {
    var parts = [];
    if (r.jobs.length)        parts.push(r.jobs.length + ' งาน');
    if (r.plans.length)       parts.push(r.plans.length + ' แผนงาน');
    if (r.discussions.length) parts.push(r.discussions.length + ' วาระ');
    if (r.customers.length)   parts.push(r.customers.length + ' ลูกค้า');
    if (r.activities.length)  parts.push(r.activities.length + ' บันทึกติดต่อ');
    return parts.length ? parts.join(' · ') : 'ยังไม่มีงาน';
  }
  function renameEverywhere(from, to) {
    SP.state.jobs.forEach(function (j) {
      j.assignedTo = U.normNames(j.assignedTo).map(function (n) { return n === from ? to : n; });
    });
    SP.state.plans.forEach(function (p) { if (p.owner === from) p.owner = to; });
    SP.state.discussions.forEach(function (d) {
      if (d.proposedBy === from) d.proposedBy = to;
      if (d.decidedBy === from) d.decidedBy = to;
    });
    (SP.state.customers || []).forEach(function (c) { if (c.salesOwner === from) c.salesOwner = to; });
    (SP.state.activities || []).forEach(function (a) { if (a.owner === from) a.owner = to; });
    if (SP.state.settings.defaultOwner === from) SP.state.settings.defaultOwner = to;
    if (SP.ui.me === from) { SP.ui.me = to; SP.Store.saveUI(); }
  }
  /* ชื่อที่โผล่ในข้อมูลแต่ยังไม่อยู่ในรายชื่อ — จำเป็นหลัง import ไฟล์ที่มี
     คอลัมน์ผู้รับผิดชอบ ไม่งั้นชื่อจากชีตจะกลายเป็นชื่อกำพร้าที่ dropdown ไม่รู้จัก */
  function orphanNames() {
    var known = {}, found = {};
    SP.state.owners.forEach(function (o) { known[o.name] = 1; });
    function note(n) { if (n && !known[n]) found[n] = (found[n] || 0) + 1; }
    SP.state.jobs.forEach(function (j) { U.normNames(j.assignedTo).forEach(note); });
    SP.state.plans.forEach(function (p) { note(p.owner); });
    SP.state.discussions.forEach(function (d) { note(d.proposedBy); note(d.decidedBy); });
    (SP.state.customers || []).forEach(function (c) { note(c.salesOwner); });
    (SP.state.activities || []).forEach(function (a) { note(a.owner); });
    return Object.keys(found).map(function (n) { return { name:n, count:found[n] }; });
  }
  function nextColor() {
    var used = {};
    SP.state.owners.forEach(function (o) { used[String(o.color).toUpperCase()] = 1; });
    for (var i = 0; i < C.OWNER_PALETTE.length; i++) {
      if (!used[C.OWNER_PALETTE[i].toUpperCase()]) return C.OWNER_PALETTE[i];
    }
    return C.OWNER_PALETTE[SP.state.owners.length % C.OWNER_PALETTE.length];
  }
  function addOwner(name) {
    var o = {
      id: U.uid('O'), name: name || 'ผู้รับผิดชอบใหม่', short:'', color: nextColor(),
      role:'sale', active:true, order: SP.state.owners.length + 1
    };
    SP.Store.add('owners', o);
    return o;
  }

  // ---- render -------------------------------------------------------------
  function ownerRow(o, i, n) {
    var r = refs(o.name);
    return '<tr>' +
      '<td class="nowrap">' +
        '<button class="btn btn-icon btn-ghost muted" data-act="owner:move" data-id="' + o.id + '" data-dir="-1" ' +
          (i === 0 ? 'disabled ' : '') + 'title="เลื่อนขึ้น" aria-label="เลื่อนขึ้น">' + U.ic('chevron-up') + '</button>' +
        '<button class="btn btn-icon btn-ghost muted" data-act="owner:move" data-id="' + o.id + '" data-dir="1" ' +
          (i === n - 1 ? 'disabled ' : '') + 'title="เลื่อนลง" aria-label="เลื่อนลง">' + U.ic('chevron-down') + '</button>' +
      '</td>' +
      '<td><span class="avatar avatar-lg" style="background:' + U.attr(o.color) + '">' + U.esc(U.initials(o.short || o.name)) + '</span></td>' +
      '<td><input class="inp" style="min-width:120px" value="' + U.attr(o.name) + '" data-act-input="owner:name" data-id="' + o.id + '" aria-label="ชื่อผู้รับผิดชอบ"></td>' +
      '<td><input class="inp" style="max-width:90px" value="' + U.attr(o.short) + '" placeholder="ย่อ" data-field="owners:' + o.id + ':short" aria-label="ชื่อย่อ"></td>' +
      '<td><div class="center" style="flex-wrap:wrap;gap:3px">' +
        C.OWNER_PALETTE.map(function (c) {
          return '<button class="btn btn-icon" data-act="owner:color" data-id="' + o.id + '" data-c="' + c + '" ' +
                 'style="background:' + c + ';border-color:' + (String(o.color).toUpperCase() === c.toUpperCase() ? 'var(--g900)' : 'transparent') +
                 ';width:18px;height:18px;padding:0" title="' + c + '" aria-label="เลือกสี ' + c + '"></button>';
        }).join('') +
      '</div></td>' +
      '<td><select class="inp" style="max-width:120px" data-field="owners:' + o.id + ':role">' +
        U.opt(Object.keys(C.OWNER_ROLES).map(function (k) { return [k, C.OWNER_ROLES[k]]; }), o.role) + '</select></td>' +
      '<td><label class="check"><input type="checkbox" data-field="owners:' + o.id + ':active"' + (o.active ? ' checked' : '') + '>ใช้งาน</label></td>' +
      '<td class="tiny muted nowrap">' + refsText(r) + '</td>' +
      '<td><button class="btn btn-icon btn-danger" data-act="owner:del" data-id="' + o.id + '" title="ลบ" aria-label="ลบผู้รับผิดชอบ">' + U.ic('trash') + '</button></td>' +
    '</tr>';
  }

  function ownersCard() {
    var list = SP.state.owners.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    var orphans = orphanNames();
    return '<section class="sect"><div class="sect-hd"><h2>' + U.ic('users', 'ic-lg') + 'ผู้รับผิดชอบ</h2>' +
        '<span class="sub">' + list.length + ' คน · ชื่อที่แก้ตรงนี้จะเปลี่ยนตามไปทุกที่ที่อ้างถึง</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm" data-act="owner:scan">' + U.ic('refresh') + 'ดึงชื่อจากข้อมูลที่มี' +
          (orphans.length ? ' (' + orphans.length + ')' : '') + '</button>' +
        '<button class="btn btn-primary btn-sm" data-act="owner:add">' + U.ic('plus') + 'เพิ่มผู้รับผิดชอบ</button>' +
      '</div>' +
      (orphans.length
        ? '<div class="banner banner-warn">' + U.ic('alert') +
          '<div><b>พบชื่อในข้อมูล ' + orphans.length + ' ชื่อ ที่ยังไม่อยู่ในรายชื่อ:</b> ' +
          orphans.map(function (o) { return U.esc(o.name) + ' (' + o.count + ')'; }).join(' · ') +
          '<br><span class="small">กด “ดึงชื่อจากข้อมูลที่มี” เพื่อเพิ่มทั้งหมด</span></div></div>'
        : '') +
      '<div class="card"><div class="tbl-scroll"><table class="tbl">' +
        '<thead><tr><th>ลำดับ</th><th></th><th>ชื่อ</th><th>ชื่อย่อ</th><th>สี</th><th>บทบาท</th><th>สถานะ</th><th>อ้างถึง</th><th></th></tr></thead>' +
        '<tbody>' + (list.length ? list.map(function (o, i) { return ownerRow(o, i, list.length); }).join('')
                                 : '<tr><td colspan="9" class="muted">ยังไม่มีรายชื่อ</td></tr>') + '</tbody>' +
      '</table></div></div>' +
      '<div class="field-row" style="margin-top:12px">' +
        '<div class="field" style="flex:1 1 220px"><label>' + U.ic('user') + ' คุณคือใคร (เฉพาะเครื่องนี้)</label>' +
          '<select class="inp" data-act-change="ui:me">' +
            '<option value="">— ยังไม่ระบุ —</option>' +

/* ---- owner actions ------------------------------------------------------- */
SP.Actions.on('owner:add', function () {
  var o = SP.Settings.addOwner('');
  SP.Render.current();
  setTimeout(function () {
    var el = document.querySelector('[data-act-input="owner:name"][data-id="' + o.id + '"]');
    if (el) { el.focus(); el.select(); }
  }, 40);
});
SP.Actions.on('owner:color', function (ds) {
  SP.Store.patch('owners', ds.id, { color: ds.c });
  SP.Render.current();
});
SP.Actions.on('owner:move', function (ds) {
  var list = SP.state.owners.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  var i = list.findIndex(function (o) { return o.id === ds.id; });
  var k = i + Number(ds.dir);
  if (i < 0 || k < 0 || k >= list.length) return;
  var t = list[i]; list[i] = list[k]; list[k] = t;
  list.forEach(function (o, n) { o.order = n + 1; });
  SP.Store.touch();
  SP.Render.current();
});
/* ลบต้องตรวจก่อนเสมอ — ห้ามลบเงียบ ๆ จนเหลือชื่อกำพร้า */
SP.Actions.on('owner:del', function (ds) {
  var o = SP.U.byId(SP.state.owners, ds.id); if (!o) return;
  var r = SP.Settings.refs(o.name);
  if (!r.total) {
    SP.Store.remove('owners', o.id);
    SP.Render.current();
    SP.Toast.show('ลบ ' + o.name + ' แล้ว', 'ok');
    return;
  }
  var others = SP.state.owners.filter(function (x) { return x.id !== o.id; });
  SP.Modal.open({
    title:'ลบ ' + o.name + '?', icon:'alert',
    html:'<p><b>' + SP.U.esc(o.name) + '</b> ถูกอ้างถึงอยู่ใน <b>' + SP.Settings.refsText(r) + '</b></p>' +
         '<div class="field"><label>ย้ายงานทั้งหมดไปที่</label><select class="inp" id="sp-reassign">' +
         '<option value="">— ปล่อยว่าง (ไม่มีผู้รับผิดชอบ) —</option>' +
         others.map(function (x) { return '<option value="' + SP.U.attr(x.name) + '">' + SP.U.esc(x.name) + '</option>'; }).join('') +
         '</select></div>',
    buttons: [{ label:'ยกเลิก', id:'no' }, { label:'ลบและย้ายงาน', id:'yes', cls:'btn btn-danger' }],
    onClick: function (id, root) {
      if (id !== 'yes') return;
      var to = root.querySelector('#sp-reassign').value;
      if (to) SP.Settings.renameEverywhere(o.name, to);
      else {
        SP.state.jobs.forEach(function (j) {
          j.assignedTo = SP.U.normNames(j.assignedTo).filter(function (n) { return n !== o.name; });
        });
        SP.state.plans.forEach(function (p) { if (p.owner === o.name) p.owner = ''; });
        SP.state.discussions.forEach(function (d) {
          if (d.proposedBy === o.name) d.proposedBy = '';
          if (d.decidedBy === o.name) d.decidedBy = '';
        });
      }
      SP.Store.remove('owners', o.id);
      SP.Render.current();
      SP.Toast.show(to ? ('ลบแล้ว — ย้ายงานไปที่ ' + to) : 'ลบแล้ว — งานที่เกี่ยวข้องไม่มีผู้รับผิดชอบ', 'ok');
    }
  });
});

SP.Actions.on('brand:pick', function () {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.svg,.png,image/svg+xml,image/png';
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; if (!f) return;
    var b = SP.state.settings.brand = SP.state.settings.brand || {};
    var r = new FileReader();
    if (/\.svg$/i.test(f.name) || f.type === 'image/svg+xml') {
      r.onload = function () {
        var clean = sanitizeSvg(String(r.result));
        if (!clean) { SP.Toast.show('อ่านไฟล์ SVG ไม่สำเร็จ', 'bad'); return; }
        b.logoSvg = clean; b.logoDataUri = '';
        // สัดส่วนของ SVG อ่านจาก viewBox ได้ตรง ๆ ไม่ต้องรอโหลดรูป
        var vb = (/viewBox="([^"]+)"/.exec(clean) || [])[1];
        var p4 = vb ? vb.trim().split(/[\s,]+/).map(Number) : null;
        b.logoAspect = (p4 && p4.length === 4 && p4[3]) ? (p4[2] / p4[3]) : 1;
        SP.Store.touch(); SP.Render.all();
        SP.Toast.show('ใส่โลโก้แล้ว — กด "บันทึกเป็นไฟล์ HTML" เพื่อให้โลโก้ติดไปกับไฟล์', 'ok', 7000);
      };
      r.readAsText(f);
    } else {
      r.onload = function () {
        var uri = String(r.result);
        /* PNG ใหญ่ทำให้ seed บวมและไฟล์ที่ export โตตาม — และ localStorage บน file://
           เป็นถัง 5 MB ถังเดียวที่แชร์กับ HTML ทุกไฟล์บนเครื่อง */
        if (uri.length > 280000) {
          SP.Toast.show('ไฟล์ใหญ่เกินไป (' + Math.round(uri.length / 1024) + ' KB) — ใช้ .svg หรือย่อรูปให้เล็กกว่า 200 KB', 'bad', 9000);
          return;
        }
        /* ต้องรู้สัดส่วนก่อนจึงจะเลือกได้ว่าวางแบบไอคอนหรือแบบคำ — วัดจากรูปจริง
           ไม่ใช่เดาจากชื่อไฟล์ ต้องรอ onload ของ Image เพราะขนาดยังไม่มีก่อนหน้านั้น */
        var probe = new Image();
        probe.onload = function () {
          b.logoDataUri = uri; b.logoSvg = '';
          b.logoAspect = probe.naturalHeight ? (probe.naturalWidth / probe.naturalHeight) : 1;
          SP.Store.touch(); SP.Render.all();
          SP.Toast.show('ใส่โลโก้แล้ว — กด "บันทึกเป็นไฟล์ HTML" เพื่อให้โลโก้ติดไปกับไฟล์', 'ok', 7000);
        };
        probe.onerror = function () { SP.Toast.show('อ่านไฟล์รูปไม่สำเร็จ', 'bad'); };
        probe.src = uri;
      };
      r.readAsDataURL(f);
    }
  };
  inp.click();
});
SP.Actions.on('brand:clear', function () {
  var b = SP.state.settings.brand || {};
  b.logoSvg = ''; b.logoDataUri = '';
  SP.Store.touch(); SP.Render.all();
});

/* ทำความสะอาด SVG ตอน "รับเข้า" ครั้งเดียว ไม่ใช่ตอนเรนเดอร์ทุกครั้ง
   เพราะ U.brandMark() เขียนมันลง HTML ตรง ๆ (มันคือ markup ของรูป)
   ถ้าไม่ล้างตรงนี้ ไฟล์ SVG ที่มีสคริปต์ฝังมาจะรันทุกครั้งที่เปิดเอกสาร */
function sanitizeSvg(text) {
  try {
    var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    var svg = doc.querySelector('svg');
    if (!svg || doc.querySelector('parsererror')) return '';
    svg.querySelectorAll('script,foreignObject,iframe,object,embed,link,style[href]')
       .forEach(function (n) { n.parentNode.removeChild(n); });
    var walk = doc.createTreeWalker(svg, NodeFilter.SHOW_ELEMENT, null);
    var nodes = [svg], cur;
    while ((cur = walk.nextNode())) nodes.push(cur);
    nodes.forEach(function (el) {
      Array.prototype.slice.call(el.attributes).forEach(function (at) {
        var n = at.name.toLowerCase(), v = String(at.value || '');
        if (n.indexOf('on') === 0) el.removeAttribute(at.name);
        else if ((n === 'href' || n === 'xlink:href') && /^\s*javascript:/i.test(v)) el.removeAttribute(at.name);
      });
    });
    /* ตัดขนาดตายตัวออก เก็บ viewBox ไว้ ให้ CSS คุมขนาดแทน
       ไม่งั้นโลโก้จะล้นหัวรายงานหรือเล็กจนมองไม่เห็น แล้วแต่ไฟล์ที่ได้มา */
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    if (!svg.getAttribute('viewBox')) return '';
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    return new XMLSerializer().serializeToString(svg);
  } catch (e) { return ''; }
}

<script>
/* ============================================================================
   BLOCK 10 — CRM  (ทะเบียนลูกค้า · ผู้ติดต่อ · บันทึกการติดต่อ)
   เติมช่องว่างเลข 10 ที่เว้นไว้เดิม — เลขบล็อกคือ "ชื่อ" ไม่ใช่ลำดับการโหลด

   ทำไมต้องมีบล็อกนี้: jobs เก็บ "ดีล" แต่ไฟล์ Excel ที่ทีมใช้จริงเก็บ
   "ทะเบียนโรงพยาบาลเป้าหมาย + สมุดบันทึกการติดต่อ" ซึ่งเป็นคนละชั้นข้อมูล
   job.customerName เดิมเป็นแค่สตริง จึงตอบไม่ได้ว่าโรงพยาบาลนี้เคยคุยกับใคร
   ไปกี่รอบ และรอบล่าสุดค้างอะไรอยู่

   ความสัมพันธ์ (FK ทุกตัวเป็น id และ nullable ได้ ยกเว้น contact.customerId):
     customers 1─< contacts · jobs · activities · plans
     activities 1─< plans     <- "หนึ่งรอบติดต่อ แตกได้หลายงาน"
   ยกเว้น owner ที่ยังผูกด้วย "ชื่อ" ตามธรรมเนียมเดิมของ BLOCK 09
   ========================================================================= */
var SP = window.SP || (window.SP = {});

/* --------------------------------------------------------------------------
   SP.Cust — ชั้นข้อมูล ไม่มี DOM
   ทุก view ต้องเรียกผ่าน resolver พวกนี้ ห้าม lookup เอง ไม่งั้นข้อความ
   "ลูกค้าที่อ้างถึงถูกลบ" จะมีสิบเวอร์ชันที่ไม่ตรงกัน
   -------------------------------------------------------------------------- */
SP.Cust = (function () {
  'use strict';
  var U = SP.U;

  function all()  { return SP.state.customers || []; }
  function get(id) { return id ? U.byId(all(), id) : null; }
  function of(job) { return job && job.customerId ? get(job.customerId) : null; }

  function contacts(custId) {
    return (SP.state.contacts || []).filter(function (k) { return k.customerId === custId; })
      .sort(function (a, b) { return (b.isPrimary ? 1 : 0) - (a.isPrimary ? 1 : 0); });
  }
  function jobs(custId) {
    return SP.state.jobs.filter(function (j) { return j.customerId === custId; });
  }
  /* เรียงตามวันที่ "ทำจริง" ก่อน ถ้าไม่มีค่อยใช้วันที่นัด — ไทม์ไลน์ต้องเรียงตาม
     สิ่งที่เกิดขึ้นจริง ไม่ใช่สิ่งที่ตั้งใจจะให้เกิด */
  function activities(custId) {
    return (SP.state.activities || [])
      .filter(function (a) { return a.customerId === custId; })
      .sort(function (a, b) {
        return String((b.doneDate || b.date) || '').localeCompare(String((a.doneDate || a.date) || ''));
      });
  }
  function plans(custId) {
    return SP.state.plans.filter(function (p) { return p.customerId === custId; });
  }
  function lastActivity(custId) { var l = activities(custId); return l.length ? l[0] : null; }

  /* "นัดครั้งถัดไป" ที่เชื่อถือได้ — ค่าที่พิมพ์มือไว้ในโปรไฟล์มาก่อนเสมอ เพราะเป็น
     สิ่งที่คนตั้งใจเขียน ถ้าไม่มีค่อยไปหยิบวันที่เร็วที่สุดที่ยังไม่เลยกำหนดจาก
     บันทึกติดต่อและแผนงาน — ไม่งั้นตั้งงานติดตามไว้แล้วทะเบียนยังขึ้น "—" อยู่ดี
     คืน {date, note, src} · src บอกที่มาเพื่อให้ตารางติดป้ายได้ว่าไม่ใช่ค่าที่พิมพ์เอง */
  function nextDue(custId) {
    var c = get(custId); if (!c) return null;
    if (c.nextActionAt) return { date:c.nextActionAt, note:c.nextActionNote || '', src:'manual' };

    var today = U.isoDate(U.today());
    var best = null;
    function offer(date, note, src) {
      if (!date || date < today) return;                 // เลยกำหนดแล้วไม่ใช่ "นัดครั้งถัดไป"
      if (!best || date < best.date) best = { date:date, note:note || '', src:src };
    }
    (SP.state.activities || []).forEach(function (a) {
      if (a.customerId !== custId || a.status === 'done') return;
      offer(a.followUpAt, a.followUpNote || a.nextAction, 'activity');
    });
    SP.state.plans.forEach(function (p) {
      if (p.customerId !== custId || p.done) return;
      offer(p.dueDate || p.startDate, p.action, 'plan');
    });
    return best;
  }

  function name(id) {
    if (!id) return '— ไม่ผูกลูกค้า —';
    var c = get(id);
    return c ? c.name : 'ลูกค้าที่อ้างถึงถูกลบ';
  }
  /* ล้อ SP.PlanView.jobLabel() ให้เป๊ะ เพื่อให้ chip ทั้งแอปหน้าตาเหมือนกัน */
  function chip(id) {
    if (!id) return '<span class="badge badge-soft">— ไม่ผูกลูกค้า —</span>';
    var c = get(id);
    if (!c) return '<span class="badge" style="background:#FEF3F2;color:#B42318">' + U.ic('alert') + 'ลูกค้าที่อ้างถึงถูกลบ</span>';
    return '<button class="chip chip-btn chip-cust tiny" data-act="cust:open" data-id="' + c.id + '" style="padding-left:8px">' +
           U.ic('hospital') + U.esc(c.name) + '</button>';
  }

  /* สร้างใหม่ทุกครั้งที่เรียก — 115 เรคอร์ดไม่มีนัยสำคัญ และไม่มีทางเก่า
     ห้าม persist ลง SP.state เด็ดขาด: seed จะบวมและค่าจะเพี้ยนทันทีที่ส่งไฟล์ต่อ */
  function index() {
    var m = {};
    all().forEach(function (c) { m[SP.Norm.custKey(c.name)] = c; });
    return m;
  }

  function create(over) {
    var c = SP.Norm.blankCustomer(over || {});
    if (!c.id) c.id = U.uid('C');
    return SP.Store.add('customers', c);
  }
  function addContact(custId, over) {
    var k = SP.Norm.blankContact(over || {});
    k.id = k.id || U.uid('K');
    k.customerId = custId;
    if (!contacts(custId).length) k.isPrimary = true;
    return SP.Store.add('contacts', k);
  }

  /* ลบลูกค้า: ลบผู้ติดต่อและบันทึกการติดต่อไปด้วย (เป็นของลูกค้ารายนั้นล้วน ๆ)
     แต่ "เก็บ job และ plan ไว้" แล้วตั้ง customerId = null
     ห้าม cascade ลง job เด็ดขาด — ดีลคือเงิน แถวทะเบียนไม่ใช่ ถ้าเผลอลบดีลตาม
     ทะเบียนไป ตัวเลข pipeline จะเปลี่ยนโดยไม่มีใครตั้งใจ */
  function refs(id) {
    return { contacts:contacts(id).length, jobs:jobs(id).length,
             activities:activities(id).length, plans:plans(id).length };
  }
  function removeCustomer(id) {
    contacts(id).forEach(function (k) { SP.Store.remove('contacts', k.id); });
    activities(id).forEach(function (a) { SP.Store.remove('activities', a.id); });
    SP.state.jobs.forEach(function (j) { if (j.customerId === id) j.customerId = null; });
    SP.state.plans.forEach(function (p) { if (p.customerId === id) p.customerId = null; });
    return SP.Store.remove('customers', id);
  }
  function removeContact(id) {
    (SP.state.activities || []).forEach(function (a) { if (a.contactId === id) a.contactId = null; });
    return SP.Store.remove('contacts', id);
  }

  /* งานที่ยังไม่ได้ผูกทะเบียน — ไม่สร้างลูกค้าให้อัตโนมัติ (จะกลายเป็นทะเบียนซ้อน)
     แต่ต้องมองเห็นได้ ไม่งั้นจะค้างเงียบตลอดไป */
  function unlinkedJobs() {
    return SP.state.jobs.filter(function (j) { return !j.customerId; });
  }

  return {
    all:all, get:get, of:of, contacts:contacts, jobs:jobs, activities:activities,
    plans:plans, lastActivity:lastActivity, nextDue:nextDue, name:name, chip:chip, index:index,
    create:create, addContact:addContact, refs:refs,
    removeCustomer:removeCustomer, removeContact:removeContact, unlinkedJobs:unlinkedJobs
  };
})();

/* --------------------------------------------------------------------------
   SP.Act — ชั้นข้อมูลของบันทึกการติดต่อ
   -------------------------------------------------------------------------- */
SP.Act = (function () {
  'use strict';
  var U = SP.U;

  function all() { return SP.state.activities || []; }
  function get(id) { return id ? U.byId(all(), id) : null; }
  function create(over) {
    var a = SP.Norm.blankActivity(over || {});
    if (!a.id) a.id = U.uid('A');
    if (!a.date) a.date = U.today();
    return SP.Store.add('activities', a);
  }
  function tasks(actId) {
    return SP.state.plans.filter(function (p) { return p.activityId === actId; });
  }
  /* ลบบันทึกการติดต่อแล้วงานที่แตกออกมาต้องอยู่ต่อ — มันคืองานจริงที่รับปากลูกค้าไว้
     แค่ตัดสายอ้างอิงทิ้ง ล้อนโยบาย "เก็บ orphan ไว้แล้วติดป้าย" ของ PlanView */
  function remove(id) {
    SP.state.plans.forEach(function (p) { if (p.activityId === id) p.activityId = null; });
    return SP.Store.remove('activities', id);
  }

  /* หัวใจของข้อกำหนด "สร้าง task ไว้แต่ละรอบ หรือหลายงานได้"
     list = [{action, owner, dueDate, bucket, startTime, notes}, ...] */
  function spawnTasks(actId, list) {
    var a = get(actId); if (!a) return [];
    var made = [];
    (list || []).forEach(function (t) {
      if (!t.action || !String(t.action).trim()) return;      // แถวว่างไม่ต้องสร้างงานเปล่า
      var p = {
        id: U.uid('P'), seedBatch:'',
        jobId: a.jobId || null, customerId: a.customerId || null, activityId: a.id,
        kind: t.kind || 'task',
        action: String(t.action).trim(),
        owner: t.owner || a.owner || SP.state.settings.defaultOwner || '',
        bucket: t.bucket || 'W1',
        startDate: t.startDate || null,
        dueDate: t.dueDate || null,
        startTime: t.startTime || null, endTime: t.endTime || null,
        allDay: !t.startTime,
        notes: t.notes || '', location: t.location || SP.Cust.name(a.customerId),
        done: false,
        cal: { eventId:null, calendarId:null, etag:null, syncedAt:null, syncHash:null, state:'none' }
      };
      made.push(SP.Store.add('plans', p));
    });
    return made;
  }

  /* ปิดการติดต่อหนึ่งรอบ = บันทึกว่าทำแล้วเมื่อไร ไม่ใช่แค่ติ๊กถูก
     วันที่ทำจริงคือคอลัมน์ที่ชีตต้นทางมีอยู่แล้ว และเป็นสิ่งที่รายงานสัปดาห์ใช้ */
  function markDone(id) {
    var a = get(id); if (!a) return;
    SP.Store.patch('activities', id, { status:'done', doneDate: a.doneDate || U.today() });
    noteContact(id);
  }

  /* มีบันทึกการติดต่อที่มีเนื้อหาแล้ว = ไม่ใช่ lead ใหม่อีกต่อไป
     ตัวนำเข้า XLSX ขยับสถานะนี้ให้อยู่แล้ว แต่การบันทึกเองไม่เคยขยับ ทะเบียนจึงค้าง
     "ยังไม่ติดต่อ" ทั้งที่มีประวัติคุยกันแล้ว · ขยับขาเดียว new -> contacted เท่านั้น
     ไม่แตะ presented เพราะนั่นคือสิ่งที่คนตัดสินใจเอง */
  function noteContact(actId) {
    var a = get(actId); if (!a || !a.customerId) return;
    if (!String(a.topic || '').trim()) return;
    var c = SP.Cust.get(a.customerId);
    if (c && c.leadStatus === 'new') SP.Store.patch('customers', c.id, { leadStatus:'contacted' });
  }

  return { all:all, get:get, create:create, tasks:tasks, remove:remove,
           spawnTasks:spawnTasks, markDone:markDone, noteContact:noteContact };
})();

    if (ld.length && ld.indexOf(c.leadStatus) < 0) return false;

  function f() {

      '<div class="field"><label>ผลลัพธ์</label><textarea class="inp" rows="2" data-field="' + d + 'result">' + U.esc(a.result) + '</textarea></div>' +
      '<div class="field"><label>สิ่งที่ต้องทำต่อ</label><textarea class="inp" rows="2" data-field="' + d + 'nextAction">' + U.esc(a.nextAction) + '</textarea></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>กำหนดติดตาม</label><input class="inp" type="date" data-field="' + d + 'followUpAt" value="' + U.attr(a.followUpAt || '') + '"></div>' +
        '<div class="field"><label>วันที่ทำจริง</label><input class="inp" type="date" data-field="' + d + 'doneDate" value="' + U.attr(a.doneDate || '') + '"></div>' +
        '<div class="field"><label>ผู้บันทึก</label>' + SP.PlanView.ownerSelect(a.owner, 'activities', a.id, 'owner') + '</div>' +
      '</div>' +
      (a.followUpNote ? '<div class="hint">บันทึกกำหนดติดตามเดิม: ' + U.esc(a.followUpNote) + '</div>' : '') +
      '<div class="hr"></div>' +
      '<div class="sect-hd"><h2>' + U.ic('plan') + 'งานที่สร้างจากการติดต่อครั้งนี้</h2>' +
        '<button class="btn btn-sm" data-act="act:tasks" data-id="' + a.id + '" data-back="act:' + a.id + '">' +
        U.ic('plus') + 'สร้างงาน</button></div>' +
      (SP.Act.tasks(a.id).length
        ? SP.Act.tasks(a.id).map(function (p) {
            return '<div class="plan-item' + (p.done ? ' done' : '') + '">' +
              '<label class="check" style="margin-top:2px"><input type="checkbox" data-field="plans:' + p.id + ':done"' +
                (p.done ? ' checked' : '') + '></label>' +
              '<div style="flex:1 1 auto;min-width:0"><div class="plan-act">' + U.esc(p.action) + '</div>' +
              '<div class="job-meta tiny">' + (p.owner ? U.ownerChip(p.owner) : '') +
                (p.dueDate ? '<span class="badge badge-soft">' + U.ic('calendar') + U.esc(U.fmtDate(p.dueDate)) + '</span>' : '') +
              '</div></div></div>';
          }).join('')
        : '<p class="muted small">ยังไม่มีงานที่สร้างจากการติดต่อครั้งนี้</p>');

    actBack = back || '';
    SP.Drawer.open({
      title:'บันทึกการติดต่อ — ' + SP.Cust.name(a.customerId), icon:'history', wide:true, html:body,
      buttons: (isNew
        ? [{ label:'ยกเลิก', cls:'btn btn-ghost', id:'cancel' }]
        : [{ label:'ลบบันทึกนี้', cls:'btn btn-ghost btn-danger', id:'del', icon:'trash' }]
      ).concat([{ label:'เสร็จ', cls:'btn btn-primary', id:'close' }]),
      onClick: function (bid) {
        if (bid === 'cancel') { SP.Store.remove('activities', a.id); return false; }
        if (bid === 'del') {
          SP.Modal.confirm({
            title:'ลบบันทึกการติดต่อนี้?', icon:'trash', danger:true,
            html:'<p class="small">งานที่สร้างจากการติดต่อครั้งนี้ <b>จะไม่ถูกลบ</b> — มันคืองานจริงที่รับปากไว้ แค่ถูกตัดสายอ้างอิงทิ้ง</p>'
          }, function () {
            SP.Act.remove(a.id); SP.Drawer.close();
            SP.Toast.show('ลบบันทึกแล้ว', 'ok');
          });
          return true;
        }
        return false;
      },
      /* เรคคอร์ดถูกสร้างก่อนผู้ใช้พิมพ์ (ฟอร์มผูกข้อมูลสด ต้องมีแถวให้ผูก)
         ปิดโดยไม่ได้กรอกอะไรเลยจึงต้องเก็บกวาดให้ ไม่งั้นทะเบียนจะมีแถวเปล่างอก */
      onClose: function () {
        var cur = SP.Act.get(a.id);
        if (cur) {
          if (isNew && isBlank(cur)) SP.Store.remove('activities', a.id);
          else SP.Act.noteContact(a.id);
        }
        SP.Render.current();
        goBack(back);
      }
    });
  }

  /* ---- modal: แตกการติดต่อหนึ่งรอบเป็นงานหลายชิ้น -------------------------
     ให้ 3 ช่องเสมอ เพราะ "หลายงาน" คือกรณีปกติ ไม่ใช่กรณีพิเศษ
     ช่องที่เว้นว่างจะถูกข้าม (spawnTasks กรองให้) จึงไม่เกิดงานเปล่า */
  function openTasks(id, back) {
    var a = SP.Act.get(id); if (!a) return;
    var seed = a.nextAction || '';
    var due = a.followUpAt || '';
    function rowHtml(i, val) {
      return '<div class="card card-pad" style="margin-bottom:8px">' +
        '<div class="field"><label>งานที่ ' + (i + 1) + '</label>' +
          '<input class="inp" id="sp-t' + i + '-action" placeholder="สิ่งที่ต้องทำ" value="' + U.attr(val || '') + '"></div>' +
        '<div class="field-row">' +
          '<div class="field"><label>กำหนดเสร็จ</label><input class="inp" type="date" id="sp-t' + i + '-due" value="' + U.attr(i === 0 ? due : '') + '"></div>' +
          '<div class="field" style="max-width:110px"><label>เวลา</label><input class="inp" type="time" id="sp-t' + i + '-time"></div>' +
        '</div></div>';
    }
    SP.Modal.open({
      title:'สร้างงานจากการติดต่อ — ' + SP.Cust.name(a.customerId), icon:'plan',
      html:'<p class="muted small">สร้างได้หลายงานพร้อมกัน ช่องที่เว้นว่างไว้จะถูกข้าม</p>' +
        rowHtml(0, seed) + rowHtml(1, '') + rowHtml(2, ''),
      buttons: [
        { label:'ยกเลิก', cls:'btn btn-ghost', id:'cancel' },
        { label:'สร้างงาน', cls:'btn btn-primary', id:'ok', icon:'plus' }
      ],
      onClick: function (bid, root) {
        if (bid !== 'ok') return false;
        var list = [];
        for (var i = 0; i < 3; i++) {
          var act = root.querySelector('#sp-t' + i + '-action');
          if (!act || !act.value.trim()) continue;
          var t = root.querySelector('#sp-t' + i + '-time');
          list.push({
            action: act.value,
            dueDate: (root.querySelector('#sp-t' + i + '-due') || {}).value || null,
            startTime: (t && t.value) || null
          });
        }
        if (!list.length) { SP.Toast.show('ยังไม่ได้กรอกงานสักรายการ', 'warn'); return true; }
        var made = SP.Act.spawnTasks(a.id, list);
        SP.Toast.show('สร้างงานแล้ว ' + made.length + ' รายการ — ดูได้ที่แท็บแผนงาน', 'ok');
        SP.Render.current();
        goBack(back);
        return false;
      }
    });
  }

  return { render:render, openDrawer:openDrawer, openTasks:openTasks, timeline:timeline,
           card:card, goBack:goBack, chBadge:chBadge, stBadge:stBadge,
           f:f, sel:sel, step:step };
})();

/* ตัวกรอง — เก็บใน SP.ui (ของเครื่อง) ไม่ใช่ SP.state จึงไม่เดินทางไปกับไฟล์
   ล้อพฤติกรรมเดียวกับตัวกรองของบอร์ด */
function filterSetter(bag, k) {
  return function (ds, ev) {
    var t = ev && ev.target; if (!t) return;
    SP.ui[bag] = SP.ui[bag] || {};
    SP.ui[bag][k] = (t.type === 'checkbox') ? t.checked : t.value;
    SP.Store.saveUI();
    SP.Render.current();
  };
}
/* ช่องค้นหาต้องหน่วงก่อนวาดใหม่ — วาดทุกตัวอักษรจะทั้งช้าและทำให้ caret กระโดด
   ใช้ 300ms เท่ากับ board:text เพื่อให้ความรู้สึกเหมือนกันทั้งแอป

   แต่ debounce อย่างเดียวไม่พอ: SP.Render.current() วาด innerHTML ใหม่ทั้งก้อน
   ช่องค้นหาตัวเดิมจึงถูกทิ้งไปพร้อม focus และ caret — พิมพ์ต่อไม่ได้ ต้องคลิกซ้ำ
   ทุกครั้งที่หยุดพิมพ์เกิน 300ms (อาการเดียวกับที่หัว BLOCK 13 เตือนไว้)
   จึงต้องคืน focus + ตำแหน่ง caret ให้ช่องตัวใหม่หลังวาดเสร็จ */
function searchSetter(bag, k) {
  return function (ds, ev) {
    var t = ev && ev.target; if (!t) return;
    var sel = '[data-act-input="' + t.getAttribute('data-act-input') + '"]';
    SP.ui[bag] = SP.ui[bag] || {};
    SP.ui[bag][k] = t.value;
    clearTimeout(t._tm);
    t._tm = setTimeout(function () {
      var wasActive = (document.activeElement === t);
      var pos = t.selectionStart;
      SP.Store.saveUI();
      SP.Render.current();
      if (!wasActive) return;
      var next = document.querySelector(sel);
      if (!next) return;
      try { next.focus(); if (pos != null) next.setSelectionRange(pos, pos); } catch (e) {}
    }, 300);
  };
}
SP.Actions.on('cust:q',        searchSetter('custFilters', 'q'));
SP.Actions.on('cust:filter', function (ds) {
  SP.Menu.pick(SP.CustView.f(), ds.k, ds.v);
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('cust:inactive', filterSetter('custFilters', 'inactive'));
SP.Actions.on('act:q',         searchSetter('actFilters', 'q'));
/* ช่องทาง/สถานะ เลือกได้หลายค่า — ล้อ board:filter ทุกประการ
   ปุ่ม "ทั้งหมด" (data-v ว่าง) = ล้างหมวดนั้น ไม่ใช่เลือกทุกค่า */
SP.Actions.on('act:filter', function (ds) {
  SP.Menu.pick(SP.ActView.f(), ds.k, ds.v);
  SP.Store.saveUI();
  SP.Render.current();
});
/* เปลี่ยนโหมดช่วงเวลา — ล้างจุดตั้งต้นทุกครั้ง ไม่งั้นสลับโหมดแล้วจะไปโผล่
   เดือนที่เผลอเลื่อนค้างไว้เมื่อกี้ */
SP.Actions.on('act:range', function (ds, ev) {
  var q = SP.ActView.f();
  q.range = (ev && ev.target ? ev.target.value : ds.v) || '';
  q.anchor = '';
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('act:step', function (ds) {
  var n = Number(ds.d);
  if (n) SP.ActView.step(n); else SP.ActView.f().anchor = '';   // 0 = กลับมาช่วงปัจจุบัน
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('act:from',      filterSetter('actFilters', 'from'));
SP.Actions.on('act:to',        filterSetter('actFilters', 'to'));

SP.Actions.on('plan:q',        searchSetter('planFilters', 'q'));
SP.Actions.on('plan:cust',     filterSetter('planFilters', 'cust'));
SP.Actions.on('plan:owner',    filterSetter('planFilters', 'owner'));
SP.Actions.on('plan:hideDone', filterSetter('planFilters', 'hideDone'));
</script>

<script>
/* ============================================================================
   BLOCK 11 — EXPORT  (บันทึกเป็นไฟล์ HTML ใหม่ / JSON)
   ล้าง innerHTML ของ render root ทุกตัวแล้วเขียน seed ใหม่ แทนที่จะ serialize
   DOM สด เพราะ DOM สดจะ (ก) ไฟล์ใหญ่เท่าตัว (ข) ฝังแท็บ/ฟิลเตอร์ที่ค้างอยู่
   (ค) ติด modal ที่เปิดค้าง (ง) เจอบั๊ก input.value vs input[value] — พิมพ์ใน
   ช่องข้อความแล้ว property เปลี่ยนแต่ attribute ไม่เปลี่ยน ข้อความที่ export
   ออกไปจะเป็นของก่อนแก้
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Export = (function () {
  'use strict';
  var U = SP.U;
  var busy = false;

  /* escape ทุกตัว "<" ไม่ใช่แค่แท็กปิดสคริปต์ — type="application/json" ไม่ถูก execute
     แต่ HTML tokenizer ยังปิด script element ทันทีที่เจอแท็กปิด (ไม่สนตัวพิมพ์เล็กใหญ่
     และไม่สนว่าอยู่ในสตริงหรือคอมเมนต์) การ escape "<" ทั้งหมดยังกัน "<!--" ที่
     tokenizer ตีความพิเศษด้วย · "<" ใน JSON string กลับเป็น "<" เองตอน JSON.parse

     *** ห้ามเขียนแท็กปิดสคริปต์เป็นตัวอักษรจริงในบล็อกนี้หรือบล็อกไหนก็ตาม ***
     เคยพลาดมาแล้ว: คอมเมนต์ที่อธิบายเรื่องนี้เองใส่แท็กปิดตัวจริงลงไป ทำให้
     tokenizer ตัดบล็อกกลางคัน SP.Export ไม่ถูกสร้าง และปุ่มบันทึกไฟล์ตายเงียบ ๆ
     ตอนนี้ assemble.py ตรวจให้แล้ว ถ้าใส่กลับเข้าไปจะประกอบไฟล์ไม่ผ่าน */
  function embedJson(obj) {
    return JSON.stringify(obj)
      .replace(/</g, '\\u003C')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
  }

  /* ASCII ล้วน — Chrome รับชื่อไทยใน download= ได้ แต่ไฟล์ต้องผ่าน Outlook /
     LINE / file share ที่พังชื่อไทยได้ทุกทาง · ท้ายด้วย YYYYMMDD แบบ ค.ศ.
     เพื่อให้เรียงตามเวลาใน Explorer ได้ถูกลำดับเสมอ แม้ข้ามรอยต่อปี */
  function filename(m, ext) {
    var d = U.toDate(m.weekOf + 'T00:00:00') || new Date();
    return 'andamantech-pipeline-' + m.yearTH + '-W' + U.pad(m.weekNo) + '-' +
           d.getFullYear() + U.pad(d.getMonth() + 1) + U.pad(d.getDate()) +
           '-r' + m.revision + '.' + (ext || 'html');
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }

  function bumpMeta(handoffTo) {
    var m = SP.state.meta;
    m.revision = (Number(m.revision) || 0) + 1;
    m.savedAt = U.nowISO();
    m.savedBy = SP.ui.me || m.preparedBy || '';
    m.handoffTo = handoffTo || '';
    m.editsSinceSave = 0;
    m.yearTH = U.yearTH(U.toDate(m.weekOf + 'T00:00:00') || new Date());
    m.weekNo = U.weekNo(U.toDate(m.weekOf + 'T00:00:00') || new Date());
    m.lineage = (m.lineage || []).concat([{
      revision:m.revision, savedBy:m.savedBy, handoffTo:m.handoffTo,
      savedAt:m.savedAt, weekOf:m.weekOf
    }]).slice(-10);
    SP.Store.flush();
  }

  function buildHtml() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('[data-render-root]').forEach(function (n) { n.innerHTML = ''; });
    clone.querySelectorAll('[data-runtime]').forEach(function (n) { n.parentNode.removeChild(n); });
    /* ต้องเป็น data-driven ห้ามไล่ id ด้วยมือ — รายการ id ที่ hardcode ไว้เดิม
       ทำให้ "เพิ่มแท็บใหม่แล้วลืมแก้บรรทัดนี้" = ไฟล์ที่ export ออกไปทุกไฟล์
       เรนเดอร์ view เกินซ้อนใต้รายงานสัปดาห์ โดยไม่มี error ไม่มี warning
       และไม่มีอาการบนเครื่องคนแก้เลย จะรู้ตัวก็ตอนลูกค้าเปิดไฟล์ที่ส่งไปแล้ว */
    clone.querySelectorAll('[data-view]').forEach(function (n) {
      if (n.id === 'view-week') n.removeAttribute('hidden');
      else n.setAttribute('hidden', '');
    });
    /* ประตู PIN ต้องกลับมาเสมอในไฟล์ที่ส่งออก — คนที่เปิดไฟล์ต่อจะได้ถูกถามหนึ่งครั้ง
       (สถานะปลดล็อกเก็บใน spw_v1_ui ซึ่งเป็นของเครื่อง ไม่เดินทางไปกับไฟล์) */
    var gate = clone.querySelector('#pin-gate');
    if (gate) gate.removeAttribute('hidden');
    /* ไฟล์ที่ export จากหน้าออนไลน์ = สำเนาสำรอง → ติด data-standalone ให้บูตแบบไฟล์เดี่ยว
       รหัสจริงไม่เคยอยู่ในซอร์ส ประตูของไฟล์สำรองจึงเทียบแฮชของรหัสที่ใช้ล็อกอินครั้งล่าสุด */
    clone.setAttribute('data-standalone', '');
    var ph = SP.Sync && (SP.Sync.storedPinHash() || (gate && gate.getAttribute('data-pin-hash')));
    if (gate && ph) gate.setAttribute('data-pin-hash', ph);
    var t = clone.querySelector('title');
    // ให้ตรงกับที่ header ตั้งไว้ตอนรัน — ไฟล์ที่ส่งต่อจะได้ขึ้นชื่อบริษัทเหมือนกัน
    if (t) t.textContent = ((SP.state.settings.brand || {}).name || 'AndamanTech') + ' — ' + SP.state.meta.title;
    clone.querySelector('#seed-data').textContent = embedJson(SP.state);
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  function saveHtml(handoffTo) {
    if (busy) return;
    busy = true;
    setTimeout(function () { busy = false; }, 1200);   // Chrome throttle การดาวน์โหลดรัว ๆ
    bumpMeta(handoffTo);
    var html = buildHtml();
    // ห้ามใส่ BOM — BOM หน้า <!DOCTYPE> ดันบางเบราว์เซอร์เข้า quirks mode
    download(new Blob([html], { type:'text/html;charset=utf-8' }), filename(SP.state.meta, 'html'));
    SP.Render.all();
    SP.Toast.show('บันทึกรอบที่ ' + SP.state.meta.revision + ' แล้ว — ถ้าแก้ไขเพิ่ม ต้องกดบันทึกไฟล์ใหม่อีกครั้ง', 'ok', 6000);
  }

  function askAndSave() {
    var owners = SP.state.owners.filter(function (o) { return o.active; });
    SP.Modal.open({
      title:'บันทึกเป็นไฟล์ HTML — รอบที่ ' + ((SP.state.meta.revision || 1) + 1), icon:'save',
      html:(SP.Sync && SP.Sync.online()
             ? '<p class="muted small">ข้อมูลอยู่ในฐานข้อมูลแล้ว ไฟล์นี้เป็น<b>สำเนาสำรอง</b> เปิดดูแบบออฟไลน์ได้ — แก้ในไฟล์แล้วจะไม่กลับเข้าฐานข้อมูล</p>'
             : '<p class="muted small">ไฟล์ที่ได้เปิดบนเครื่องไหนก็แก้ต่อได้ทันที ไม่ต้องติดตั้งอะไร ไม่ต้องต่อเน็ต</p>') +
        '<div class="field"><label>บันทึกโดย</label><input class="inp" id="sp-savedby" value="' +
          U.attr(SP.ui.me || SP.state.meta.preparedBy || '') + '" placeholder="ชื่อของคุณ"></div>' +
        '<div class="field"><label>ส่งต่อให้ (ไม่บังคับ)</label><select class="inp" id="sp-handoff">' +
          '<option value="">— ไม่ระบุ —</option>' +
          owners.map(function (o) { return '<option value="' + U.attr(o.name) + '">' + U.esc(o.name) + '</option>'; }).join('') +
        '</select><div class="hint">ระบุแล้ว หัวไฟล์ปลายทางจะอ่านได้ว่าตอนนี้ไม้อยู่ที่ใคร</div></div>' +
        '<div class="banner banner-info" style="margin:12px 0 0">' + U.ic('info') +
          '<span class="small">ส่งทางเมล: บีบอัดเป็น .zip ก่อน (Gmail/Outlook มักตัดไฟล์ .html) — หรือแชร์ผ่าน OneDrive / Google Drive / LINE</span></div>',
      buttons:[{ label:'ยกเลิก', id:'no' }, { label:'บันทึกไฟล์', id:'yes', cls:'btn btn-primary', icon:'save' }],
      onClick: function (id, root) {
        if (id !== 'yes') return;
        var by = root.querySelector('#sp-savedby').value.trim();
        if (by) { SP.ui.me = by; SP.Store.saveUI(); }
        saveHtml(root.querySelector('#sp-handoff').value);
      }
    });
  }

  function saveJson() {
    var name = filename(SP.state.meta, 'json');
    download(new Blob([JSON.stringify(SP.state, null, 1)], { type:'application/json;charset=utf-8' }), name);
    SP.Toast.show('ดาวน์โหลด ' + name + ' แล้ว', 'ok');
  }

  function loadJson() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var doc;
        try { doc = SP.Store.migrate(JSON.parse(r.result)); }
        catch (e) { SP.Toast.show('อ่านไฟล์ JSON ไม่ได้: ' + e.message, 'bad'); return; }
        if (!doc || !doc.meta || !Array.isArray(doc.jobs)) { SP.Toast.show('ไฟล์นี้ไม่ใช่ข้อมูลของ sale-pipeline', 'bad'); return; }
        SP.Modal.confirm({
          title:'นำเข้าข้อมูลจาก JSON?', icon:'upload', danger:true, ok:'แทนที่ข้อมูลทั้งหมด',
          html:'<p>ไฟล์: <b>' + U.esc(f.name) + '</b><br>รอบที่ ' + U.esc(doc.meta.revision || 1) +
               ' · ' + doc.jobs.length + ' งาน · ' + (doc.plans || []).length + ' แผน · ' + (doc.discussions || []).length + ' วาระ</p>' +
               '<p class="muted small">ข้อมูลในเครื่องตอนนี้จะถูกแทนที่ทั้งหมด</p>'
        }, function () {
          SP.Store.pushUndo('นำเข้า JSON: ' + f.name);
          SP.state = doc;
          SP.Store.touch();
          SP.Render.all();
          SP.Toast.show('นำเข้าข้อมูลจาก JSON แล้ว', 'ok');
        });
      };
      r.readAsText(f, 'utf-8');
    };
    inp.click();
  }

  return { saveHtml:saveHtml, askAndSave:askAndSave, saveJson:saveJson, loadJson:loadJson,
           filename:filename, embedJson:embedJson, buildHtml:buildHtml, download:download };
})();

SP.Actions.on('export:html', function () { SP.Export.askAndSave(); });
SP.Actions.on('export:json', function () { SP.Export.saveJson(); });
SP.Actions.on('import:json', function () { SP.Export.loadJson(); });
SP.Actions.on('import:undo', function () {
  var u = SP.Store.popUndo();
  if (!u) { SP.Toast.show('ไม่มีอะไรให้ย้อนกลับ', 'warn'); return; }
  SP.state = SP.Store.migrate(u.doc);
  SP.Store.touch();
  SP.Render.all();
  SP.Toast.show('ย้อนกลับ: ' + u.label, 'ok');
});
</script>

        t.kw.forEach(function (w) { if (norm(hdr).indexOf(norm(w)) >= 0) sc++; });

     แต่ต้อง "แสดงให้เห็น" เพราะเดาเงียบ ๆ คือวิธีที่จะได้งาน 24 ชิ้นชื่อ "budget level" */
  function guessHeader(rows, vocab) {
    vocab = vocab || HEADER_VOCAB;          // รับคำศัพท์ของ profile เข้ามา แทนที่จะปิดทับตัวเดียว
    var best = -1, bestScore = 0;
    for (var i = 0; i < Math.min(10, rows.length); i++) {
      var r = rows[i] || [], sc = 0;
      for (var j = 0; j < r.length; j++) if (vocab.test(String(r[j]))) sc++;
      if (String(r[0]).trim() === '#' || String(r[0]).trim() === 'ที่') sc += 2;
      if (sc > bestScore) { bestScore = sc; best = i; }
    }
    return best >= 0 ? best : 2;
  }

  function autoMap() {
    var hdr = st.rows[st.headerRow] || [];
    var claimed = {}, map = {};
    P().targets.forEach(function (t) {
      var bestI = -1, bestLen = 0;
      for (var i = 0; i < hdr.length; i++) {
        if (claimed[i]) continue;
        var h = norm(hdr[i]); if (!h) continue;
        for (var k = 0; k < t.kw.length; k++) {
          var w = norm(t.kw[k]);
          if (w && (h.indexOf(w) >= 0 || w.indexOf(h) >= 0) && w.length > bestLen) { bestLen = w.length; bestI = i; }
        }
      }
      if (bestI >= 0) { claimed[bestI] = 1; map[t.k] = bestI; }
      else map[t.k] = -1;
    });
    st.map = map;
  }

  function cell(row, k) {
    var i = st.map[k];
    if (i === undefined || i < 0) return '';
    return String((row && row[i]) === undefined || row[i] === null ? '' : row[i]).trim();
  }

  /* แปลงแถวดิบเป็น job — กฎข้ามแถวตาม §4.4 และเก็บ sectionLabel จากแถวหัวข้อกลุ่ม */
  function parseJobRows() {
    var out = [], section = '', skip = { section:0, blank:0 };
    for (var i = st.headerRow + 1; i < st.rows.length; i++) {
      var r = st.rows[i] || [];
      var cells = r.map(function (c) { return String(c === undefined || c === null ? '' : c); });
      var nonEmpty = cells.filter(function (c) { return c.trim(); }).length;
      var first = '';
      for (var q = 0; q < cells.length; q++) { if (cells[q].trim()) { first = cells[q].trim(); break; } }
      if (first && SP.Norm.isSectionRow(first)) { section = SP.Norm.sectionLabel(first); skip.section++; continue; }
      var name = cell(r, 'customerName');
      if (!name || nonEmpty <= 1 || /ยอดรวม|รวมทั้งสิ้น|รวม \(/.test(cells.join(','))) { skip.blank++; continue; }

      var stageRaw = cell(r, 'stage');
      var budgetRaw = cell(r, 'budgetCode');
      var valueRaw = cell(r, 'value');
      var budgetCode = SP.Norm.budget(budgetRaw);
      var product = cell(r, 'product');
      var pg = SP.Norm.productGroup(product, cell(r, 'productGroup'));
      var bedRaw = '';
      out.push({
        _row: i + 1, _section: section,
        _warn: {
          value: !!(valueRaw && SP.Norm.value(valueRaw) === 0 && valueRaw !== '-'),
          budget: !!(budgetRaw && !/[1-5]/.test(budgetRaw)),
          stage: !!(stageRaw && SP.Norm.stage(stageRaw) === 'S0' && !/^s0/i.test(stageRaw))
        },
        job: SP.Norm.blankJob({
          customerName: name,
          customerGroup: SP.Norm.customerGroup(cell(r, 'customerGroup')),
          province: cell(r, 'province'),
          sectionLabel: section,
          product: product, productGroup: pg,
          value: SP.Norm.value(valueRaw),
          stage: SP.Norm.stage(stageRaw),
          budgetCode: budgetCode,
          budgetYear: cell(r, 'budgetYear'),
          salesStatus: stageRaw,
          detail: cell(r, 'detail'),
          remark: cell(r, 'remark'),
          assignedTo: U.normNames(cell(r, 'assignedTo')),
          interest: SP.Norm.interest(budgetCode)
        })
      });
    }
    return { list: out, skip: skip };
  }

  /* ---- ตัวแปลงแถวของอีกสาม profile --------------------------------------
     คืนรูปร่างเดียวกับ parseJobRows(): { list:[{_row,_warn,...}], skip:{} }
     เพื่อให้ step1/step2 นับแถวและแสดงผลด้วยโค้ดชุดเดียว */

  function parseCustRows() {
    var out = [], skip = { section:0, blank:0 }, seen = {};
    for (var i = st.headerRow + 1; i < st.rows.length; i++) {
      var r = st.rows[i] || [];
      var nm = cell(r, 'name');
      if (!nm) { skip.blank++; continue; }
      var k = SP.Norm.custKey(nm);
      if (!k || seen[k]) { skip.blank++; continue; }      // ชื่อซ้ำในชีตเดียวกัน = แถวเดียวพอ
      seen[k] = 1;

      var last = SP.U.parseTH(cell(r, 'lastContactAt'), SP.state.meta.weekOf);
      var next = SP.U.parseTH(cell(r, 'nextAction'), SP.state.meta.weekOf);
      var fit  = cell(r, 'fitProducts');
      var cust = SP.Norm.blankCustomer({
        name: nm,
        zone: cell(r, 'zone'), province: cell(r, 'province'),
        hospitalType: cell(r, 'hospitalType'), ownerType: cell(r, 'ownerType'),
        ownerGroup: cell(r, 'ownerGroup'), schemes: cell(r, 'schemes'),
        approachDept: cell(r, 'approachDept'), approachNote: cell(r, 'approachNote'),
        fitProducts: fit, productGroups: SP.Norm.productGroups(fit),
        /* ใช้กฎเดิมของ customerGroup กับคอลัมน์ "ประเภทเจ้าของ" — มันแมป
           'เอกชน / Owner-led' -> รพ.เอกชน ได้ถูกอยู่แล้ว ไม่ต้องเขียนกฎใหม่ */
        customerGroup: SP.Norm.customerGroup(cell(r, 'ownerType')),
        priority: SP.Norm.priority(cell(r, 'priority')),
        leadStatus: SP.Norm.leadStatus(cell(r, 'leadStatus')),
        salesOwner: cell(r, 'salesOwner'),
        lastContactAt: last ? last.iso : null,
        nextActionAt: next ? next.iso : null,
        nextActionNote: next ? next.rest : cell(r, 'nextAction'),
        sourceUrl: cell(r, 'sourceUrl'),
        remark: cell(r, 'remark'),
        lineNote: cell(r, 'lineNote')
      });
      /* M–P + V ของชีตนี้เป็น "ผู้ติดต่อ" ไม่ใช่ฟิลด์ของโรงพยาบาล
         หนึ่งแถวจึงได้ 1 customer + 0..1 contact — ชื่อว่าง = ไม่มีผู้ติดต่อ */
      var sc = SP.Norm.splitContact(cell(r, 'contactName'));
      var contact = null;
      if (sc.name) {
        contact = SP.Norm.blankContact({
          name: sc.name, role: cell(r, 'contactRole'),
          phone: cell(r, 'contactPhone') || sc.phone,
          email: cell(r, 'contactEmail'), line: cell(r, 'lineNote'),
          isPrimary: true
        });
      }
      out.push({ _row:i + 1, _warn:{
        date: !!(cell(r, 'lastContactAt') && !last),
        priority: !!(cell(r, 'priority') && !/[ABC]/i.test(cell(r, 'priority')))
      }, cust:cust, contact:contact });
    }
    return { list:out, skip:skip };
  }

  function parseActRows() {
    var out = [], skip = { section:0, blank:0 }, custs = SP.Cust.all();
    for (var i = st.headerRow + 1; i < st.rows.length; i++) {
      var r = st.rows[i] || [];
      var raw = cell(r, 'customerRaw');
      var dRaw = cell(r, 'date');
      if (!raw && !dRaw) { skip.blank++; continue; }
      /* แถวที่ไม่มีชื่อโรงพยาบาลต้องข้าม "และนับไว้" — ในไฟล์จริงมีแถวแบบนี้อยู่
         ถ้าข้ามเงียบ ๆ ผู้ใช้จะนับแถวไม่ตรงแล้วไม่รู้ว่าหายไปไหน */
      if (!raw) { skip.blank++; continue; }

      var dp = SP.U.parseTH(dRaw, SP.state.meta.weekOf);
      var fu = SP.U.parseTHAll(cell(r, 'followUp'), SP.state.meta.weekOf);
      var dn = SP.U.parseTH(cell(r, 'doneDate'), SP.state.meta.weekOf);
      var m = SP.Norm.matchCustomer(raw, custs);
      var chRaw = cell(r, 'channel');
      var topic = cell(r, 'topic');
      var sc = SP.Norm.splitContact(cell(r, 'contactName'));

      var act = SP.Norm.blankActivity({
        customerId: (m.customer && m.score >= 0.9) ? m.customer.id : null,
        date: dp ? dp.iso : null,
        doneDate: dn ? dn.iso : null,
        channel: SP.Norm.channel(chRaw), channelNote: chRaw,
        topic: topic, result: cell(r, 'result'), nextAction: cell(r, 'nextAction'),
        followUpAt: fu.length ? fu[0].iso : null,
        /* ช่องนี้มีได้หลายนัดในเซลล์เดียว — เก็บนัดแรกเป็นวันจริง ที่เหลือเป็นข้อความ
           การแตกเป็นสองงานอัตโนมัติตอน bulk import เป็นการตัดสินใจแทนผู้ใช้มากเกินไป */
        followUpNote: fu.length
          ? (fu[0].rest || '') + (fu.length > 1 ? ' · อีกนัด: ' + fu.slice(1).map(function (x) { return SP.U.fmtDate(x.iso); }).join(', ') : '')
          : cell(r, 'followUp'),
        status: SP.Norm.actStatus(cell(r, 'status')),
        owner: cell(r, 'owner'), lineNote: cell(r, 'lineNote')
      });
      act.importKey = (act.date || '') + '|' + SP.Norm.custKey(raw) + '|' + SP.Norm.custKey(topic).slice(0, 40);

      out.push({ _row:i + 1, _raw:raw, _match:m, _contactName:sc.name, _contactRole:cell(r, 'contactRole'),
                 _warn:{ date: !!(dRaw && !dp), multi: fu.length > 1 }, act:act });
    }
    return { list:out, skip:skip };
  }

  function parseRegRows() {
    var out = [], skip = { section:0, blank:0 }, custs = SP.Cust.all();
    for (var i = st.headerRow + 1; i < st.rows.length; i++) {
      var r = st.rows[i] || [];
      var nm = cell(r, 'name');
      if (!nm) { skip.blank++; continue; }
      var m = SP.Norm.matchCustomer(nm, custs);
      out.push({
        _row:i + 1, _match:m,
        action: SP.Norm.registryAction(cell(r, 'action')),
        name: nm,
        fields: {
          province: cell(r, 'province'), zone: cell(r, 'zone'),
          hospitalType: cell(r, 'hospitalType'), ownerType: cell(r, 'ownerType'),
          ownerGroup: cell(r, 'ownerGroup'), schemes: cell(r, 'schemes'),
          sourceUrl: cell(r, 'sourceUrl'),
          priority: SP.Norm.priority(cell(r, 'priority')),
          bedSize: SP.Norm.value(cell(r, 'bedSize')) || null
        },
        registry: {
          action: SP.Norm.registryAction(cell(r, 'action')),
          similarity: cell(r, 'similarity'), reason: cell(r, 'reason'),
          reviewedAt: SP.U.nowISO()
        },
        _warn:{ action: !!(cell(r, 'action') && !SP.Norm.registryAction(cell(r, 'action'))) }
      });
    }
    return { list:out, skip:skip };
  }

  /* ชื่อที่จับคู่อัตโนมัติไม่ได้ ต้องให้คนตัดสิน — 'รพ.บีแคร์' vs 'B.Care Medical Center'
     ไม่มีอัลกอริทึมสตริงไหนจับได้ และการเดาผิดแย่กว่าการถาม
     เลือกแล้วชื่อดิบจะถูกเก็บเป็น alias ทำให้รันไฟล์เดิมซ้ำครั้งหน้าไม่ต้องเลือกอีก */
  function unresolved(list) {
    var need = {};
    list.forEach(function (r) {
      var raw = r._raw || r.name;
      if (!raw) return;
      var k = SP.Norm.custKey(raw);
      if (r._match && r._match.customer && r._match.score >= 0.9) return;
      if (st.resolve[k]) return;
      need[k] = need[k] || { key:k, raw:raw, guess:r._match, count:0 };
      need[k].count++;
    });
    return Object.keys(need).map(function (k) { return need[k]; });
  }

  /* ---- diff: รวมข้อมูล vs แทนที่ ---------------------------------------- */
  function diffJobs() {
    var p = parseJobRows(), list = p.list;
    var index = {};
    SP.state.jobs.forEach(function (j) { index[SP.Norm.jobKey(j.customerName, j.productGroup)] = j; });
    var res = { add:[], update:[], same:[], near:[], skip:p.skip, list:list, newOwners:{} };
    list.forEach(function (r) {
      var key = SP.Norm.jobKey(r.job.customerName, r.job.productGroup);
      var hit = index[key];
      U.normNames(r.job.assignedTo).forEach(function (n) { if (!U.ownerByName(n)) res.newOwners[n] = 1; });
      if (hit) {
        var changed = ['stage','value','budgetCode','budgetYear','product','detail','remark','province','customerGroup']
          .some(function (k) { return String(hit[k] || '') !== String(r.job[k] || ''); });
        (changed ? res.update : res.same).push({ row:r, target:hit });
      } else {
        // เกือบตรง — ให้ผู้ใช้ตัดสิน ดีกว่าเดาแล้วรวมผิด
        var nearHit = null;
        SP.state.jobs.forEach(function (j) {
          if (nearHit || j.productGroup !== r.job.productGroup) return;
          if (SP.Norm.levenshtein(j.customerName, r.job.customerName) <= 3) nearHit = j;
        });
        if (nearHit) res.near.push({ row:r, target:nearHit });
        res.add.push(r);
      }
    });
    return res;
  }

  function diffCust() {
    var p = parseCustRows();
    var res = { add:[], update:[], same:[], near:[], skip:p.skip, list:p.list, newOwners:{}, unresolved:[] };
    var existing = SP.Cust.all();
    p.list.forEach(function (r) {
      if (r.cust.salesOwner && !U.ownerByName(r.cust.salesOwner)) res.newOwners[r.cust.salesOwner] = 1;
      /* เข้มงวด: ทุกแถวในทะเบียนคือคนละโรงพยาบาล การเดาจึงห้ามมีส่วนตัดสิน
         (ต้องใช้กฎเดียวกับ commitCust เป๊ะ ๆ ไม่งั้น "ตรวจก่อนยืนยัน" จะโกหก) */
      var m = SP.Norm.matchStrict(r.cust.name, existing);
      r._match = m;
      if (m.customer) {
        r._target = m.customer;
        res.update.push({ row:r, target:m.customer });
      } else {
        res.add.push(r);
        /* ชื่อที่ "คล้าย" ของเดิมแต่ไม่เท่ากัน ให้เตือนตาไว้เฉย ๆ ไม่รวมให้เอง —
           สาขาที่ต่างกันแค่เลขท้ายมีอยู่เต็มไฟล์ ถ้ารวมให้จะเงียบและผิด */
        var near = SP.Norm.matchCustomer(r.cust.name, existing);
        if (near.customer && near.score >= 0.9) res.near.push({ row:r, target:near.customer });
      }
    });
    return res;
  }

  function diffAct() {
    var p = parseActRows();
    var res = { add:[], update:[], same:[], near:[], skip:p.skip, list:p.list, newOwners:{}, unresolved:[] };
    var byKey = {};
    SP.Act.all().forEach(function (a) { if (a.importKey) byKey[a.importKey] = a; });
    p.list.forEach(function (r) {
      if (r.act.owner && !U.ownerByName(r.act.owner)) res.newOwners[r.act.owner] = 1;
      var hit = byKey[r.act.importKey];
      if (hit) { r._target = hit; res.update.push({ row:r, target:hit }); }
      else res.add.push(r);
    });
    res.unresolved = unresolved(p.list);
    return res;
  }

  function diffReg() {
    var p = parseRegRows();
    var res = { add:[], update:[], same:[], near:[], skip:p.skip, list:p.list, newOwners:{}, unresolved:[] };
    p.list.forEach(function (r) {
      if (r._match && r._match.customer && r._match.score >= 0.9) {
        r._target = r._match.customer;
        res.update.push({ row:r, target:r._match.customer });
      } else if (r.action === 'EXCLUDE') {
        res.same.push(r);            // ไม่เจอ + สั่งตัดออก = ไม่ต้องทำอะไร
      } else {
        res.add.push(r);
      }
    });
    res.unresolved = unresolved(p.list);
    return res;
  }

  /* ตัวส่งต่อ — step1/step2/commit เรียกผ่านสามตัวนี้เท่านั้น */
  function parseRows() { return P().parse(); }
  function diff()      { return P().diff(); }
  function commit()    { return P().commit(); }

  function commitJobs() {
    var d = diffJobs();
    SP.Store.pushUndo('นำเข้า ' + st.fileName);
    var n = { add:0, upd:0 };

    if (st.mode === 'replace') {
      SP.state.jobs = [];
    }
    var index = {};
    SP.state.jobs.forEach(function (j) { index[SP.Norm.jobKey(j.customerName, j.productGroup)] = j; });

    d.list.forEach(function (r) {
      var key = SP.Norm.jobKey(r.job.customerName, r.job.productGroup);
      var hit = index[key];
      if (hit && st.mode === 'merge') {
        /* อัปเดตเฉพาะฟิลด์การค้า — ฟิลด์รายสัปดาห์ทุกตัวต้องรอด */
        if (hit.stage !== r.job.stage) {
          hit.stageHistory = (hit.stageHistory || []).concat([{
            stage:r.job.stage, from:hit.stage, at:U.nowISO(),
            weekOf:SP.state.meta.weekOf, note:'อัปเดตจากไฟล์'
          }]);
        }
        ['stage','value','budgetCode','budgetYear','product','detail','remark','salesStatus','province','customerGroup','sectionLabel']
          .forEach(function (k) { hit[k] = r.job[k]; });
        if (U.normNames(r.job.assignedTo).length) hit.assignedTo = U.normNames(r.job.assignedTo);
        hit.updatedAt = U.nowISO();
        n.upd++;
      } else {
        var j = r.job;
        j.id = U.uid('J');
        j.seedBatch = 'import';
        j.isNewThisWeek = true;                 // prefill เป็นข้อเสนอ ธงยังติ๊กเอง
        j.newSince = U.nowISO();
        j.stageHistory = [{ stage:j.stage, from:null, at:U.nowISO(), weekOf:SP.state.meta.weekOf, note:'นำเข้าจากไฟล์' }];
        SP.state.jobs.push(j);
        index[SP.Norm.jobKey(j.customerName, j.productGroup)] = j;
        n.add++;
      }
    });

    finishImport(d, n);
  }

  /* ท้ายการ commit ทุก profile ใช้ร่วมกัน — เขียนที่เดียวจะได้ไม่ลืมขั้นตอนไหน */
  function finishImport(d, n, extra) {
    SP.state.meta.lastImports = SP.state.meta.lastImports || {};
    SP.state.meta.lastImports[st.profile] = {
      fileName:st.fileName, at:U.nowISO(), rows:d.list.length, mode:st.mode, sheet:st.sheet
    };
    /* step0 ยังอ่าน meta.lastImport ตัวเดิมอยู่ จึงต้องเขียนต่อไปสำหรับ profile งาน
       ไม่งั้นบรรทัด "นำเข้าล่าสุด" จะหายไปเงียบ ๆ */
    if (st.profile === 'jobs') {
      SP.state.meta.lastImport = { fileName:st.fileName, at:U.nowISO(), rows:d.list.length, mode:st.mode };
    }
    /* ผูก job เข้าทะเบียนทุกครั้งหลังนำเข้า — ฟังก์ชันเดียวกับที่ migrate() เรียก */
    var linked = SP.Norm.linkJobsToCustomers(SP.state);
    SP.Store.touch();
    st.step = 0; st.rows = []; st.buf = null; st.resolve = {};
    SP.Render.tab(P().go);
    SP.Toast.show('นำเข้าสำเร็จ — เพิ่มใหม่ ' + n.add + ' · อัปเดต ' + n.upd +
      (extra ? ' · ' + extra : ''), 'ok', 6000);
    if (linked.linked) SP.Toast.show('ผูกงานเข้ากับทะเบียนลูกค้าได้อีก ' + linked.linked + ' รายการ', 'ok', 5000);
    var orphans = SP.Settings.orphanNames();
    if (orphans.length) SP.Toast.show('พบผู้รับผิดชอบใหม่ ' + orphans.length + ' ชื่อ — เพิ่มได้ที่หน้าตั้งค่า', 'warn', 7000);
  }

  function commitCust() {
    var d = diffCust();
    SP.Store.pushUndo('นำเข้าทะเบียนลูกค้า: ' + st.fileName);
    var n = { add:0, upd:0 }, nc = 0;

    if (st.mode === 'replace') {
      /* ต้องตัด FK ที่ห้อยอยู่ด้วย ไม่งั้น job/activity จะชี้ไปยัง id ที่ไม่มีแล้ว
         และ SP.Cust.name() จะคืน "ลูกค้าที่อ้างถึงถูกลบ" ทั้งระบบ */
      SP.state.customers = [];
      SP.state.contacts = [];
      SP.state.jobs.forEach(function (j) { j.customerId = null; });
      SP.state.plans.forEach(function (p) { p.customerId = null; });
      (SP.state.activities || []).forEach(function (a) { a.customerId = null; });
    }

    d.list.forEach(function (r) {
      // กฎเดียวกับ diffCust — เข้มงวด ไม่เดา (ดูเหตุผลที่นั่น)
      var target = st.mode === 'replace' ? null
        : SP.Norm.matchStrict(r.cust.name, SP.Cust.all()).customer;
      var c;
      if (target) {
        /* ไม่ทับ aliases / registry / active ซึ่งชีตนี้ไม่มีคอลัมน์ให้ */
        ['zone','province','hospitalType','ownerType','ownerGroup','schemes','approachDept',
         'approachNote','fitProducts','priority','leadStatus','salesOwner','sourceUrl','remark','lineNote']
          .forEach(function (k) { if (r.cust[k]) target[k] = r.cust[k]; });
        if (r.cust.productGroups.length) target.productGroups = r.cust.productGroups;
        if (r.cust.lastContactAt) target.lastContactAt = r.cust.lastContactAt;
        if (r.cust.nextActionAt)  target.nextActionAt  = r.cust.nextActionAt;
        if (r.cust.nextActionNote) target.nextActionNote = r.cust.nextActionNote;
        target.updatedAt = U.nowISO();
        c = target; n.upd++;
      } else {
        c = r.cust;
        c.id = U.uid('C');
        c.seedBatch = 'import';
        SP.state.customers.push(c);
        n.add++;
      }
      if (r.contact && r.contact.name) {
        var dup = SP.Cust.contacts(c.id).some(function (k) {
          return SP.Norm.custKey(k.name) === SP.Norm.custKey(r.contact.name);
        });
        if (!dup) {
          var k2 = r.contact;
          k2.id = U.uid('K'); k2.customerId = c.id;
          k2.isPrimary = !SP.Cust.contacts(c.id).length;
          SP.state.contacts.push(k2);
          nc++;
        }
      }
    });
    finishImport(d, n, 'ผู้ติดต่อ ' + nc + ' คน');
  }

  function commitAct() {
    var d = diffAct();
    SP.Store.pushUndo('นำเข้าบันทึกการติดต่อ: ' + st.fileName);
    var n = { add:0, upd:0 }, skipped = 0;

    if (st.mode === 'replace') {
      SP.state.activities = [];
      SP.state.plans.forEach(function (p) { p.activityId = null; });
    }
    var byKey = {};
    SP.Act.all().forEach(function (a) { if (a.importKey) byKey[a.importKey] = a; });

    d.list.forEach(function (r) {
      var a = r.act;
      // ใช้คำตัดสินของผู้ใช้จากแผง "ชื่อที่ยังจับคู่ไม่ได้"
      if (!a.customerId) {
        var key = SP.Norm.custKey(r._raw), choice = st.resolve[key];
        if (choice === 'skip') { skipped++; return; }
        if (choice === 'new') {
          var nc = SP.Cust.create({ name:r._raw, seedBatch:'import' });
          a.customerId = nc.id;
        } else if (choice) {
          a.customerId = choice;
          var hitC = SP.Cust.get(choice);
          /* จำไว้ว่าชื่อดิบนี้คือรายเดียวกัน — ครั้งหน้าจับคู่เองไม่ต้องถาม */
          if (hitC && (hitC.aliases || []).map(SP.Norm.custKey).indexOf(key) < 0) hitC.aliases.push(r._raw);
        }
      }
      // ผูกผู้ติดต่อถ้าหาเจอในลูกค้ารายนั้น ไม่เจอก็สร้างให้
      if (a.customerId && r._contactName) {
        var ks = SP.Cust.contacts(a.customerId);
        var hitK = null;
        ks.forEach(function (k) { if (!hitK && SP.Norm.custKey(k.name) === SP.Norm.custKey(r._contactName)) hitK = k; });
        if (!hitK) hitK = SP.Cust.addContact(a.customerId, { name:r._contactName, role:r._contactRole });
        a.contactId = hitK.id;
      }

      var hit = byKey[a.importKey];
      if (hit && st.mode === 'merge') {
        ['date','doneDate','channel','channelNote','topic','result','nextAction',
         'followUpAt','followUpNote','status','owner','lineNote','customerId','contactId']
          .forEach(function (k) { if (a[k]) hit[k] = a[k]; });
        hit.updatedAt = U.nowISO();
        n.upd++;
      } else {
        a.id = U.uid('A');
        a.seedBatch = 'import';
        SP.state.activities.push(a);
        byKey[a.importKey] = a;
        n.add++;
      }
      // อัปเดต "ติดต่อล่าสุด" ของลูกค้าให้ตรงกับไทม์ไลน์
      var c = SP.Cust.get(a.customerId);
      if (c) {
        var when = a.doneDate || a.date;
        if (when && (!c.lastContactAt || when > c.lastContactAt)) c.lastContactAt = when;
        if (c.leadStatus === 'new') c.leadStatus = 'contacted';
      }
    });
    finishImport(d, n, skipped ? 'ข้าม ' + skipped + ' แถวตามที่เลือก' : '');
  }

  function commitReg() {
    var d = diffReg();
    SP.Store.pushUndo('นำเข้าการทบทวนทะเบียน: ' + st.fileName);
    var n = { add:0, upd:0 }, excluded = 0;

    d.list.forEach(function (r) {
      var target = r._target;
      if (!target) {
        var choice = st.resolve[SP.Norm.custKey(r.name)];
        if (choice === 'skip') return;
        if (choice && choice !== 'new') target = SP.Cust.get(choice);
      }
      if (target) {
        /* เติมเฉพาะช่องที่ยังว่าง — Master List เป็นชีตที่ข้อมูลรวยกว่า
           ชีตทบทวนห้ามทับของเดิมที่มีค่าอยู่แล้ว */
        Object.keys(r.fields).forEach(function (k) {
          if (r.fields[k] && !target[k]) target[k] = r.fields[k];
        });
        target.registry = r.registry;                 // ผลการทบทวนทับได้เสมอ มันคือของใหม่
        if (r.action === 'EXCLUDE') { target.active = false; excluded++; }
        target.updatedAt = U.nowISO();
        n.upd++;
      } else if (r.action === 'EXCLUDE') {
        return;                                        // ไม่มีในทะเบียนอยู่แล้ว ไม่ต้องทำอะไร
      } else {
        var c = SP.Norm.blankCustomer(r.fields);
        c.id = U.uid('C');
        c.name = r.name;
        c.seedBatch = 'import';
        c.registry = r.registry;
        c.active = (r.action !== 'WATCH');             // WATCH = เก็บไว้ดู ยังไม่เอาเข้ารายชื่อหลัก
        SP.state.customers.push(c);
        n.add++;
      }
    });
    finishImport(d, n, excluded ? 'ปิดไว้ ' + excluded + ' ราย' : '');
  }

  function rawPreview() {
    var max = Math.min(st.rows.length, 10);
    var wide = 0;
    for (var i = 0; i < max; i++) wide = Math.max(wide, (st.rows[i] || []).length);
    var head = '<tr><th class="rn">แถว</th>';
    for (var c = 0; c < wide; c++) head += '<th>' + colName(c) + '</th>';
    head += '</tr>';
    var body = '';
    for (var r = 0; r < max; r++) {
      body += '<tr class="' + (r === st.headerRow ? 'is-header' : '') + '"><td class="rn">' + (r + 1) + '</td>';
      for (var k = 0; k < wide; k++) body += '<td>' + U.esc((st.rows[r] || [])[k] || '') + '</td>';
      body += '</tr>';
    }
    return '<div class="raw-preview"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }
