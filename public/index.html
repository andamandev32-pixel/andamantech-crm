     ดึงค่าจริงจาก computed style ของเว็บนั้น ไม่ได้กะสีเอา
     ระบบนี้ "แบน": ไม่มีเงาบนพื้นผิวในหน้า ใช้เส้นขอบเส้นผม 0.8px แทนทั้งหมด
     เงาเหลือไว้เฉพาะของที่ลอยเหนือหน้าจริง ๆ (drawer / modal / toast) */

  /* เขียวคือสีลงมือ น้ำเงินคือสีข้อมูล/ลิงก์ — คู่เดียวกับแถบบนสุดของ ServiceFlow */
  --green:#06C755; --green-dark:#058739; --green-light:#EFFBF4;
  --blue:#3579EA; --blue-dark:#111111; --blue-light:#EFF4FE; --purple:#7F56D9;
  /* สีแบรนด์แยกจากสีระบบ เพื่อให้เปลี่ยนชุดสีของ AndamanTech ได้ที่จุดเดียว
     (ตั้งทับตอนรันได้ด้วย settings.brand.accent) */
  --brand-1:#06C755; --brand-2:#3579EA;

  --bg:#FAFAFA; --surface:#fff;
  /* สเกลเทากลาง ๆ ของ ServiceFlow — g200 คือเส้นขอบเส้นผม g500 คือตัวหนังสือจาง */
  --g50:#FAFAFA; --g100:#F5F5F5; --g200:#DFDFDF; --g300:#D4D4D4;
  --g400:#A3A3A3; --g500:#666666; --g600:#555555; --g700:#333333; --g900:#111111;
  --amber:#F79009; --red:#F04438; --cyan:#0891B2;

  /* ชิป 6 · ปุ่ม/ช่องกรอก 8 · การ์ด 12 — เลิกใช้ปุ่มแคปซูล
     r-pill เหลือไว้สำหรับป้ายสถานะ ซึ่ง ServiceFlow ก็ยังใช้ 999px */
  --r-sm:6px; --r:8px; --r-lg:12px; --r-xl:16px; --r-pill:9999px;
  --hair:0.8px;
  --sh-sm:none; --sh:none; --sh-md:none; --sh-lg:none;
  /* ชั้นลอย: ต้องมีเงา ไม่งั้น drawer ที่ทับเนื้อหาจะอ่านไม่ออกว่าลอยอยู่ */
  --sh-float:0 8px 28px rgba(17,17,17,.14),0 2px 6px rgba(17,17,17,.06);
  --present-scale:1;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--g900);
  /* Anuphan ฝังอยู่ในไฟล์นี้แล้ว (ดู @font-face ด้านบน) จึงไม่ต้องพึ่งเน็ต
     ตัวสำรองไว้เผื่อไฟล์ถูกตัดแต่งจนฟอนต์หาย */
  font-family:'Anuphan','Sarabun','Leelawadee UI','Tahoma',system-ui,sans-serif;
  font-size:14px;
  /* 1.7 ไม่ใช่ 1.5 — สระบน/ล่างและวรรณยุกต์ไทยโดนตัดที่ 1.5 และเห็นชัดมากบนโปรเจกเตอร์ */
  line-height:1.7;
}
h1,h2,h3,h4{margin:0; font-weight:700; line-height:1.4}
p{margin:0 0 .5em}
a{color:var(--blue)}
button,input,select,textarea{font:inherit; color:inherit}
[hidden]{display:none !important}

/* ---------- icons ---------------------------------------------------------- */
.ic{
  width:1em; height:1em; flex:none; vertical-align:-.14em;
  fill:none; stroke:currentColor; stroke-width:1.75;
  stroke-linecap:round; stroke-linejoin:round;
  pointer-events:none;              /* กัน e.target เป็น <use> แล้ว closest() พลาด */
}
.ic-lg{width:1.35em;height:1.35em}
.ic-xl{width:2.1em;height:2.1em}

/* ---------- layout --------------------------------------------------------- */
.wrap{max-width:1440px;margin:0 auto;padding:0 20px}
main{padding:20px 0 64px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.col{flex:1 1 0;min-width:0}
.spacer{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.center{display:flex;align-items:center;gap:8px}
.muted{color:var(--g500)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--g200);margin:16px 0;border:0}

/* ---------- header --------------------------------------------------------- */
#app-header{
  position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:var(--hair) solid var(--g200)
}
/* แถบเขียว→น้ำเงินบนสุด — ลายเซ็นของ ServiceFlow ทำด้วย ::before จึงไม่ต้องแตะ
   markup ของ header ซึ่งถูก render ใหม่ทุกครั้งจาก SP.Render.header() */
#app-header::before{
  content:"";display:block;height:4px;
  background:linear-gradient(90deg,var(--green) 0%,var(--green) 55%,var(--blue) 55%,var(--blue) 100%)
}
.hdr-top{display:flex;align-items:center;gap:14px;padding:11px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:var(--r);flex:none;color:#fff;
  background:linear-gradient(135deg,var(--brand-1) 0%,var(--brand-2) 100%);
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
/* โลโก้ที่ผู้ใช้ใส่เอง — บีบให้พอดีกรอบเสมอ ไม่ว่าไฟล์ต้นทางจะสัดส่วนไหน
   กรอบไล่สีจะถูกถอดออกเมื่อมีโลโก้จริง เพราะโลโก้ส่วนใหญ่มีพื้นหลังของตัวเอง */
.brand-mark:has(.brand-logo){background:none}
.brand-logo,.brand-logo>svg,img.brand-logo{
  width:100%;height:100%;display:block;object-fit:contain
}
/* โลโก้แบบคำ: ล็อกความสูง ปล่อยความกว้างตามสัดส่วนจริง */
.brand-wordmark{height:32px;flex:none;display:flex;align-items:center;max-width:210px}
.brand-wordmark .brand-logo,.brand-wordmark img,.brand-wordmark svg{
  height:100%;width:auto;max-width:100%;object-fit:contain
}
@media (max-width:520px){ .brand-wordmark{height:26px;max-width:150px} }
.brand-title{font-weight:700;font-size:15px;line-height:1.25}
.brand-sub{font-size:12px;color:var(--g500);line-height:1.3}
.week-pick{
  display:flex;align-items:center;gap:6px;background:var(--g50);
  border:var(--hair) solid var(--g200);border-radius:var(--r);padding:4px 12px
}
.week-pick input{border:0;background:transparent;font-size:12.5px;width:120px;padding:2px 0}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* dirty / saved badge */
.savebadge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;
  padding:4px 11px;border-radius:var(--r-pill);border:1px solid transparent;white-space:nowrap
}
.savebadge.clean{background:#ECFDF3;color:#027A48;border-color:#ABEFC6}
.savebadge.dirty{background:#FEF3F2;color:#B42318;border-color:#FECDCA}
.savebadge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- tabs ----------------------------------------------------------- */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:7px;padding:9px 14px;white-space:nowrap;
  border:0;background:transparent;color:var(--g600);cursor:pointer;
  border-bottom:2.5px solid transparent;font-size:13.5px;font-weight:500
}
.tab:hover{color:var(--g900);background:var(--g50)}
.tab[aria-selected="true"]{color:var(--green-dark);border-bottom-color:var(--green);font-weight:600}
.tab .count{
  background:var(--g100);color:var(--g500);border-radius:var(--r-pill);
  padding:0 7px;font-size:11px;font-weight:600;min-width:20px;text-align:center
}
.tab[aria-selected="true"] .count{background:var(--green-light);color:var(--green-dark)}

/* ---------- buttons -------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 15px;border-radius:var(--r);border:var(--hair) solid var(--g200);
  background:var(--surface);color:var(--g900);cursor:pointer;font-size:13.5px;
  font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s
}
.btn:hover{background:var(--g50);border-color:var(--g300)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:#05B34C;border-color:#05B34C}
.btn-dark{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.btn-dark:hover{background:#333333;border-color:#333333}
.btn-danger{color:var(--red);border-color:#FECDCA}
.btn-danger:hover{background:#FEF3F2;border-color:var(--red)}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn-xs{padding:3px 9px;font-size:12px;border-radius:var(--r-sm)}
.btn-icon{padding:6px;border-radius:var(--r-sm);width:30px;height:30px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--g100);border-color:transparent}
.btn-group{display:inline-flex;gap:6px;flex-wrap:wrap}

/* ---------- forms ---------------------------------------------------------- */
label{font-size:12.5px;font-weight:600;color:var(--g600);display:block;margin-bottom:3px}
.inp,select.inp,textarea.inp{
  width:100%;padding:7px 11px;border:var(--hair) solid var(--g200);border-radius:var(--r);
  background:var(--surface);font-size:13.5px;line-height:1.6;font-family:inherit
}
.inp:focus{outline:2px solid var(--green-light);outline-offset:0;border-color:var(--green)}
textarea.inp{resize:vertical;min-height:64px}
.inp.err{border-color:var(--red);background:#FFFBFA}
.field{margin-bottom:11px}
.field-row{display:flex;gap:11px;flex-wrap:wrap}
.field-row>.field{flex:1 1 160px;margin-bottom:11px}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px}
.hint.warn{color:var(--amber)}
.hint.ok{color:var(--green)}
.hint.bad{color:var(--red)}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--g700)}
.check input{width:16px;height:16px;accent-color:var(--green);cursor:pointer;margin:0}

/* ---------- cards ---------------------------------------------------------- */
.card{
  background:var(--surface);border:var(--hair) solid var(--g200);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm)
}
.card-pad{padding:14px 16px}
.sect{margin-bottom:22px}
.sect-hd{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.sect-hd h2{font-size:16px;display:flex;align-items:center;gap:8px}
.sect-hd .sub{font-size:12.5px;color:var(--g500)}
.empty{
  padding:26px;text-align:center;color:var(--g400);font-size:13px;
  border:1.5px dashed var(--g300);border-radius:var(--r-lg);background:var(--g50)
}

/* ---------- badges & chips ------------------------------------------------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.7
}
.badge-soft{background:var(--g100);color:var(--g600)}
.badge-stage{color:#fff}
.badge-outline{border:1px solid currentColor;background:transparent}
/* ชิป = ป้ายอ้างถึงของ (ลูกค้า/ดีล/คน) มุม 6px แบบ ServiceFlow
   ต่างจาก .badge ที่เป็นป้ายสถานะ ซึ่งยังเป็นแคปซูลอยู่เหมือนต้นทาง */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;
  border-radius:var(--r-sm);background:var(--g100);font-size:12px;
  color:var(--g700);white-space:nowrap
}
.avatar{
  width:20px;height:20px;border-radius:50%;flex:none;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;line-height:1;letter-spacing:-.02em
}
.avatar-lg{width:30px;height:30px;font-size:12px}
.chip-unknown{background:#FFFAEB;color:#B54708;border:1px dashed #FEDF89;padding-left:8px}
.chip-btn{border:0;cursor:pointer;font:inherit}
.chip-btn:hover{background:var(--g200)}
.chip-btn[aria-pressed="true"]{background:var(--green);color:#fff}
/* ชื่อลูกค้า/รพ. — ต้องเด่นกว่าป้ายเทาอื่นในแถวเดียวกัน ไม่งั้นกลืนหายไปกับวันที่และสถานะ */
.chip-cust{background:var(--green-light);color:var(--green-dark);font-weight:600;box-shadow:inset 0 0 0 1px #C6EFD6}
.chip-cust.chip-btn:hover{background:#DDF5E7}

/* ---------- stat tiles ----------------------------------------------------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{
  background:var(--surface);border:1px solid var(--g200);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--sh-sm)
}
.tile .t-lab{font-size:12px;color:var(--g500);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.tile .t-val{font-size:22px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.tile .t-sub{font-size:11.5px;color:var(--g400);margin-top:2px}

/* ---------- job card ------------------------------------------------------- */
.job{
  background:var(--surface);border:1px solid var(--g300);
  border-radius:var(--r);padding:11px 13px;box-shadow:var(--sh-sm)
}
.job.hidden-present{opacity:.45}
.job.stuck{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.job-hd{display:flex;align-items:flex-start;gap:8px}
.job-name{font-weight:600;font-size:14px;line-height:1.45;flex:1 1 auto;min-width:0}
.job-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.job-note{
  margin-top:7px;font-size:12.5px;color:var(--g600);background:var(--g50);
  border-radius:var(--r-sm);padding:6px 9px
}
.job-acts{display:flex;gap:2px;flex:none}
.val{font-weight:700;font-variant-numeric:tabular-nums}
.val-pending{color:var(--g400);font-weight:500;font-style:italic}

/* intel — ต้องดูต่างจากทุกอย่างชัด ๆ เพื่อให้คนกรอกรู้ตัวว่าอันนี้ไม่ขึ้นจอ */
.intel{
  margin-top:8px;background:#FFFAEB;border:1px solid #FEDF89;border-radius:var(--r-sm);
  padding:8px 10px;font-size:12.5px;color:#7A2E0E
}
.intel-hd{
  font-size:11px;font-weight:700;color:#B54708;display:flex;align-items:center;gap:5px;
  margin-bottom:3px;text-transform:none
}

/* ---------- การ์ดงาน: ยุบ/คลี่ ---------------------------------------------- */
.job-hd{cursor:pointer}
.job-fold{color:var(--g400);flex:none;margin-top:3px;transition:transform .15s}
.job.open .job-fold{transform:rotate(0deg)}
.job:not(.open) .job-fold{transform:rotate(-90deg)}
.job:not(.open) .job-body{display:none}
.peek{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.peek .badge{background:var(--g100);color:var(--g500);font-weight:500}

/* ---------- kanban: เลื่อนได้จากในพื้นที่จอ --------------------------------- */
.board-wrap{position:relative}
.board{
  display:flex;gap:12px;align-items:flex-start;
  /* ให้บอร์ดเป็นพื้นที่เลื่อนของตัวเอง แถบเลื่อนแนวนอนจะได้อยู่ก้นจอ ไม่ใช่ก้นหน้า */
  overflow:auto;
  max-height:calc(100vh - 250px);
  padding:2px 2px 12px;
  scrollbar-width:thin;
  cursor:grab;
  overscroll-behavior-x:contain;
}
.board.panning{cursor:grabbing;user-select:none}
.board::-webkit-scrollbar{height:11px;width:11px}
.board::-webkit-scrollbar-thumb{background:var(--g300);border-radius:var(--r-pill)}
.board::-webkit-scrollbar-thumb:hover{background:var(--g400)}
.board::-webkit-scrollbar-track{background:transparent}
.bcol-hd{
  display:flex;align-items:center;gap:7px;padding:2px 2px 9px;margin:0;
  /* ค้างหัวคอลัมน์ไว้ตอนเลื่อนในบอร์ด จะได้รู้ตลอดว่ากำลังดูขั้นไหน */
  position:sticky;top:0;z-index:2;background:var(--g50)
}
.board-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:6;
  width:34px;height:52px;border-radius:var(--r);border:1px solid var(--g200);
  background:rgba(255,255,255,.94);box-shadow:var(--sh-float);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--g600)
}
.board-nav:hover{background:#fff;color:var(--blue)}
.board-nav.prev{left:-10px}
.board-nav.next{right:-10px}
.board-hint{font-size:11.5px;color:var(--g400);margin:6px 2px 0}
@media (max-width:720px){ .board-nav{display:none} .board{max-height:none} }

.bcol{flex:0 0 288px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-lg);padding:10px}
.bcol-dot{width:9px;height:9px;border-radius:50%;flex:none}
.bcol-name{font-weight:700;font-size:12.5px;flex:1 1 auto;min-width:0}
.bcol-sum{font-size:11px;color:var(--g500);padding:0 2px 8px;font-variant-numeric:tabular-nums}
.bcol .stack{gap:8px}

/* ---------- tables --------------------------------------------------------- */
.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--g500);
  padding:8px 10px;border-bottom:1px solid var(--g200);white-space:nowrap
}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--g100);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--g50)}

/* ---------- progress / funnel ---------------------------------------------- */
.funnel{display:flex;flex-direction:column;gap:7px}
.fn-row{display:flex;align-items:center;gap:10px}
.fn-lab{flex:0 0 210px;font-size:12.5px;display:flex;align-items:center;gap:7px;min-width:0}
.fn-bar{flex:1 1 auto;height:22px;background:var(--g100);border-radius:var(--r-sm);overflow:hidden}
.fn-fill{height:100%;border-radius:var(--r-sm);min-width:2px}
.fn-num{flex:0 0 150px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}

/* ---------- plan columns --------------------------------------------------- */
.plan-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.plan-col{background:var(--surface);border:1px solid var(--g200);border-radius:var(--r-lg);padding:13px}
.plan-col-hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.plan-col-hd h3{font-size:14px}
.plan-col-sub{font-size:11.5px;color:var(--g500);margin-bottom:10px}
/* align-items ต้องเป็น flex-start ไม่ใช่ค่าเริ่มต้น stretch -- ไม่งั้นพอชื่องาน
   ยาว 2-3 บรรทัด ช่องติ๊กจะถูกจัดกลางแถว ไม่ตรงกับบรรทัดชื่อ */
.plan-item{
  display:flex;flex-wrap:wrap;align-items:flex-start;gap:9px;
  padding:11px 0;border-bottom:1px solid var(--g200)
}
/* margin-top ของช่องติ๊กตั้งไว้ที่ตัว label ในโค้ด (2px) -- คำนวณจาก
   (line-height ของ .plan-act 20px - ขนาดช่องติ๊ก 16px) / 2 */
.plan-item > .check{align-self:flex-start;flex:0 0 auto}
.plan-item > .job-acts{align-self:flex-start}
.plan-item:last-of-type{border-bottom:0}
.plan-item.done .plan-act{text-decoration:line-through;color:var(--g400)}
.plan-act{font-size:13px;line-height:1.55}
.plan-col-ft{border-top:1px solid var(--g200);margin-top:8px;padding-top:8px;font-size:12px;color:var(--g500)}

/* ไทม์ไลน์รายสัปดาห์: [ค้าง] [สัปดาห์ ×4] [ถัดไป] — จอแคบเลื่อนในกรอบ ไม่ให้ทั้งหน้าล้น */
.plan-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.plan-nav .plan-range{font-size:13px;font-weight:600}
.plan-tl{
  display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;
  overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px
}
.plan-tl .plan-col{padding:11px;min-width:0;scroll-snap-align:start;transition:background .12s}
.plan-tl .plan-col-hd h3{font-size:13.5px}
.plan-tl .plan-item{gap:7px;padding:9px 0}
.plan-tl .plan-act{font-size:12.5px;line-height:1.5}
.plan-tl .plan-dates{white-space:normal}
.plan-col.is-now{border-color:var(--green);box-shadow:inset 0 3px 0 var(--green)}
.plan-col.is-over{background:#FFFBFA;border-color:#FDA29B}
.plan-col.is-over .plan-col-hd h3{color:#B42318}
.plan-col.drop-on{background:var(--green-light);border-style:dashed;border-color:var(--green)}
.plan-item[draggable="true"]{cursor:grab}
.plan-item.dragging{opacity:.45}
.plan-sub-hd{font-size:11.5px;font-weight:600;color:var(--g500);margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--g200)}

/* ---------- discussions ---------------------------------------------------- */
.disc{border:1px solid var(--g200);border-radius:var(--r-lg);padding:13px 15px;background:var(--surface)}
.disc.decided{background:var(--g50);border-style:dashed}
.disc-topic{font-weight:600;font-size:14.5px;line-height:1.5;margin:6px 0 4px}
.disc-ctx{font-size:13px;color:var(--g600)}
.disc-opts{
  font-size:12.5px;color:var(--g600);background:var(--g50);border-radius:var(--r-sm);
  padding:7px 10px;margin-top:8px
}
.disc-min{border-top:1px dashed var(--g300);margin-top:11px;padding-top:11px}

/* ---------- import wizard -------------------------------------------------- */
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:var(--r-pill);background:var(--g100);color:var(--g500);font-size:13px}
.step.on{background:var(--blue);color:#fff;font-weight:600}
.step.ok{background:#ECFDF3;color:#027A48}
.step .n{width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.09);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.step.on .n{background:rgba(255,255,255,.25)}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:11px}
.map-row{display:flex;align-items:center;gap:10px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--r);padding:8px 11px}
.map-row.req{border-color:var(--blue)}
.map-row .mlab{flex:0 0 132px;font-size:12.5px;font-weight:600;color:var(--g700)}
.map-row select{flex:1 1 auto;min-width:0}
.raw-preview{overflow-x:auto;border:1px solid var(--g200);border-radius:var(--r);background:var(--surface)}
.raw-preview table{border-collapse:collapse;font-size:11.5px;white-space:nowrap}
.raw-preview td,.raw-preview th{padding:4px 8px;border:1px solid var(--g100);max-width:210px;overflow:hidden;text-overflow:ellipsis}
.raw-preview tr.is-header{background:var(--blue-light);font-weight:600}
.raw-preview tr.is-header td{border-color:#C7DAFB}
.raw-preview .rn{background:var(--g50);color:var(--g400);position:sticky;left:0}
.diff{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.diff b{font-variant-numeric:tabular-nums}

/* ---------- modal & toast -------------------------------------------------- */
#modal-layer:not(:empty){
  position:fixed;inset:0;z-index:200;background:rgba(16,24,40,.55);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto
}
.modal{
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-float);
  max-width:640px;width:100%;padding:22px 24px;margin:auto
}
.modal h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.modal-ft{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#toast-layer{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{
  background:var(--blue-dark);color:#fff;padding:11px 16px;border-radius:var(--r);
  box-shadow:var(--sh-float);font-size:13.5px;max-width:400px;
  display:flex;align-items:center;gap:9px;animation:tin .2s ease-out
}
.toast.ok{background:#05603A} .toast.bad{background:#B42318} .toast.warn{background:#B54708}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- banners -------------------------------------------------------- */
.banner{
  display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px
}
.banner-warn{background:#FFFAEB;border:1px solid #FEDF89;color:#93370D}
.banner-bad{background:#FEF3F2;border:1px solid #FECDCA;color:#912018}
.banner-info{background:var(--blue-light);border:1px solid #C7DAFB;color:#111111}

/* ---------- รายงานประจำสัปดาห์: แถบสรุป + 2 ช่วง --------------------------- */
.summary-strip{
  display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--g600);
  font-variant-numeric:tabular-nums
}
.summary-strip b{color:var(--g900);font-size:15px;margin-right:3px}
.summary-strip .warn b{color:var(--amber)}
.summary-strip .bad b{color:var(--red)}
.strip-sep{width:1px;align-self:stretch;background:var(--g200);margin:0 2px}
.band{margin-bottom:26px}
.band-hd{
  display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:11px 15px;
  background:linear-gradient(90deg,var(--blue-light),transparent);
  border:1px solid var(--blue);border-radius:var(--r)
}
.band-hd h2{font-size:16px;color:var(--blue-dark)}
.band-n{
  width:28px;height:28px;flex:none;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px
}
.sub-h{
  font-size:13.5px;color:var(--g600);display:flex;align-items:center;gap:7px;
  margin:0 0 9px;font-weight:600
}
.dl-row{
  padding:8px 11px;border-radius:var(--r-sm);background:var(--g50);
  border:1px solid var(--g300)
}
.dl-row.warn{background:#FFFAEB;border-color:var(--amber);color:#93370D}
/* ช่วงวันคือข้อมูลที่ต้องกวาดตาอ่านรวดเดียว จึงให้ครองบรรทัดของตัวเองเต็มความกว้างการ์ด
   แล้วบังคับไม่ตัดบรรทัด ถ้าหน้าต่างแคบจนคอลัมน์บีบจนไม่พอจริง ๆ ค่อยกลับไปตัดคำ
   เหมือนเดิม ดีกว่าปล่อยให้ข้อความล้นออกนอกการ์ดแล้วโดนตัดหาย */
.plan-dates-row{flex:1 0 100%;min-width:0}
.plan-dates{display:flex;gap:5px;flex-wrap:nowrap;align-items:center;white-space:nowrap;width:100%}
@media (max-width:820px){
  .plan-dates{align-items:flex-start;white-space:normal}
}

/* ---------- drawer (แผงเลื่อนจากขวา) --------------------------------------- */
#drawer-layer:not(:empty){position:fixed;inset:0;z-index:180}
.drawer-back{position:absolute;inset:0;background:rgba(16,24,40,.45)}
.drawer{
  position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);
  background:var(--surface);box-shadow:var(--sh-float);display:flex;flex-direction:column;
  animation:drawerIn .18s ease-out
}
@keyframes drawerIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
/* ฟอร์มงานมีช่องเยอะและหลายช่องวางคู่กัน ต้องกว้างกว่าฟอร์มแผนงาน */
.drawer.wide{width:min(780px,100%)}
.drawer-hd{
  display:flex;align-items:center;gap:10px;padding:15px 18px;
  border-bottom:1px solid var(--g200)
}
.drawer-hd h3{font-size:16px;flex:1 1 auto;min-width:0}
.drawer-bd{flex:1 1 auto;overflow-y:auto;padding:16px 18px}
.drawer-ft{
  display:flex;gap:9px;align-items:center;padding:13px 18px;
  border-top:1px solid var(--g200);background:var(--g50)
}
.seg{display:flex;gap:0;border:1px solid var(--g300);border-radius:var(--r-sm);overflow:hidden}
.seg button{
  flex:1 1 0;border:0;background:var(--surface);padding:9px 8px;cursor:pointer;
  font:inherit;font-size:13px;color:var(--g600);border-right:1px solid var(--g200)
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600}
.quick-dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ---------- filters (ยุบได้) ------------------------------------------------ */
.filters-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.filters-panel{
  border-top:1px solid var(--g200);margin-top:11px;padding-top:11px;
  display:flex;flex-direction:column;gap:7px
}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-row>.flab{min-width:78px;font-size:11.5px;color:var(--g500)}
/* ตัวเลื่อนช่วงเวลา — ต่อท้าย select โหมด ในแถวตัวกรองบรรทัดเดียวกัน */
.range-step{display:inline-flex;align-items:center;gap:3px}
.range-step b{font-size:12.5px;font-weight:600;min-width:118px;text-align:center;white-space:nowrap}
.range-step .btn-icon{width:26px;height:26px;padding:4px}

/* เมนูตัวกรองแบบติ๊กหลายค่า — ปุ่มเดียวแทนแถวชิปทั้งแถว จึงยัดลงบรรทัดเดียวได้
   ปุ่มโชว์ค่าที่เลือกอยู่เสมอ เพื่อไม่ต้องกางเมนูถึงจะรู้ว่ากรองอะไรค้างไว้ */
.dd{position:relative;display:inline-flex}
.dd>.btn{gap:5px;font-weight:500}
.dd>.btn>b{font-weight:600}
.dd>.btn>b.on{color:var(--green-dark)}
.dd-panel{
  position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:186px;
  background:var(--surface);border:var(--hair) solid var(--g200);border-radius:var(--r);
  box-shadow:var(--sh-float);padding:6px;display:flex;flex-direction:column;gap:1px;
  /* หมวดโซนมีหลายสิบค่า ต้องเลื่อนได้ ไม่งั้นแผงยาวทะลุจอ */
  max-height:min(340px,60vh);overflow-y:auto
}
.dd-item{padding:5px 8px;border-radius:var(--r-sm);font-weight:500;white-space:nowrap}
.dd-item:hover{background:var(--g50)}
.dd-clear{margin-top:4px;justify-content:flex-start;border-top:var(--hair) solid var(--g200);border-radius:0;padding-top:7px}
.active-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip-x{
  border:0;background:transparent;color:inherit;cursor:pointer;padding:0 0 0 3px;
  font:inherit;opacity:.65;display:inline-flex
}
.chip-x:hover{opacity:1}

/* ---------- หัวข้อ/ช่วง ที่ยุบได้ ------------------------------------------- */
.sect-hd.can-fold, .band-hd.can-fold{cursor:pointer;user-select:none}
.sect-hd.can-fold:hover h2, .band-hd.can-fold:hover h2{color:var(--blue)}
.fold-ic{color:var(--g400);flex:none;transition:transform .15s}
.sect.folded .sect-body, .band.folded .band-body{display:none}
.sect.folded .fold-ic, .band.folded .fold-ic{transform:rotate(-90deg)}
.fold-count{
  font-size:11.5px;color:var(--g500);background:var(--g100);
  border-radius:var(--r-pill);padding:1px 9px;white-space:nowrap
}

/* ---------- related jobs picker -------------------------------------------- */
.rel-pick{
  display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto;
  padding:8px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-sm)
}
.rel-pick .chip-btn{padding-left:7px}

/* ---------- trial ---------------------------------------------------------- */
.trial{
  display:flex;align-items:center;gap:7px;margin-top:7px;padding:6px 9px;
  border-radius:var(--r-sm);background:#F5F3FF;color:#5B21B6;font-size:12.5px
}
.trial.warn{background:#FFFAEB;color:#93370D}
.trial.bad{background:#FEF3F2;color:#912018}
.trial.paid{background:#ECFDF3;color:#027A48}
/* ใช้เทาชุดเดียวกับกล่อง Hold เพื่อให้ "งานที่ไม่เดิน" อ่านเป็นภาษาภาพเดียวกัน */
.trial.park{background:#F5F5F5;color:#333333}
.trial-bar{flex:1 1 60px;height:5px;border-radius:var(--r-pill);background:rgba(0,0,0,.10);overflow:hidden;min-width:40px}
.trial-bar i{display:block;height:100%;background:currentColor;border-radius:var(--r-pill)}

/* ---------- PIN gate ------------------------------------------------------- */
/* ประตูเบา ๆ กันคนเปิดผ่าน ๆ เท่านั้น ไม่ใช่ระบบความปลอดภัยจริง —
   PIN อยู่ในซอร์สของไฟล์ ใครเปิด view-source ก็เห็น (เหมือน index.html ของแอปหลัก) */
/* หน้าล็อกอินล้อ serviceflow.andamandev.com/login — พื้นเทาอ่อน การ์ดขาว
   แถบไล่สีเขียว→น้ำเงินคาดหัวการ์ด ชิดซ้าย ไม่ใช่กึ่งกลาง และไม่มีเอฟเฟกต์เบลอ */
#pin-gate{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:var(--g50);color:var(--g900);padding:20px;overflow:auto
}
#pin-gate .orb{display:none}          /* ลูกบอลเบลอของธีมเดิม — ระบบใหม่ไม่ใช้ */
.pin-card{
  position:relative;width:100%;max-width:420px;text-align:left;
  background:var(--surface);border:var(--hair) solid var(--g200);
  border-radius:var(--r-lg);padding:34px 36px 30px;overflow:hidden
}
.pin-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--green) 0%,var(--green) 55%,var(--blue) 55%,var(--blue) 100%)
}
.pin-card .mark{
  height:34px;margin:0 0 18px;display:flex;align-items:center;
  justify-content:flex-start;overflow:hidden;color:var(--g900)
}
.pin-card .mark svg,.pin-card .mark img{height:100%;width:auto;max-width:210px;object-fit:contain}
.pin-card h1{font-size:25px;font-weight:700;margin-bottom:4px;line-height:1.35}
.pin-card p{font-size:13.5px;color:var(--g500);margin-bottom:22px}
.pin-card label{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:7px}
.pin-card label i{color:var(--red);font-style:normal}
#pin-input{
  width:100%;font-size:22px;letter-spacing:.42em;text-indent:.42em;
  padding:12px 14px;border-radius:var(--r);border:var(--hair) solid var(--g200);
  background:var(--surface);color:var(--g900);font-family:inherit;
  font-variant-numeric:tabular-nums
}
#pin-input:focus{outline:2px solid var(--green-light);outline-offset:0;border-color:var(--green)}
#pin-msg{min-height:20px;font-size:12.5px;margin-top:9px;color:var(--red)}
.pin-card .btn{
  width:100%;margin-top:6px;justify-content:center;padding:12px 24px;font-size:15px
}
.pin-note{
  margin:22px 0 0;padding-top:18px;border-top:var(--hair) solid var(--g200);
  font-size:12.5px;color:var(--g500);line-height:1.75
}
.pin-shake{animation:pinshake .32s}
@keyframes pinshake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- print — พิมพ์แท็บ "สรุปประจำสัปดาห์" ออกเป็นรายงาน/PDF ---------
   ไม่มีโหมดนำเสนอแยกแล้ว หน้าสรุปคือรายงาน จึงต้องพิมพ์ออกมาให้อ่านรู้เรื่อง
   ข้อมูลวงในถูกซ่อนตอนพิมพ์เสมอ — เอกสารที่พิมพ์แจกมีโอกาสหลุดถึงคนนอกทีม */
@media print{
  @page{size:A4 portrait;margin:12mm}
  #app-header, #toast-layer, #modal-layer, .no-print,
  .job-acts, .job-edit, .btn, .tabs, .week-pick,
  .intel, .filters-panel, .filters-bar{display:none !important}
  body{background:#fff;font-size:11.5px;line-height:1.6}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .print-only{display:block !important}
  .sect{margin-bottom:14px;break-inside:auto}
  .sect-hd h2{font-size:15px}
  .card, .job, .plan-col, .disc, .tile{
    break-inside:avoid;page-break-inside:avoid;box-shadow:none;border-color:#DFDFDF
  }
  .band{break-before:auto}
  .band + .band{break-before:page;page-break-before:always}
  .sect.folded .sect-body, .band.folded .band-body{display:block !important}
  .job:not(.open) .job-body{display:block !important}
  .job-fold, .peek{display:none !important}
  .fold-ic, .fold-count{display:none !important}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .p-grid{grid-template-columns:repeat(2,1fr)}
  .plan-tl{grid-template-columns:repeat(6,1fr);overflow:visible;gap:6px}
  .plan-tl .plan-col{padding:7px}
  a{text-decoration:none;color:inherit}
}
.print-only{display:none}

/* ---------- responsive ----------------------------------------------------- */
@media (max-width:720px){
  .wrap{padding:0 12px}
  .hdr-top{gap:9px}
  .brand-sub,.week-pick{display:none}
  .fn-lab{flex-basis:120px}
  .fn-num{flex-basis:96px}
}
</style>

<script>
/* ============================================================================
   BLOCK 01 — CONST
   ขั้นการขาย S0–S10 (11 ขั้น) — ปรับจากชุด S0–S9 เดิมของ js/modules/pipeline.js

   ทุกบล็อกเป็น classic script + IIFE ผูกกับ global เดียว: window.SP

     เปลี่ยนมาแล้วหนึ่งรอบ และจะเปลี่ยนได้อีก โค้ดที่เทียบ 'S8_WON' ตรง ๆ
     จะพังเงียบ ๆ ทุกครั้งที่เลขขยับ */

    { id:'S0', name:'Target Identified',      nameTH:'ระบุเป้าหมาย (Lead ยังไม่ได้ติดต่อ)',   probability:0   },
    { id:'S1', name:'Requirement',            nameTH:'สำรวจความต้องการ',                    probability:10  },
    { id:'S2', name:'Trial Requested',        nameTH:'รอสาธิตระบบให้ลูกค้าดู (Trial)',        probability:15, trial:'waiting' },
    { id:'S3', name:'Trial Running',          nameTH:'สาธิตระบบให้ลูกค้าดู (Trial)',          probability:20, trial:'running' },
    { id:'S4', name:'TOR Drafting/Proposal',  nameTH:'ร่าง TOR / ใบเสนอราคา',                probability:35  },
    { id:'S5', name:'Quotation Consideration',nameTH:'พิจารณาใบเสนอราคา',                    probability:50  },
    /* รวมขั้นเดิม S6 (รอกระบวนการจัดซื้อ 70%) กับ S7 (กำลัง e-bidding 85%) เข้าด้วยกัน

    { id:'S6', name:'Procurement',            nameTH:'อยู่ในกระบวนการจัดซื้อ / e-bidding',    probability:80  },
    { id:'S7', name:'In Delivery',            nameTH:'โครงการที่กำลังดำเนินงาน',              probability:100, isWon:true },
    /* ส่งมอบแล้ว = จบงานฝั่งเรา แต่ยังไม่จบเรื่องเงิน จึงเก็บวันที่ส่งมอบและสถานะชำระเงินต่อ

    { id:'S9', name:'Closed Lost',            nameTH:'ไม่สำเร็จ / สูญเสียโครงการ',            probability:0,   isLost:true },
    /* ไม่ได้ทำต่อ / รอไม่มีกำหนด -- ยังไม่แพ้ จึงไม่ตั้ง isLost (ไม่ควรไปรวมกับสถิติงานที่เสีย)

<script>
/* ============================================================================

var SP = window.SP || (window.SP = {});

SP.U = (function () {
  'use strict';
  var C = SP.C;

  /* --- escape ทุกค่าที่ interpolate เข้า innerHTML — ห้ามลืมแม้แต่ที่เดียว ---
     pipeline.js ของแอปหลักยัด opp.remark เข้า innerHTML ตรง ๆ ที่นี่จะไม่ทำแบบนั้น */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
    });
  }
  function attr(s) { return esc(s); }

  /* --- ไอคอน: อ้าง <symbol> ใน sprite เดียวกัน ไม่มีไฟล์ภายนอก (file:// fetch ไม่ได้) */
  function ic(name, cls) {
    return '<svg class="ic ' + (cls || '') + '" aria-hidden="true"><use href="#ic-' + name + '"/></svg>';
  }

  // ---- Thai dates (js/utils.js:5-41) — พ.ศ. = ค.ศ. + 543 ------------------
  var TH_MON  = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var TH_MONF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  function toDate(v) {
    if (!v) return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtDate(v, mode) {
    var d = toDate(v); if (!d) return '—';
    var be = d.getFullYear() + 543;
    if (mode === 'full')  return d.getDate() + ' ' + TH_MONF[d.getMonth()] + ' ' + be;
    if (mode === 'short') return d.getDate() + '/' + (d.getMonth() + 1) + '/' + be;
    if (mode === 'datetime') {
      return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + be + ' ' +
             pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + be;
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  /* ---- Thai BE date parser — ด้านกลับของ fmtDate() ด้านบน ------------------
     ข้อมูลจริงในชีต Contact Log เป็น "ข้อความ พ.ศ. ปนประโยค" ไม่ใช่วันที่:

       '21 ก.ย. 69 08:00 น. ส่ง email / พุธ 23 ก.ย. 69 ช่วงสาย โทรติดตาม'
     จึงต้องคืน rest (ส่วนที่ไม่ใช่วัน/เวลา) กลับไปด้วย ทิ้งไม่ได้ — ข้อความนั้น
     คือ "งานที่ต้องทำ" ซึ่งเป็นสาระของช่องนั้นจริง ๆ

     อยู่ใน SP.U ไม่ใช่ SP.Norm เพราะช่องกรอกมือใน drawer ก็เรียกใช้ ไม่ใช่แค่
     ตอน import — SP.Norm นิยามตัวเองว่า "ตัวแปลงค่าจากสเปรดชีต" เท่านั้น */
  var THAI_DIGITS = '๐๑๒๓๔๕๖๗๘๙';
  function arabic(s) {
    return String(s == null ? '' : s)
      .replace(/[๐-๙]/g, function (d) { return String(THAI_DIGITS.indexOf(d)); });
  }

  /* ชุดคำเดือนสำหรับ regex: ชื่อเต็มมาก่อนตัวย่อเสมอ และตัวย่อยอมให้ไม่มีจุด
     ('ก.ย.' -> 'ก\.?ย\.?' จึงรับทั้ง ก.ย. / ก.ย / กย. / กย) */
  var MON_ALT = (function () {
    var parts = [];
    for (var i = 0; i < 12; i++) {
      parts.push(TH_MONF[i]);
      parts.push(TH_MON[i].replace(/\./g, '\\.?'));
    }
    return parts.join('|');
  })();
  function monIndex(word) {
    var w = String(word || '').replace(/[.\s]/g, '');
    for (var i = 0; i < 12; i++) {
      if (TH_MON[i].replace(/[.\s]/g, '') === w) return i;
      if (TH_MONF[i] === w) return i;
    }
    return -1;
  }

  /* ปีคือกฎที่เสี่ยงที่สุดในไฟล์นี้ — '69' อาจเป็น พ.ศ.2569, ค.ศ.2069 หรือ 1969
     จึงสร้าง candidate ทั้งสี่แล้วเลือกตัวที่ใกล้ "ปีอ้างอิง" ที่สุด
     '69' + ref 2026 -> 2569-543 = 2026 (Δ0) ชนะ 2069 (Δ43) และ 1969 (Δ57)
     '26' + ref 2026 -> 2026 (Δ0) ชนะ 1983  ... กลไกเดียวรองรับทั้ง พ.ศ./ค.ศ. 2 หลัก */
  function pickYear(yRaw, refYear) {
    if (yRaw == null || yRaw === '') return { year:null, hasYear:false };
    var n = Number(yRaw);
    if (!isFinite(n)) return { year:null, hasYear:false };
    if (String(yRaw).length >= 4) return { year: n >= 2400 ? n - 543 : n, hasYear:true };
    var cands = [2500 + n - 543, 2600 + n - 543, 2000 + n, 1900 + n], best = cands[0];
    for (var i = 1; i < cands.length; i++) {
      if (Math.abs(cands[i] - refYear) < Math.abs(best - refYear)) best = cands[i];
    }
    return { year:best, hasYear:true };
  }

  var TIME_RE = /(\d{1,2})[:.](\d{2})\s*(?:น\.?)?|(\d{1,2})\s*นาฬิกา|(\d{1,2})\s*น\./;

  /* คืนทุกวันที่ในข้อความ เรียงตามตำแหน่ง — ช่อง 'กำหนดติดตาม' มีสองนัดจริง ๆ */
  function parseTHAll(raw, refIso) {
    if (raw instanceof Date) {
      return isNaN(raw.getTime()) ? [] : [{ iso:isoDate(raw), time:null, hasYear:true, rel:false, rest:'', raw:String(raw) }];
    }
    if (typeof raw === 'number' && raw >= 20000 && raw <= 60000) {
      // Excel serial (เส้นทาง CSV ไม่ได้ cellDates จึงมาเป็นตัวเลขดิบ)
      var ed = new Date(Date.UTC(1899, 11, 30) + raw * 864e5);
      return [{ iso:isoDate(new Date(ed.getUTCFullYear(), ed.getUTCMonth(), ed.getUTCDate())),
                time:null, hasYear:true, rel:false, rest:'', raw:String(raw) }];
    }
    var s = arabic(raw).trim();
    if (!s || s === '-' || s === '—' || /^n\/?a$/i.test(s)) return [];

    var refD = toDate((refIso || '') + 'T00:00:00') || new Date();
    var refYear = refD.getFullYear();
    var hits = [], spans = [], m;

    // 1) ISO yyyy-mm-dd ตรง ๆ
    var isoRe = /(\d{4})-(\d{2})-(\d{2})/g;
    while ((m = isoRe.exec(s))) {
      hits.push({ at:m.index, len:m[0].length, y:+m[1], mo:+m[2] - 1, d:+m[3], hasYear:true });
    }
    // 2) วันที่แบบไทย: 14 ก.ย. 69
    if (!hits.length) {
      var thRe = new RegExp('(\\d{1,2})\\s*(' + MON_ALT + ')\\s*(\\d{2,4})?', 'g');
      while ((m = thRe.exec(s))) {
        var mi = monIndex(m[2]); if (mi < 0) continue;
        var py = pickYear(m[3], refYear);
        hits.push({ at:m.index, len:m[0].length, y:py.year, mo:mi, d:+m[1], hasYear:py.hasYear });
      }
    }
    // 3) ตัวเลขล้วน 14/9/69
    if (!hits.length) {
      var nRe = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g;
      while ((m = nRe.exec(s))) {
        var py2 = pickYear(m[3], refYear);
        hits.push({ at:m.index, len:m[0].length, y:py2.year, mo:+m[2] - 1, d:+m[1], hasYear:py2.hasYear });
      }
    }
    // 4) รูปแบบสัมพัทธ์ — '7 วัน' มีอยู่จริงในช่อง 'กำหนดติดตาม'
    if (!hits.length) {
      var rel = null;
      if ((m = /(\d{1,3})\s*วัน/.exec(s)))      rel = { at:m.index, len:m[0].length, add:+m[1] };
      else if ((m = /พรุ่งนี้/.exec(s)))          rel = { at:m.index, len:m[0].length, add:1 };
      else if ((m = /สัปดาห์หน้า/.exec(s)))       rel = { at:m.index, len:m[0].length, add:7 };
      if (rel) {
        var rd = new Date(refD.getFullYear(), refD.getMonth(), refD.getDate() + rel.add);
        spans.push([rel.at, rel.at + rel.len]);
        return [{ iso:isoDate(rd), time:null, hasYear:false, rel:true,
                  rest:cutSpans(s, spans), raw:s }];
      }
      return [];
    }

    // เวลา: ผูกกับวันแรกเท่านั้น — ช่องที่มีสองนัดระบุเวลาให้นัดแรกเสมอในข้อมูลจริง
    var time = null, tm = TIME_RE.exec(s);
    if (tm) {
      var hh = tm[1] != null ? +tm[1] : (tm[3] != null ? +tm[3] : +tm[4]);
      var mm = tm[2] != null ? +tm[2] : 0;
      if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59) {
        time = pad(hh) + ':' + pad(mm);
        spans.push([tm.index, tm.index + tm[0].length]);
      }
    }
    /* คำบอกเวลากำกวม ('ช่วงสาย' 'ช่วงบ่าย') ตั้งใจไม่แปลงเป็นเวลานาฬิกา —
       การเดาเวลาเท่ากับสร้างนัดหมายในเวลาที่ไม่มีใครตกลงด้วย ปล่อยให้เป็นงานทั้งวัน
       แล้วเก็บข้อความไว้ใน rest ให้คนอ่านเอง */

    hits.forEach(function (h) { spans.push([h.at, h.at + h.len]); });
    var rest = cutSpans(s, spans);

    return hits.map(function (h, i) {
      var y = h.y;
      if (!h.hasYear) {
        // ไม่มีปี -> ใช้ปีอ้างอิง แล้วขยับไปปีหน้าถ้าตกอดีตเกินครึ่งปี
        y = refYear;
        if (new Date(y, h.mo, h.d) < new Date(refYear, refD.getMonth(), refD.getDate() - 180)) y++;
      }
      var dd = new Date(y, h.mo, h.d);
      if (isNaN(dd.getTime())) return null;
      return { iso:isoDate(dd), time: i === 0 ? time : null, hasYear:h.hasYear,
               rel:false, rest:rest, raw:s };
    }).filter(function (x) { return !!x; });
  }

  /* ตัดช่วงที่แมตช์ออกจากข้อความ แล้วเก็บกวาดตัวคั่นที่ค้างอยู่หัว/ท้าย */
  function cutSpans(s, spans) {
    if (!spans.length) return s.trim();
    spans.sort(function (a, b) { return b[0] - a[0]; });
    var out = s;
    spans.forEach(function (sp) { out = out.slice(0, sp[0]) + ' ' + out.slice(sp[1]); });
    return out.replace(/\s+/g, ' ').replace(/^[\s\/,·\-–—()น.]+/, '').replace(/[\s\/,·\-–—(]+$/, '').trim();
  }

  function parseTH(raw, refIso) {
    var all = parseTHAll(raw, refIso);
    return all.length ? all[0] : null;
  }
  function fmtTime(hhmm) {
    if (!hhmm) return '';
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm));
    return m ? pad(+m[1]) + ':' + m[2] + ' น.' : String(hhmm);
  }

  /* ---- โลโก้แบรนด์ --------------------------------------------------------
     ลำดับ: SVG ที่ inline ไว้ -> PNG data URI -> ไอคอน target เดิม
     สาขาสุดท้ายคือ placeholder ที่ตั้งใจ: ตราบใดที่ยังไม่ได้ใส่โลโก้
     แอปหน้าตาเหมือนเดิมทุกประการ ไม่มีรูปแตกและไม่มีช่องว่างโหว่

     logoSvg ถูกเขียนลง HTML ตรง ๆ โดยไม่ escape เพราะ "มันคือ markup ของ SVG"
     ความปลอดภัยจัดการตอนรับไฟล์เข้า (sanitize ครั้งเดียวใน SP.Settings)
     ไม่ใช่ตอนเรนเดอร์ — ถ้า escape ตรงนี้จะได้ข้อความ <svg> โผล่มาแทนรูป */
  function brandMark(cls) {
    var b = (SP.state && SP.state.settings && SP.state.settings.brand) || null;
    if (b && b.logoSvg)     return '<span class="brand-logo ' + (cls || '') + '">' + b.logoSvg + '</span>';
    if (b && b.logoDataUri) return '<img class="brand-logo ' + (cls || '') + '" src="' + attr(b.logoDataUri) + '" alt="' + attr(b.name || '') + '">';
    return ic('target', cls || 'ic-xl');
  }
  /* โลโก้แบบ "คำ" (wordmark) กว้างกว่าสูงมาก — ยัดลงกรอบสี่เหลี่ยม 34x34 แล้วอ่านไม่ออก
     จึงต้องวางเต็มความกว้างแทน และไม่ต้องพิมพ์ชื่อบริษัทซ้ำ เพราะตัวโลโก้คือชื่ออยู่แล้ว
     เกณฑ์ 2:1 มาจากการวัด: ไอคอนสี่เหลี่ยมจัตุรัสอยู่ที่ ~1.0 ส่วนโลโก้คำอยู่ที่ 3-5 */
  function brandIsWide() {
    var b = (SP.state && SP.state.settings && SP.state.settings.brand) || {};
    return Number(b.logoAspect || 0) >= 2;
  }

  function money(n) {
    n = Number(n) || 0;
    try {
      return new Intl.NumberFormat('th-TH', {
        style:'currency', currency:'THB', minimumFractionDigits:0, maximumFractionDigits:0
      }).format(n);
    } catch (e) { return '฿' + n.toLocaleString(); }
  }
  /* ย่อให้อ่านบนสไลด์ได้: 12,000,000 -> 12.0 ล้าน */
  function moneyShort(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + ' ล้าน';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K';
    return String(n);
  }
  /* งานที่ยังไม่รู้ราคา ต้องไม่แสดงเป็น ฿0 เพราะจะทำให้ยอดรวมบนสไลด์เข้าใจผิด */
  function moneyOrPending(n) {
    return (Number(n) || 0) > 0
      ? '<span class="val mono">' + esc(money(n)) + '</span>'
      : '<span class="val-pending">รอประเมินราคา</span>';
  }

  // ---- เลขสัปดาห์ (ปีปฏิทิน แบบ ISO 8601 · สัปดาห์เริ่มวันจันทร์) -----------
  function monday(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  /* เลขสัปดาห์นับตาม "ปีปฏิทิน" แบบ ISO 8601 (เหมือน ISOWEEKNUM ใน Excel)
     - สัปดาห์เริ่มวันจันทร์
     - สัปดาห์เป็นของปีไหน ดูจาก "วันพฤหัสของสัปดาห์นั้น" จึงไม่มีสัปดาห์ไหน
       ถูกนับซ้ำหรือหายไปตอนข้ามปี และทุกวันในสัปดาห์เดียวกันได้ป้ายเดียวกันเสมอ
     หมายเหตุ: ปีงบประมาณยังใช้อยู่ ที่ฟิลด์ budgetYear ของแต่ละงาน — คนละเรื่องกัน */
  function weekAnchor(d) {
    var t = monday(d);
    return new Date(t.getFullYear(), t.getMonth(), t.getDate() + 3);   // วันพฤหัส
  }
  function yearTH(d) { return weekAnchor(d).getFullYear() + 543; }
  function weekNo(d) {
    var a = weekAnchor(d);
    var jan1 = new Date(a.getFullYear(), 0, 1);
    return Math.floor(Math.round((a - jan1) / 86400000) / 7) + 1;
  }

  /* ป้ายหัวเรื่อง: "สัปดาห์ที่ 37 · ปี 2569 · 7–13 ก.ย. 2569" */
  function weekLabel(iso) {
    var d = toDate(iso + 'T00:00:00') || new Date();
    var a = monday(d), b = new Date(a); b.setDate(b.getDate() + 6);
    var be = a.getFullYear() + 543;
    var span = (a.getMonth() === b.getMonth())
      ? a.getDate() + '–' + b.getDate() + ' ' + TH_MON[a.getMonth()] + ' ' + be
      : a.getDate() + ' ' + TH_MON[a.getMonth()] + ' – ' + b.getDate() + ' ' + TH_MON[b.getMonth()] + ' ' + (b.getFullYear() + 543);
    return 'สัปดาห์ที่ ' + weekNo(d) + ' · ปี ' + yearTH(d) + ' · ' + span;
  }
  function isoDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function daysSince(v) {
    var d = toDate(v); if (!d) return null;
    return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
  }
  function nowISO() { return new Date().toISOString(); }
  function uid(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }


  /* ---- Trial: นับวันของขั้น S2 (รอสาธิต) และ S3 (กำลังสาธิต) --------------
     คืนก้อนเดียวให้ทั้งการ์ด ส่วนสรุป และหัวข้อเดดไลน์ใช้ร่วมกัน
     จะได้ไม่ต้องคำนวณซ้ำ 3 ที่แล้วเพี้ยนคนละแบบ
     mode: none | waiting | scheduled | running | overdue | done */
  function dayDiff(a, b) {
    var x = toDate(a), y = toDate(b);
    if (!x || !y) return null;
    var ax = new Date(x.getFullYear(), x.getMonth(), x.getDate());
    var by = new Date(y.getFullYear(), y.getMonth(), y.getDate());
    return Math.round((by - ax) / 86400000);
  }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  function trialInfo(j) {
    var st = SP.C.stage(j.stage);
    var kind = st && st.trial;
    if (!kind) return { mode:'none' };

    if (kind === 'waiting') {
      var waited = j.trialRequestedAt ? dayDiff(j.trialRequestedAt, today()) : null;
      if (j.trialPlannedDate) {
        var inDays = dayDiff(today(), j.trialPlannedDate);
        return { mode:'scheduled', waited:waited, inDays:inDays, date:j.trialPlannedDate,
                 warn: inDays !== null && inDays < 0 };
      }
      return { mode:'waiting', waited:waited, warn: waited !== null && waited > 14 };
    }

    // kind === 'running'
    if (!j.trialStart) return { mode:'running', day:null, total:null, left:null, warn:false };
    var day = dayDiff(j.trialStart, today()) + 1;
    var total = j.trialEnd ? dayDiff(j.trialStart, j.trialEnd) + 1 : null;
    var left = j.trialEnd ? dayDiff(today(), j.trialEnd) : null;
    if (left !== null && left < 0) return { mode:'overdue', day:day, total:total, over:-left, warn:true };
    return { mode:'running', day:day, total:total, left:left, warn: left !== null && left <= 7 };
  }

  /* ข้อความสั้นสำหรับติดบนการ์ด */
  function trialText(j) {
    var t = trialInfo(j);
    if (t.mode === 'none') return '';
    if (t.mode === 'waiting') {
      return (t.waited === null ? 'รอสาธิต' : 'รอสาธิตมาแล้ว ' + t.waited + ' วัน') + ' · ยังไม่กำหนดวันสาธิต';
    }
    if (t.mode === 'scheduled') {
      return 'นัดสาธิต ' + fmtDate(t.date) +
             (t.inDays === null ? '' : (t.inDays >= 0 ? ' (อีก ' + t.inDays + ' วัน)' : ' (เลยมา ' + (-t.inDays) + ' วัน)'));
    }
    if (t.mode === 'overdue') return 'Trial ครบกำหนดแล้ว ' + t.over + ' วัน — ต้องสรุปผล';
    if (t.day === null) return 'Trial กำลังดำเนินอยู่ (ยังไม่ระบุวันเริ่ม)';
    return 'Trial วันที่ ' + t.day + (t.total ? ' จาก ' + t.total : '') +
           (t.left === null ? '' : ' · เหลืออีก ' + t.left + ' วัน');
  }


  /* ---- ส่งมอบ / การชำระเงิน (ขั้น S8) --------------------------------------
     ส่งมอบแล้วไม่ได้แปลว่าจบ -- เงินยังไม่เข้าก็ยังเป็นงานค้างที่ต้องตาม
     คืนก้อนเดียวให้การ์ด ฟอร์ม และหัวข้อเดดไลน์ใช้ร่วมกัน จะได้ไม่คำนวณซ้ำ 3 ที่ */
  function deliveryInfo(j) {
    var st = SP.C.stage(j.stage);
    if (!st || !st.delivered) return { mode:'none', since:null, lag:null, warn:false };
    if (!j.deliveredAt)       return { mode:'nodate', since:null, lag:null, warn:true };
    var since = dayDiff(j.deliveredAt, today());
    if (j.paid) {
      return { mode:'paid', since:since, warn:false,
               lag: j.paidAt ? dayDiff(j.deliveredAt, j.paidAt) : null };
    }
    return { mode:'unpaid', since:since, lag:null, warn: since !== null && since > 30 };
  }

  function deliveryText(j) {
    var d = deliveryInfo(j);
    if (d.mode === 'none') return '';
    if (d.mode === 'nodate') return 'ส่งมอบแล้ว — ยังไม่ได้ระบุวันที่ส่งมอบ';
    var head = 'ส่งมอบ ' + fmtDate(j.deliveredAt) +
               (d.since !== null && d.since > 0 ? ' (' + d.since + ' วันก่อน)' : '');
    if (d.mode === 'paid') {
      return head + ' · ชำระแล้ว' + (j.paidAt ? ' ' + fmtDate(j.paidAt) : ' (ยังไม่ระบุวันที่)') +
             (d.lag !== null ? ' — ใช้เวลา ' + d.lag + ' วัน' : '');
    }
    return head + ' · ยังไม่ได้รับชำระ';
  }


  /* ---- พักงาน / ไม่ได้ทำต่อ (ขั้น S10) -------------------------------------
     แยก 2 กรณีที่ผู้ใช้พูดถึงด้วยฟิลด์เดียว: มี reviveOn = นัดกลับมาทบทวนแล้ว
     ไม่มี = "รอไม่มีกำหนด" ซึ่งเป็นกรณีที่หายเงียบได้ง่ายที่สุด จึงต้องมีตัวนับวันคุม */
  function parkInfo(j) {
    var st = SP.C.stage(j.stage);
    if (!st || !st.isParked) return { mode:'none', since:null, reviveIn:null, warn:false };
    if (!j.parkedAt)         return { mode:'nodate', since:null, reviveIn:null, warn:true };
    var since = dayDiff(j.parkedAt, today());
    if (j.reviveOn) {
      var rv = dayDiff(today(), j.reviveOn);
      return { mode:'dated', since:since, reviveIn:rv, warn: rv !== null && rv <= 0 };
    }
    /* พักไว้เกิน 90 วันโดยไม่มีกำหนดกลับมา = ต้องตัดสินใจแล้วว่าจะรื้อฟื้นหรือปิดเป็น S9 */
    return { mode:'open', since:since, reviveIn:null, warn: since !== null && since > 90 };
  }

  function parkText(j) {
    var p = parkInfo(j);
    if (p.mode === 'none') return '';
    if (p.mode === 'nodate') return 'พักไว้ — ยังไม่ได้ระบุวันที่เริ่มพัก';
    var head = 'พักไว้ตั้งแต่ ' + fmtDate(j.parkedAt) +
               (p.since !== null && p.since > 0 ? ' (' + p.since + ' วัน)' : '');
    if (p.mode === 'open') return head + ' · ยังไม่มีกำหนดกลับมาทำ';
    if (p.reviveIn === null) return head;
    return head + (p.reviveIn >= 0
      ? ' · นัดทบทวน ' + fmtDate(j.reviveOn) + ' (อีก ' + p.reviveIn + ' วัน)'
      : ' · เลยวันนัดทบทวนมา ' + (-p.reviveIn) + ' วัน');
  }

  // ---- badges ------------------------------------------------------------
  function stageBadge(id) {
    var s = C.stage(id); if (!s) return '';
    var col = C.STAGE_COLORS[id] || '#A3A3A3';
    return '<span class="badge badge-stage" style="background:' + col + '" title="' +
           attr(s.name + ' — ' + s.nameTH) + '">' + esc(s.id.replace('_WON', '')) + ' · ' + esc(s.nameTH) + '</span>';
  }
  function stageDot(id) {
    return '<span class="bcol-dot" style="background:' + (C.STAGE_COLORS[id] || '#A3A3A3') + '"></span>';
  }
  function groupBadge(id) {
    var g = C.group(id);
    return '<span class="badge badge-outline" style="color:' + g.color + '" title="' + attr(g.name) + '">' +
           ic(g.icon) + esc(g.nameTH) + '</span>';
  }
  function levelBadge(code) {
    var b = C.budget(code);
    return '<span class="badge badge-outline" style="color:' + b.color + '" title="' + attr(b.nameTH) + '">' +
           ic(b.icon) + esc(code || 'Level 4') + '</span>';
  }
  function statusBadge(st) {
    var w = C.WORK_STATUS[st] || C.WORK_STATUS.active;
    if (st === 'active') return '';
    return '<span class="badge badge-outline" style="color:' + w.color + '">' + ic(w.icon) + esc(w.th) + '</span>';
  }

  // ---- owners ------------------------------------------------------------
  function ownerByName(name) {
    var list = (SP.state && SP.state.owners) || [];
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return null;
  }
  function initials(name) {
    var s = String(name || '').replace(/^(พี่|คุณ|น้อง)/, '').trim();
    return s.slice(0, 2) || '?';
  }
  function ownerChip(name, opts) {
    opts = opts || {};
    if (!name) return '';
    var o = ownerByName(name);
    var color = o ? o.color : '#A3A3A3';
    var cls = o ? 'chip' : 'chip chip-unknown';
    var warn = o ? '' : ic('alert');
    var av = o ? '<span class="avatar" style="background:' + color + '">' + esc(initials(o.short || o.name)) + '</span>' : '';
    return '<span class="' + cls + '" title="' + attr(o ? (C.OWNER_ROLES[o.role] || '') : 'ยังไม่อยู่ในรายชื่อผู้รับผิดชอบ') + '">' +
           av + warn + esc(name) +
           (!o && opts.addBtn ? ' <button class="btn btn-xs" data-act="owner:quickadd" data-name="' + attr(name) + '">เพิ่มเข้ารายชื่อ</button>' : '') +
           '</span>';
  }
  function ownersChips(arr, opts) {
    arr = normNames(arr);
    if (!arr.length) return '<span class="muted small">ยังไม่ระบุผู้รับผิดชอบ</span>';
    return arr.map(function (n) { return ownerChip(n, opts); }).join(' ');
  }
  /* รองรับทั้ง array และ string เก่า (แอปหลักเก็บเป็น "พี่มายด์, พี่โอ๋") */
  function normNames(v) {
    if (Array.isArray(v)) return v.map(function (s) { return String(s).trim(); }).filter(Boolean);
    if (typeof v === 'string') return v.split(/[,/]|และ/).map(function (s) { return s.trim(); }).filter(Boolean);
    return [];
  }

  // ---- misc --------------------------------------------------------------
  function opt(list, cur, blank) {
    var out = blank ? '<option value="">' + esc(blank) + '</option>' : '';
    list.forEach(function (o) {
      var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
      out += '<option value="' + attr(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>';
    });
    return out;
  }
  function budgetYearOptions(cur) {
    var out = '<option value="">— เลือกปี —</option>';
    C.BUDGET_YEARS.forEach(function (g) {
      out += '<option disabled>' + esc('— ' + g.label + ' —') + '</option>';
      g.years.forEach(function (y) {
        out += '<option value="' + attr(y[0]) + '"' + (y[0] === cur ? ' selected' : '') + '>' + esc(y[1]) + '</option>';
      });
    });
    return out;
  }
  function sum(arr, fn) { return arr.reduce(function (a, x) { return a + (Number(fn(x)) || 0); }, 0); }
  function byId(arr, id) { for (var i=0;i<arr.length;i++) if (arr[i].id === id) return arr[i]; return null; }
  function pluralTH(n, w) { return n.toLocaleString() + ' ' + w; }
  function truthy(v) { return !!v; }
  function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

  return {
    esc:esc, attr:attr, ic:ic, nl2br:nl2br, brandMark:brandMark, brandIsWide:brandIsWide,
    TH_MON:TH_MON, TH_MONF:TH_MONF, toDate:toDate, fmtDate:fmtDate, pad:pad,
    arabic:arabic, parseTH:parseTH, parseTHAll:parseTHAll, fmtTime:fmtTime,
    money:money, moneyShort:moneyShort, moneyOrPending:moneyOrPending,
    monday:monday, yearTH:yearTH, weekNo:weekNo, weekAnchor:weekAnchor, weekLabel:weekLabel,
    isoDate:isoDate, daysSince:daysSince, nowISO:nowISO, uid:uid,
    dayDiff:dayDiff, today:today, trialInfo:trialInfo, trialText:trialText,
    deliveryInfo:deliveryInfo, deliveryText:deliveryText,
    parkInfo:parkInfo, parkText:parkText,
    stageBadge:stageBadge, stageDot:stageDot, groupBadge:groupBadge,
    levelBadge:levelBadge, statusBadge:statusBadge,
    ownerByName:ownerByName, ownerChip:ownerChip, ownersChips:ownersChips,
    initials:initials, normNames:normNames,
    opt:opt, budgetYearOptions:budgetYearOptions, sum:sum, byId:byId,
    pluralTH:pluralTH, truthy:truthy
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 03 — STORE
   localStorage บน file:// : Chrome/Edge ตี origin เป็น "file://" เฉย ๆ ไม่มี path
   => ไฟล์ HTML ทุกไฟล์ในเครื่องใช้ bucket เดียวกัน จึงต้อง scope key ด้วย docId
   ถ้า localStorage ใช้ไม่ได้เลย (โควตาเต็ม / Safari SecurityError) แอปยังทำงาน
   ครบทุกอย่างในหน่วยความจำ + แบนเนอร์แดงเตือนให้กดบันทึกเป็นไฟล์ก่อนปิด
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Store = (function () {
  'use strict';
  var P = SP.C.STORAGE_PREFIX;
  var saveTimer = null;
  var saveMode = 'ok';          // ok | memory

  function stateKey(docId) { return P + 'state__' + docId; }
  function undoKey(docId)  { return P + 'undo__' + docId; }
  var UI_KEY    = P + 'ui';
  var INDEX_KEY = P + 'index';

  function lsGet(k) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { return false; }
  }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---- machine-local UI prefs (ไม่เดินทางไปกับไฟล์) -----------------------
  var ui = { me:'', activeTab:'week', filters:{}, filtersOpen:false, folded:{}, openJobs:{}, unlocked:false };
  function loadUI() {
    var u = lsGet(UI_KEY);
    if (u && typeof u === 'object') {
      ui.me = u.me || '';
      ui.activeTab = u.activeTab || 'week';
      /* ตัวกรองเปลี่ยนจากค่าเดี่ยวเป็นเลือกได้หลายค่า — แปลงของเก่าให้ */
      ui.filters = u.filters || {};
      Object.keys(ui.filters).forEach(function (k) {
        var v = ui.filters[k];
        if (k === 'text') { ui.filters[k] = typeof v === 'string' ? v : ''; return; }
        if (Array.isArray(v)) return;
        ui.filters[k] = v ? [v] : [];
      });
      ui.filtersOpen = !!u.filtersOpen;
      ui.folded = u.folded || {};
      ui.openJobs = u.openJobs || {};
      ui.unlocked = !!u.unlocked;
    }
    SP.ui = ui;
    return ui;
  }
  function saveUI() { lsSet(UI_KEY, ui); }

  // ---- migrate ------------------------------------------------------------
  /* เขียนตั้งแต่วันแรกแม้มี case เดียว — สัปดาห์ที่สองคือตอนที่จะต้องใช้ */
  function migrate(doc) {
    if (!doc || typeof doc !== 'object') return doc;
    var s = Number(doc.schema) || 0;

    if (s < 1) {
      doc.schema = 1;
      var m = doc.meta = doc.meta || {};
      if (typeof m.revision !== 'number') m.revision = 1;
      if (!('savedAt' in m))  m.savedAt = null;
      if (!('savedBy' in m))  m.savedBy = '';
      if (!('handoffTo' in m)) m.handoffTo = '';
      if (typeof m.editsSinceSave !== 'number') m.editsSinceSave = 0;
      if (!Array.isArray(m.lineage)) m.lineage = [];
      /* เปลี่ยนจากนับสัปดาห์ตามปีงบ -> ตามปีปฏิทิน: ย้ายชื่อฟิลด์ให้เอกสารเก่า */
      if (m.yearTH === undefined) m.yearTH = m.fiscalYearTH;
      if (m.weekNo === undefined) m.weekNo = m.fiscalWeek;
      delete m.fiscalYearTH; delete m.fiscalWeek;
      if (!Array.isArray(doc.owners)) doc.owners = [];
      if (!Array.isArray(doc.plans)) doc.plans = [];
      if (!Array.isArray(doc.discussions)) doc.discussions = [];
      doc.settings = doc.settings || { defaultOwner:'' };
    }

    /* schema 2 — โครงขั้นการขายเปลี่ยนจาก S0–S9 เป็น S0–S8
       ต้องแปลงทั้ง job.stage และทุก entry ใน stageHistory (ทั้ง stage และ from)
       ไม่งั้นส่วน "ความคืบหน้า" จะอ่านรหัสขั้นที่ไม่มีอยู่แล้วและเงียบหาย */
    if (s < 2) {
      doc.schema = 2;
      (doc.jobs || []).forEach(function (j) {
        j.stage = SP.C.migrateStage(j.stage);
        if (Array.isArray(j.stageHistory)) {
          j.stageHistory.forEach(function (h) {
            if (h.stage) h.stage = SP.C.migrateStage(h.stage);
            if (h.from) h.from = SP.C.migrateStage(h.from);
          });
        }
      });
      /* showValuesInPresent ใช้กับโหมดนำเสนอที่ถูกถอดออกแล้ว */
      if (doc.settings) delete doc.settings.showValuesInPresent;
    }

    /* schema 3 -- แทรกขั้น "ส่งมอบแล้ว" เป็น S8 ทำให้ "ไม่สำเร็จ" ขยับไป S9
       เอกสาร schema 2 ต้องย้ายเอง ใช้ migrateStage() ไม่ได้ เพราะตารางนั้นแปลง
       "รหัสชุดเดิมของสเปรดชีต" ไม่ใช่รหัสชุด schema 2 -- ถ้าเผลอใช้ งานที่แพ้
       จะกลายเป็นงานที่ส่งมอบแล้ว ซึ่งพลิกความหมายกลับด้าน */
    if (s === 2) {
      (doc.jobs || []).forEach(function (j) {
        if (j.stage === 'S8') j.stage = 'S9';
        if (Array.isArray(j.stageHistory)) {
          j.stageHistory.forEach(function (h) {
            if (h.stage === 'S8') h.stage = 'S9';
            if (h.from  === 'S8') h.from  = 'S9';
          });
        }
      });
    }
    if (s < 3) doc.schema = 3;

    /* schema 4 — เพิ่มทะเบียนลูกค้า / ผู้ติดต่อ / บันทึกการติดต่อ
       เก็บเป็น array แบนที่ root ไม่ใช่ object ซ้อน เพราะ Store.patch/add/remove
       และ Actions.field ("<coll>:<id>:<field>") อ้าง SP.state[coll] ตาม id อยู่แล้ว
       -> entity ใหม่ได้ two-way binding + autosave + undo ฟรี ไม่ต้องต่อท่อใหม่

       ปลอดภัยกับเอกสาร schema 3 จริง: ตอนอัปเกรด customers[] ยังว่าง
       linkJobsToCustomers จึงไม่ผูกอะไรเลย job ทุกตัวได้ customerId = null
       ส่วน backfill จริงเกิดตอน commit การ import Master List ซึ่งเรียกฟังก์ชันเดียวกัน */
    if (s < 4) {
      doc.schema = 4;
      if (!Array.isArray(doc.customers))  doc.customers  = [];
      if (!Array.isArray(doc.contacts))   doc.contacts   = [];
      if (!Array.isArray(doc.activities)) doc.activities = [];
      doc.meta = doc.meta || {};
      if (!doc.meta.lastImports) doc.meta.lastImports = {};
      doc.settings = doc.settings || {};
      if (!doc.settings.brand) {
        doc.settings.brand = { name:'AndamanTech', logoSvg:'', logoDataUri:'', accent:'' };
      }
      if (!doc.settings.calendar) {
        doc.settings.calendar = {
          clientId:'', calendarId:'primary', tz:'Asia/Bangkok',
          defaultDuration:60, defaultStartTime:'09:00',
          enabled:false, syncToken:'', lastSyncAt:null
        };
      }
      /* SP.Norm ถูกนิยามใน BLOCK 04 ซึ่งอยู่ "หลัง" บล็อกนี้ — เรียกได้เพราะ
         migrate() ไม่ถูกเรียกจนถึง BOOT (แบบเดียวกับ SP.C.migrateStage ด้านบน)
         ห้ามย้ายการอ้างถึงนี้ออกไปนอกตัวฟังก์ชันเด็ดขาด */
      SP.Norm.linkJobsToCustomers(doc);
    }

    // ให้ทุก job มีรูปร่างเดียวกันเสมอ ไม่ว่าจะมาจาก seed, import หรือไฟล์รุ่นเก่า
    (doc.jobs || []).forEach(function (j) {
      if (typeof j.stageHistory === 'string') {
        try { j.stageHistory = JSON.parse(j.stageHistory); } catch (e) { j.stageHistory = []; }
      }
      if (!Array.isArray(j.stageHistory)) j.stageHistory = [];
      j.assignedTo = SP.U.normNames(j.assignedTo);
      if (!Array.isArray(j.contacts))  j.contacts = [];
      if (!Array.isArray(j.relatedTo)) j.relatedTo = [];
      ['incumbent','intel','egpProjectId','weekNote','blockReason','waitingFor','waitingOn',
       'detail','remark','salesStatus','province','sectionLabel','product',
       'parkReason'].forEach(function (k) {
        if (typeof j[k] !== 'string') j[k] = j[k] == null ? '' : String(j[k]);
      });
      if (!j.workStatus) j.workStatus = 'active';
      if (typeof j.presentVisible !== 'boolean') j.presentVisible = true;
      if (typeof j.isNewThisWeek !== 'boolean') j.isNewThisWeek = false;
      if (typeof j.highlight !== 'boolean') j.highlight = false;
      if (!('bedSize' in j)) j.bedSize = null;
      ['trialRequestedAt','trialPlannedDate','trialStart','trialEnd',
       'deliveredAt','paidAt','parkedAt','reviveOn'].forEach(function (k) {
        if (!(k in j)) j[k] = null;
      });
      if (typeof j.paid !== 'boolean') j.paid = false;
      if (!('expectedRevenue' in j)) j.expectedRevenue = null;
      if (!j.seedBatch) j.seedBatch = '';
      if (!('customerId' in j)) j.customerId = null;
      j.value = Number(j.value) || 0;
    });
    (doc.plans || []).forEach(function (p) {
      if (typeof p.done !== 'boolean') p.done = false;
      if (!p.bucket) p.bucket = 'W1';
      if (typeof p.owner !== 'string') p.owner = '';
      if (!('startDate' in p)) p.startDate = null;
      if (!('dueDate' in p)) p.dueDate = null;
      if (!('customerId' in p)) p.customerId = null;
      if (!('activityId' in p)) p.activityId = null;
      if (!p.kind) p.kind = 'task';
      if (!('startTime' in p)) p.startTime = null;
      if (!('endTime' in p)) p.endTime = null;
      if (typeof p.allDay !== 'boolean') p.allDay = true;
      if (typeof p.notes !== 'string') p.notes = '';
      if (typeof p.location !== 'string') p.location = '';
      /* cal ต้องเป็น object เต็มเสมอ ห้ามปล่อย undefined — ไม่งั้นต้องใส่ guard
         ทุกจุดที่แตะ p.cal.* ในตัวเรนเดอร์ปฏิทิน ซึ่งจะลืมสักจุดแน่นอน */
      if (!p.cal || typeof p.cal !== 'object') p.cal = {};
      if (!('eventId' in p.cal))    p.cal.eventId = null;
      if (!('calendarId' in p.cal)) p.cal.calendarId = null;
      if (!('etag' in p.cal))       p.cal.etag = null;
      if (!('syncedAt' in p.cal))   p.cal.syncedAt = null;
      if (!('syncHash' in p.cal))   p.cal.syncHash = null;
      if (!p.cal.state)             p.cal.state = 'none';
    });
    (doc.customers || []).forEach(function (c) {
      if (!Array.isArray(c.aliases)) c.aliases = [];
      if (!Array.isArray(c.productGroups)) c.productGroups = [];
      ['name','zone','province','hospitalType','ownerType','ownerGroup','schemes',
       'approachDept','approachNote','fitProducts','salesOwner','nextActionNote',
       'lineNote','sourceUrl','remark'].forEach(function (k) {
        if (typeof c[k] !== 'string') c[k] = c[k] == null ? '' : String(c[k]);
      });
      if (!c.registry || typeof c.registry !== 'object') c.registry = {};
      ['action','similarity','reason'].forEach(function (k) {
        if (typeof c.registry[k] !== 'string') c.registry[k] = c.registry[k] == null ? '' : String(c.registry[k]);
      });
      if (!('reviewedAt' in c.registry)) c.registry.reviewedAt = null;
      ['lastContactAt','nextActionAt'].forEach(function (k) { if (!(k in c)) c[k] = null; });
      if (!('bedSize' in c)) c.bedSize = null;
      if (!SP.C.LEAD_STATUS[c.leadStatus]) c.leadStatus = 'new';
      if (!SP.C.PRIORITIES[c.priority]) c.priority = 'B';
      if (typeof c.active !== 'boolean') c.active = true;
      if (!c.seedBatch) c.seedBatch = '';
    });
    (doc.contacts || []).forEach(function (k) {
      ['customerId','name','role','phone','email','line','note'].forEach(function (f) {
        if (typeof k[f] !== 'string') k[f] = k[f] == null ? '' : String(k[f]);
      });
      if (typeof k.isPrimary !== 'boolean') k.isPrimary = false;
      if (typeof k.active !== 'boolean') k.active = true;
    });
    (doc.activities || []).forEach(function (a) {
      ['topic','result','nextAction','channelNote','followUpNote','owner','lineNote','importKey']
        .forEach(function (f) {
          if (typeof a[f] !== 'string') a[f] = a[f] == null ? '' : String(a[f]);
        });
      ['customerId','contactId','jobId','date','doneDate','followUpAt'].forEach(function (f) {
        if (!(f in a)) a[f] = null;
      });
      if (!SP.C.ACT_CHANNELS[a.channel]) a.channel = 'other';
      if (!SP.C.ACT_STATUS[a.status]) a.status = 'todo';
      if (!a.seedBatch) a.seedBatch = '';
    });
    (doc.discussions || []).forEach(function (d) {
      if (!d.askType) d.askType = 'opinion';
      if (!d.status) d.status = 'open';
      ['topic','context','options','proposedBy','decision','decidedBy'].forEach(function (k) {
        if (typeof d[k] !== 'string') d[k] = d[k] == null ? '' : String(d[k]);
      });
    });
    return doc;
  }

  // ---- autosave -----------------------------------------------------------
  function touch(countEdit) {
    if (!SP.state) return;
    SP.state.meta.updatedAt = SP.U.nowISO();
    if (countEdit !== false) SP.state.meta.editsSinceSave = (SP.state.meta.editsSinceSave || 0) + 1;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
    if (SP.Render && SP.Render.header) SP.Render.header();
  }
  function flush() {
    if (!SP.state) return;
    var ok = lsSet(stateKey(SP.state.meta.docId), SP.state);
    if (ok) {
      saveMode = 'ok';
      var idx = lsGet(INDEX_KEY) || {};
      idx[SP.state.meta.docId] = {
        title: SP.state.meta.title, weekOf: SP.state.meta.weekOf,
        revision: SP.state.meta.revision, savedAt: SP.state.meta.savedAt,
        touchedAt: SP.U.nowISO()
      };
      lsSet(INDEX_KEY, idx);
    } else if (saveMode !== 'memory') {
      saveMode = 'memory';
      if (SP.Render && SP.Render.all) SP.Render.all();
    }
    if (SP.Sync && SP.Sync.online()) SP.Sync.schedule();
  }
  function mode() { return saveMode; }
  function forceMemoryMode() { saveMode = 'memory'; }   // ไว้ทดสอบ path นี้โดยตั้งใจ

  // ---- mutation API — ทุกการเขียน state ต้องผ่านทางนี้เท่านั้น -------------
  function patch(coll, id, changes) {
    var item = SP.U.byId(SP.state[coll] || [], id);
    if (!item) return null;
    Object.keys(changes).forEach(function (k) { item[k] = changes[k]; });
    item.updatedAt = SP.U.nowISO();
    touch();
    return item;
  }
  function add(coll, item) {
    SP.state[coll] = SP.state[coll] || [];
    item.createdAt = item.createdAt || SP.U.nowISO();
    item.updatedAt = item.updatedAt || item.createdAt;
    SP.state[coll].push(item);
    touch();
    return item;
  }
  function remove(coll, id) {
    var arr = SP.state[coll] || [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) { arr.splice(i, 1); touch(); return true; }
    }
    return false;
  }
  function setMeta(changes) {
    Object.keys(changes).forEach(function (k) { SP.state.meta[k] = changes[k]; });
    touch();
  }

  // ---- undo snapshot (ชั้นเดียว ใช้กับการนำเข้า) ---------------------------
  function pushUndo(label) {
    lsSet(undoKey(SP.state.meta.docId), { label:label, at:SP.U.nowISO(), doc:SP.state });
  }
  function peekUndo() { return SP.state ? lsGet(undoKey(SP.state.meta.docId)) : null; }
  function popUndo() {
    var u = peekUndo(); if (!u) return null;
    lsDel(undoKey(SP.state.meta.docId));
    return u;
  }

  // ---- boot ---------------------------------------------------------------
  /* ตัดสินด้วย meta.revision ไม่ใช่ timestamp — นาฬิกาคนละเครื่องเชื่อไม่ได้
     และโจทย์จริงคือ "ไฟล์นี้เป็นรุ่นที่เท่าไรของสายพันธุ์" ไม่ใช่ "ใครพิมพ์ทีหลัง" */
  function readSeed() {
    var el = document.getElementById('seed-data');
    try { return migrate(JSON.parse(el.textContent)); }
    catch (e) { console.error('seed-data พัง:', e); return null; }
  }
  function readLocal(docId) {
    var d = lsGet(stateKey(docId));
    return d ? migrate(d) : null;
  }
  function decide(seed, saved) {
    if (!saved) return { use:'seed', why:'fresh' };
    var rs = Number(seed.meta.revision) || 0, rl = Number(saved.meta.revision) || 0;
    if (rl < rs) return { use:'ask', why:'fileNewer' };
    if (rl > rs) return { use:'ask', why:'localNewer' };
    return { use:'local', why:'same' };
  }
  function use(doc) { SP.state = doc; return doc; }

  return {
    stateKey:stateKey, UI_KEY:UI_KEY, INDEX_KEY:INDEX_KEY,
    lsGet:lsGet, lsSet:lsSet, lsDel:lsDel,
    loadUI:loadUI, saveUI:saveUI, ui:ui,
    migrate:migrate, touch:touch, flush:flush, mode:mode, forceMemoryMode:forceMemoryMode,
    patch:patch, add:add, remove:remove, setMeta:setMeta,
    pushUndo:pushUndo, peekUndo:peekUndo, popUndo:popUndo,
    readSeed:readSeed, readLocal:readLocal, decide:decide, use:use
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 03b — SYNC  (โหมดออนไลน์: เก็บข้อมูลลงฐานข้อมูลผ่าน /api)

   สองโหมดในไฟล์เดียว:
   - ออนไลน์   = เสิร์ฟจาก server (http/https) และ <html> ไม่มี data-standalone
                 → แหล่งข้อมูลจริงคือฐานข้อมูล localStorage เป็นแค่แคช
   - standalone = ไฟล์ที่ได้จาก "บันทึกเป็นไฟล์ HTML" (buildHtml ติด data-standalone ให้)
                 → ทำงานแบบเดิมทุกอย่าง seed + localStorage ไม่ยิง network เลย

   วิธีซิงก์: จำ "ภาพล่าสุดที่ server รับแล้ว" (base) ไว้ ทุกครั้งที่ Store.flush()
   เทียบ state ปัจจุบันกับ base ทีละ record → ส่งเฉพาะที่ต่าง
   จึงจับได้ทุกการแก้ รวมถึงจุดที่แก้ SP.state ตรง ๆ แล้วเรียก touch() (import, rename ฯลฯ)
   โดยไม่ต้องไล่แก้ทีละจุด · server ให้เลข seq เป็นนาฬิกากลาง ชนกัน = batch หลังชนะ
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Sync = (function () {
  'use strict';
  var P = SP.C.STORAGE_PREFIX;
  var TOKEN_KEY = P + 'token';
  var SYNC_KEY  = P + 'sync';        // { docId, seq, base } — รอดการรีโหลด ใช้กู้การแก้ที่ยังไม่ขึ้น server
  var HASH_KEY  = P + 'pinhash';     // ติดไปกับไฟล์ที่ export ให้ประตู PIN ของไฟล์สำรองใช้
  var COLLS = ['jobs', 'customers', 'contacts', 'activities', 'plans', 'discussions', 'owners'];
  var POLL_MS = 20000, RETRY_MS = 10000;

  var isOnline = !document.documentElement.hasAttribute('data-standalone') &&
                 (location.protocol === 'http:' || location.protocol === 'https:');

  var docId = null, seq = 0, base = null, schema = 4;
  var status = 'idle';               // idle | saving | ok | offline
  var lastError = '', lastOkAt = null;
  var inflight = false, again = false, started = false, relocking = false;
  var retryTimer = null, pushTimer = null, renderPending = false;

  function online() { return isOnline; }
  function ls() { return SP.Store; }

  // ---- token / PIN ----------------------------------------------------------
  function token() { return ls().lsGet(TOKEN_KEY) || ''; }
  function hasToken() { return !!token(); }
  function clearToken() { ls().lsDel(TOKEN_KEY); }
  /* แฮชแบบง่าย (FNV-1a) — ไฟล์สำรองมีข้อมูลเป็น JSON อ่านได้อยู่แล้ว ประตูนี้กันคนเปิดผ่าน ๆ เท่านั้น
     สิ่งที่สำคัญจริงคือ "รหัสจริงไม่อยู่ในซอร์สของหน้าเว็บ" ที่ใครก็ view-source ได้ */
  function pinHash(pin) {
    var s = 'spw-pin:' + String(pin || ''), h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('0000000' + h.toString(16)).slice(-8);
  }
  function storedPinHash() { return ls().lsGet(HASH_KEY) || ''; }

  // ---- HTTP ----------------------------------------------------------------
  function req(method, path, body) {
    var headers = { 'Content-Type': 'application/json' };
    var t = token();
    if (t) headers.Authorization = 'Bearer ' + t;
    return fetch('/api' + path, {
      method: method, headers: headers, cache: 'no-store',
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok) return j;
        var err = new Error(j.error || ('HTTP ' + r.status));
        err.status = r.status; err.code = j.code || '';
        if (r.status === 401 && path.indexOf('/auth/') !== 0) onUnauthorized();
        throw err;
      });
    }, function () {
      var err = new Error('เชื่อมต่อ server ไม่ได้'); err.status = 0; err.code = 'NETWORK'; throw err;
    });
  }
  function login(pin) {
    return req('POST', '/auth/pin', { pin: pin }).then(function (j) {
      ls().lsSet(TOKEN_KEY, j.token);
      ls().lsSet(HASH_KEY, pinHash(pin));
      return true;
    });
  }
  /* token หมดอายุ/ถูกเปลี่ยน secret — การแก้ที่ค้างอยู่ปลอดภัยใน SYNC_KEY + แคช
     โหลดหน้าใหม่ → ประตู PIN → boot() จะส่งของที่ค้างขึ้นไปให้เอง */
  function onUnauthorized() {
    if (relocking) return;
    relocking = true;
    clearToken();
    SP.ui.unlocked = false; ls().saveUI();
    if (SP.state && docId) ls().lsSet(ls().stateKey(docId), SP.state);
    persist();
    location.reload();
  }

  // ---- snapshot / diff -----------------------------------------------------
  var VOLATILE_META = ['updatedAt', 'editsSinceSave'];
  function metaForServer(m) {
    var o = {};
    Object.keys(m || {}).forEach(function (k) { if (VOLATILE_META.indexOf(k) < 0) o[k] = m[k]; });
    o.docId = docId || o.docId;
    o._schema = schema;
    return o;
  }
  function snapshot(state) {
    var snap = { meta: JSON.stringify(metaForServer(state.meta)), settings: JSON.stringify(state.settings || {}), c: {} };
    COLLS.forEach(function (coll) {
      var map = snap.c[coll] = {};
      (state[coll] || []).forEach(function (r) { if (r && r.id) map[r.id] = JSON.stringify(r); });
    });
    return snap;
  }
  function emptySnap() {
    var s = { meta: '', settings: '', c: {} };
    COLLS.forEach(function (c) { s.c[c] = {}; });
    return s;
  }
  /* คืน { upserts, deletes, meta, settings, n, keys } — keys = ชุด "coll/id" ที่เครื่องนี้แก้ค้างอยู่ */
  function diff(snap, from) {
    from = from || emptySnap();
    var d = { upserts: {}, deletes: {}, meta: false, settings: false, n: 0, keys: {} };
    COLLS.forEach(function (coll) {
      var now = snap.c[coll] || {}, was = from.c[coll] || {};
      Object.keys(now).forEach(function (id) {
        if (now[id] !== was[id]) { (d.upserts[coll] = d.upserts[coll] || []).push(id); d.keys[coll + '/' + id] = 1; d.n++; }
      });
      Object.keys(was).forEach(function (id) {
        if (!(id in now)) { (d.deletes[coll] = d.deletes[coll] || []).push(id); d.keys[coll + '/' + id] = 1; d.n++; }
      });
    });
    d.meta = snap.meta !== from.meta;
    d.settings = snap.settings !== from.settings;
    return d;
  }
  function hasChanges(d) { return d.n > 0 || d.meta || d.settings; }
  function pending() {
    if (!isOnline || !base || !SP.state || relocking) return false;   // relocking = โหลดหน้าใหม่โดยตั้งใจ ไม่ต้องเตือน
    return inflight || hasChanges(diff(snapshot(SP.state), base));
  }

  function persist() {
    if (!docId || !base) return;
    ls().lsSet(SYNC_KEY, { docId: docId, seq: seq, base: base });
  }

  // ---- นำของจาก server เข้า state ----------------------------------------
  function upsertLocal(state, coll, rec) {
    var arr = state[coll] = state[coll] || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === rec.id) { arr[i] = rec; return; }
    arr.push(rec);
  }
  function removeLocal(state, coll, id) {
    var arr = state[coll] || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) { arr.splice(i, 1); return; }
  }
