        ? '<div class="banner banner-info">' + U.ic('info') +
            '<div>รหัสขั้นในไฟล์ถือเป็น<b>ชุดเดิม S0–S9</b> ระบบจะแปลงเป็นชุดใหม่ S0–S10 ให้อัตโนมัติ ' +
            '(S7 และ S6 รวมเป็นขั้นเดียว · S7_WON กลายเป็น “กำลังดำเนินงาน”) — ดูผลจริงได้ในตัวอย่างด้านล่าง</div></div>' +
          '<div class="banner banner-warn">' + U.ic('alert') +
            '<div>ไฟล์ต้นทางของทีมมี <b>คอลัมน์ D ที่ไม่มีหัวตาราง</b> แต่เก็บ “จังหวัด” ไว้ — ระบบเดาให้ไม่ได้ ' +
            'ให้ดูค่าตัวอย่างในวงเล็บแล้วเลือกเอง (นี่คือเหตุผลที่ต้องมีขั้นจับคู่คอลัมน์)</div></div>'
        : '') +
      '<div class="map-grid">' + grid + '</div>' +
      '<div><b>ตัวอย่างผลลัพธ์ 5 แถวแรก</b> <span class="small muted">— เปลี่ยนการจับคู่แล้วดูผลทันที</span></div>' +
      '<div class="p-grid">' + (prev || '<div class="empty">ยังไม่มีแถวข้อมูลที่อ่านได้ — ลองปรับแถวหัวตาราง</div>') + '</div>' +
      '<div class="small muted">อ่านได้ ' + p.list.length + ' แถว · ข้าม ' + (p.skip.section + p.skip.blank) +
        ' แถว (หัวข้อกลุ่ม ' + p.skip.section + ', แถวว่าง/ยอดรวม ' + p.skip.blank + ')</div>' +
      '<div class="btn-group">' +
        '<button class="btn btn-primary" data-act="imp:next"' + (reqOk() && p.list.length ? '' : ' disabled') + '>' +
          U.ic('chevron-right') + 'ถัดไป — ตรวจและยืนยัน</button>' +
      '</div></div>';
  }

  /* แต่ละ profile เก็บ "ชื่อที่ใช้แสดง" ไว้คนละที่ — รวมไว้ที่เดียวกันสองตัวนี้
     เพื่อให้แบนเนอร์และตารางสรุปใช้โค้ดชุดเดียวได้ทุก profile */
  function rowName(r) {
    if (!r) return '';
    if (r.job)  return r.job.customerName;
    if (r.cust) return r.cust.name;
    if (r.act)  return r._raw || '';
    return r.name || '';
  }
  function targetName(t) {
    if (!t) return '';
    return t.customerName || t.name || t.topic || '';
  }

  function mergeText() {
    if (st.profile === 'customers') return 'รวมข้อมูล (แนะนำ) — อัปเดตโรงพยาบาลที่มีอยู่แล้ว และเพิ่มรายที่ยังไม่มี · ชื่อเรียกอื่นและผลการทบทวนที่เคยบันทึกไว้จะไม่ถูกลบ';
    if (st.profile === 'activity')  return 'รวมข้อมูล (แนะนำ) — แถวเดิมที่เคยนำเข้าแล้วจะถูกอัปเดต ไม่สร้างซ้ำ (จำจากวันที่+โรงพยาบาล+เรื่องที่คุย)';
    return 'รวมข้อมูล (แนะนำ) — อัปเดตงานเดิมที่ชื่อ+หมวดตรงกัน และเก็บธง “ใหม่” / เหตุผลที่หยุด / ผู้รับผิดชอบ / การซ่อนตอนนำเสนอ ไว้ครบ';
  }
  function replaceText() {
    if (st.profile === 'customers') return 'แทนที่ทั้งหมด — ลบทะเบียนลูกค้าและผู้ติดต่อเดิมทั้งหมดแล้วใส่ของใหม่';
    if (st.profile === 'activity')  return 'แทนที่ทั้งหมด — ลบบันทึกการติดต่อเดิมทั้งหมดแล้วใส่ของใหม่';
    return 'แทนที่ทั้งหมด — ลบงานเดิมทุกรายการแล้วใส่ของใหม่ (แผนงานและวาระไม่ถูกลบ แต่จะขึ้นป้ายว่างานที่อ้างถึงถูกลบ)';
  }
  function replaceWarning() {
    if (st.profile === 'customers') {
      var nj = SP.state.jobs.filter(function (j) { return j.customerId; }).length;
      var na = SP.Act.all().filter(function (a) { return a.customerId; }).length;
      return '<div class="banner banner-bad">' + U.ic('alert') + '<div><b>คำเตือน:</b> ทะเบียน ' +
        SP.Cust.all().length + ' ราย และผู้ติดต่อ ' + (SP.state.contacts || []).length + ' คนจะถูกลบทั้งหมด · ' +
        'งาน <b>' + nj + '</b> รายการ และบันทึกการติดต่อ <b>' + na + '</b> รายการจะถูกตัดการผูกกับลูกค้า ' +
        '(ตัวงานและบันทึกไม่ถูกลบ แต่จะไม่รู้ว่าเป็นของโรงพยาบาลไหนจนกว่าจะผูกใหม่)</div></div>';
    }
    if (st.profile === 'activity') {
      return '<div class="banner banner-bad">' + U.ic('alert') + '<div><b>คำเตือน:</b> บันทึกการติดต่อ ' +
        SP.Act.all().length + ' รายการจะถูกลบทั้งหมด · งานที่เคยสร้างจากบันทึกเหล่านั้นจะไม่ถูกลบ ' +
        'แต่จะไม่รู้แล้วว่ามาจากการติดต่อครั้งไหน</div></div>';
    }
    return '<div class="banner banner-bad">' + U.ic('alert') + '<div><b>คำเตือน:</b> คำอธิบายรายสัปดาห์ทั้งหมด (ธง “ใหม่”, เหตุผลที่หยุด, สิ่งที่รอ, ผู้รับผิดชอบ, การซ่อนตอนนำเสนอ) ของงาน ' +
      SP.state.jobs.length + ' รายการจะหายทั้งหมด</div></div>';
  }

  /* undo เก็บลง localStorage — ในโหมดหน่วยความจำอย่างเดียว lsSet คืน false
     แปลว่า "ย้อนกลับ" ไม่มีอยู่จริง และการนำเข้าแบบแทนที่จะกู้ไม่ได้เลย
     ต้องบอกก่อนกด ไม่ใช่หลังกด */
  function undoWarning() {
    if (SP.Store.mode() !== 'memory') return '';
    return '<div class="banner banner-bad">' + U.ic('alert') +
      '<div><b>เบราว์เซอร์นี้เก็บข้อมูลถาวรไม่ได้</b> — ปุ่ม “ย้อนการนำเข้า” จะใช้ไม่ได้ ' +
      'ถ้านำเข้าแล้วผลไม่ถูกต้องจะกู้คืนไม่ได้ แนะนำให้กด “บันทึกเป็นไฟล์ HTML” เก็บไว้ก่อน</div></div>';
  }

  /* แผงตัดสินชื่อที่จับคู่ไม่ได้ — เลือกครั้งเดียว ครั้งหน้าไม่ต้องเลือกอีก
     เพราะชื่อดิบจะถูกเก็บเป็น alias ของลูกค้ารายนั้นตอน commit */
  function resolvePanel(d) {
    if (!d.unresolved || !d.unresolved.length) return '';
    var custs = SP.Cust.all();
    return '<div class="banner banner-warn">' + U.ic('alert') +
      '<div><b>มีชื่อที่ยังจับคู่กับทะเบียนไม่ได้ ' + d.unresolved.length + ' ชื่อ</b> — ' +
      'เลือกให้ครบก่อน ไม่งั้นบันทึกเหล่านี้จะไม่รู้ว่าเป็นของโรงพยาบาลไหน</div></div>' +
      '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
        '<th>ชื่อในไฟล์</th><th>จำนวนแถว</th><th>ระบบเดาว่า</th><th>ให้เป็น</th></tr></thead><tbody>' +
      d.unresolved.map(function (u) {
        var g = u.guess && u.guess.customer;
        /* เรียงตัวที่คะแนนสูงไว้บนสุด เพื่อให้ตัวเลือกที่น่าจะถูกอยู่ใกล้มือ */
        var opts = custs.slice().sort(function (a, b) {
          return SP.Norm.matchCustomer(u.raw, [b]).score - SP.Norm.matchCustomer(u.raw, [a]).score;
        });
        return '<tr><td><b>' + U.esc(u.raw) + '</b></td>' +
          '<td class="tiny">' + u.count + '</td>' +
          '<td class="tiny muted">' + (g ? U.esc(g.name) + ' (' + Math.round(u.guess.score * 100) + '%)' : 'ไม่พบที่ใกล้เคียง') + '</td>' +
          '<td><select class="inp" data-act-change="imp:resolve" data-k="' + U.attr(u.key) + '">' +
            '<option value="">— ยังไม่เลือก —</option>' +
            '<option value="new">+ สร้างเป็นลูกค้าใหม่</option>' +
            '<option value="skip">ข้ามแถวเหล่านี้</option>' +
            opts.map(function (c) {
              return '<option value="' + c.id + '"' + (st.resolve[u.key] === c.id ? ' selected' : '') + '>' + U.esc(c.name) + '</option>';
            }).join('') +
          '</select></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function step2() {
    var d = diff();
    var newOwners = Object.keys(d.newOwners);
    return '<div class="card card-pad stack">' +
      '<div class="diff">' +
        '<span>เพิ่มใหม่ <b style="color:#027A48">' + d.add.length + '</b></span>' +
        '<span>อัปเดต <b style="color:#175CD3">' + d.update.length + '</b></span>' +
        '<span>ไม่เปลี่ยน <b>' + d.same.length + '</b></span>' +
        '<span>ข้าม <b>' + (d.skip.section + d.skip.blank) + '</b></span>' +
        (d.near.length ? '<span>ต้องตรวจสอบ <b style="color:#B54708">' + d.near.length + '</b></span>' : '') +
        (newOwners.length ? '<span>ผู้รับผิดชอบใหม่ <b style="color:#B54708">' + newOwners.length + '</b></span>' : '') +
      '</div>' +
      (d.near.length
        ? '<div class="banner banner-warn">' + U.ic('alert') + '<div><b>ชื่อคล้ายของเดิม — ตรวจก่อนว่าซ้ำกันไหม</b><ul style="margin:6px 0 0;padding-left:18px">' +
          d.near.map(function (n) {
            return '<li>' + U.esc(rowName(n.row)) + ' <span class="muted">คล้ายกับ</span> ' + U.esc(targetName(n.target)) + '</li>';
          }).join('') + '</ul></div></div>'
        : '') +
      (newOwners.length
        ? '<div class="banner banner-info">' + U.ic('users') + '<div>พบผู้รับผิดชอบที่ยังไม่อยู่ในรายชื่อ: <b>' +
          newOwners.map(U.esc).join(', ') + '</b> — เพิ่มได้ที่หน้าตั้งค่าหลังนำเข้า</div></div>'
        : '') +
      resolvePanel(d) +
      undoWarning() +
      (P().modes
        ? '<div><b>วิธีนำเข้า</b></div>' +
          '<label class="check"><input type="radio" name="impmode" value="merge" data-act-change="imp:mode"' + (st.mode === 'merge' ? ' checked' : '') + '>' +
            U.esc(mergeText()) + '</label>' +
          '<label class="check"><input type="radio" name="impmode" value="replace" data-act-change="imp:mode"' + (st.mode === 'replace' ? ' checked' : '') + '>' +
            U.esc(replaceText()) + '</label>'
        : '<div class="banner banner-info">' + U.ic('info') +
          '<div>ชีตนี้เป็นการ <b>ทบทวน</b> ทะเบียน จึงมีแต่โหมดรวมข้อมูลเท่านั้น — ' +
          'จะเติมเฉพาะช่องที่ยังว่าง ไม่ทับข้อมูลที่ Master List มีอยู่แล้ว</div></div>') +
      (P().modes && st.mode === 'replace' ? replaceWarning() : '') +
      '<div class="btn-group">' +
        '<button class="btn" data-act="imp:back">' + U.ic('chevron-left') + 'กลับไปแก้การจับคู่</button>' +
        '<button class="btn btn-primary" data-act="imp:commit">' + U.ic('check') + 'นำเข้าข้อมูล</button>' +
        '<button class="btn" data-act="imp:reset">' + U.ic('close') + 'ยกเลิก</button>' +
      '</div></div>';
  }

  function render() {
    return '<div class="sect-hd"><h2>' + U.ic('import', 'ic-lg') + 'นำเข้าข้อมูลจาก Excel / CSV</h2></div>' +
      stepBar() +
      (st.step === 0 ? step0() : st.step === 1 ? step1() : step2());
  }

  // ---- file handling ------------------------------------------------------
  function readWorkbook(wbData, type) {
    var wb = XLSX.read(wbData, type === 'string' ? { type:'string' } : { type:'array', cellDates:true });
    st.sheets = wb.SheetNames;
    st.sheet = st.sheet && wb.SheetNames.indexOf(st.sheet) >= 0 ? st.sheet : wb.SheetNames[0];
    st.rows = XLSX.utils.sheet_to_json(wb.Sheets[st.sheet], { header:1, defval:'', blankrows:false, raw:true });
    /* เดา profile ก่อน เพราะทั้ง guessHeader และ autoMap ต้องใช้คำศัพท์ของ profile นั้น
       เดาหัวตารางด้วยคำศัพท์ผิดชุด = ได้แถวหัวตารางผิด = จับคู่คอลัมน์ผิดทั้งชีต */
    st.profile = guessProfile(st.sheet, st.rows[0] || []);
    st.headerRow = guessHeader(st.rows, P().vocab);
    st.resolve = {};
    autoMap();
    st.step = 1;
    SP.Render.current();
  }

  function pick() {
    ensureXlsx().then(function () {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
      inp.onchange = function () {
        var f = inp.files && inp.files[0]; if (!f) return;
        st.fileName = f.name; st.sheet = ''; st.tis = false;
        var r = new FileReader();
        r.onload = function () {
          st.buf = r.result;
          if (/\.csv$/i.test(f.name)) {
            var txt = new TextDecoder('utf-8').decode(new Uint8Array(r.result)).replace(/^﻿/, '');
            /* Excel ไทยมักเซฟ CSV เป็น windows-874/TIS-620 ไม่ใช่ UTF-8 */
            if (/�/.test(txt) || (/à¸|à¹/.test(txt) && !/[฀-๿]/.test(txt))) st.tis = true;
            readWorkbook(txt, 'string');
          } else {
            readWorkbook(new Uint8Array(r.result), 'array');
          }
        };
        r.readAsArrayBuffer(f);
      };
      inp.click();
    }).catch(function () {
      SP.Toast.show('ต้องต่ออินเทอร์เน็ตเพื่อนำเข้าไฟล์ Excel — ส่วนอื่นของหน้านี้ใช้งานได้ตามปกติ', 'bad', 8000);
    });
  }

  return {
    st:st, render:render, pick:pick, diff:diff, commit:commit, parseRows:parseRows,
    autoMap:autoMap, readWorkbook:readWorkbook, TARGETS:TARGETS,
    PROFILES:PROFILES, P:P, guessHeader:guessHeader, guessProfile:guessProfile
  };
})();

SP.Render.register('import', SP.Imp.render);

SP.Actions.on('imp:pick',  function () { SP.Imp.pick(); });
SP.Actions.on('imp:next',  function () { SP.Imp.st.step = 2; SP.Render.current(); });
SP.Actions.on('imp:back',  function () { SP.Imp.st.step = 1; SP.Render.current(); });
SP.Actions.on('imp:reset', function () {
  SP.Imp.st.step = 0; SP.Imp.st.rows = []; SP.Imp.st.buf = null; SP.Imp.st.fileName = '';
  SP.Render.current();
});
SP.Actions.on('imp:commit', function () { SP.Imp.commit(); });
/* สองตัวนี้วิ่งผ่าน fallthrough ของ listener 'change' ใน BOOT (ดูหมายเหตุที่นั่น) */
SP.Actions.on('imp:profile', function (ds, ev) {
  SP.Imp.st.profile = ev.target.value;
  SP.Imp.st.headerRow = SP.Imp.guessHeader(SP.Imp.st.rows, SP.Imp.P().vocab);
  SP.Imp.st.resolve = {};
  SP.Imp.autoMap();                       // คอลัมน์คนละชุด ต้องจับคู่ใหม่ทั้งหมด
  SP.Render.current();
});
SP.Actions.on('imp:resolve', function (ds, ev) {
  if (ev.target.value) SP.Imp.st.resolve[ds.k] = ev.target.value;
  else delete SP.Imp.st.resolve[ds.k];
  SP.Render.current();
});
SP.Actions.on('imp:tis', function () {
  var st = SP.Imp.st;
  if (!st.buf) return;
  try {
    var txt = new TextDecoder('windows-874').decode(new Uint8Array(st.buf)).replace(/^﻿/, '');
    st.tis = false;
    SP.Imp.readWorkbook(txt, 'string');
    SP.Toast.show('อ่านไฟล์ใหม่แบบ TIS-620 แล้ว', 'ok');
  } catch (e) {
    SP.Toast.show('เบราว์เซอร์นี้ไม่รองรับการถอดรหัส TIS-620 — กรุณาบันทึกไฟล์เป็น .xlsx แทน', 'bad', 7000);
  }
});
</script>

<script>
/* ============================================================================
   BLOCK 14 — CALENDAR  (ICS · ลิงก์ Google Calendar · sync ผ่าน API)

   เลข 14 ไม่ใช่ 13 เพราะ BOOT ต้องอยู่ท้ายสุด "ทางกายภาพ" — เป็นบล็อกเดียว
   ที่มี side effect ตอนโหลด · เลขบล็อกคือชื่อ ไม่ใช่ลำดับ
   แยกเป็นบล็อกของตัวเองโดยตั้งใจ: เป็นโค้ดเสี่ยงที่สุดในไฟล์ และต้องลบทิ้งได้
   ทั้งบล็อกโดยไม่กระทบอย่างอื่น (เหลือแค่ปุ่มที่หายไป)

   *** ทำไมต้องมีสองทาง ***
   Google ไม่ยอมให้ลงทะเบียน file:// เป็น Authorized JavaScript origin
   แปลว่าเปิดไฟล์ด้วยการดับเบิลคลิก = ใช้ OAuth ไม่ได้ ไม่ว่าจะพยายามแค่ไหน
   จึงตรวจ protocol แล้วเลือกทาง:
     file://          -> ดาวน์โหลด .ics + ลิงก์ "เพิ่มลง Google Calendar"
     http(s) + ClientID -> Google Identity Services + Calendar API v3 สองทางเต็ม
   และนี่คือเหตุผลที่กฎ "ห้ามใช้ fetch()" ของ BLOCK 13 ยังเป็นจริง:
   บน file:// สาขา API เข้าไม่ถึงเลย จึงไม่มี fetch ถูกยิงสักครั้ง
   *** อย่า "ทำให้เรียบง่ายขึ้น" ด้วยการตัดประตูนี้ทิ้ง มันจะพังทันทีบน file:// ***
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Cal = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  /* access token อยู่ในตัวแปรของ module เท่านั้น ห้ามแตะ SP.state เด็ดขาด —
     ทุกอย่างใน SP.state ถูก serialize ลง #seed-data โดย SP.Export.buildHtml()
     แล้วไฟล์นั้นถูกส่งอีเมล/แชร์ต่อ token ที่หลุดไปกับไฟล์คือบัญชี Google ของผู้ใช้ */
  var token = null, tokenExp = 0, tokenClient = null;

  function cfg() {
    return (SP.state && SP.state.settings && SP.state.settings.calendar) || {};
  }
  function clientId() {
    return SP.ui.gcalClientId || cfg().clientId || '';
  }
  /* ประเมินสดทุกครั้ง ห้าม cache ตอนโหลด — ผู้ใช้วาง Client ID กลางเซสชันได้ */
  function mode() {
    var served = (location.protocol === 'http:' || location.protocol === 'https:');
    if (!served)     return 'offline';
    if (!clientId()) return 'noauth';
    return 'api';
  }

  /* ---- วันที่/เวลา ---------------------------------------------------------
     ปฏิทินสนใจแค่ "เริ่มเมื่อไร จบเมื่อไร" ไม่สนใจ bucket ของแผนงาน */
  function whenOf(p) {
    var start = p.startDate || p.dueDate;
    if (!start) return null;
    var end = (p.dueDate && p.startDate && p.dueDate !== p.startDate) ? p.dueDate : start;
    var timed = !!p.startTime && p.allDay === false;
    return { start:start, end:end, timed:timed,
             startTime: p.startTime || cfg().defaultStartTime || '09:00',
             endTime: p.endTime || null };
  }
  function addDays(iso, n) {
    var d = U.toDate(iso + 'T00:00:00'); if (!d) return iso;
    d.setDate(d.getDate() + n);
    return U.isoDate(d);
  }
  function endTimeOf(w) {
    if (w.endTime) return w.endTime;
    var m = /^(\d{1,2}):(\d{2})$/.exec(w.startTime);
    if (!m) return '10:00';
    var mins = (+m[1]) * 60 + (+m[2]) + (Number(cfg().defaultDuration) || 60);
    mins = Math.min(mins, 23 * 60 + 59);
    return U.pad(Math.floor(mins / 60)) + ':' + U.pad(mins % 60);
  }
  function compact(iso, hhmm) {
    return iso.replace(/-/g, '') + (hhmm ? 'T' + hhmm.replace(':', '') + '00' : '');
  }

  /* ---- ICS ----------------------------------------------------------------
     escape ของ iCalendar ไม่ใช่ escape ของ HTML — ใช้ U.esc ตรงนี้จะได้ &amp;
     โผล่ในชื่อนัดบนปฏิทินจริง ๆ ห้าม escape ':' เพราะมันคือตัวคั่นของ property */
  function icsEsc(s) {
    return String(s == null ? '' : s)
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }
  function octetsOf(ch) {
    var c = ch.codePointAt(0);
    return c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
  }
  /* RFC 5545 จำกัดบรรทัดที่ 75 "octet" ไม่ใช่ 75 ตัวอักษร
     ภาษาไทยใน UTF-8 = 3 ไบต์/ตัว SUMMARY ไทย 26 ตัวก็ล้นแล้ว
     และห้ามตัดกลาง multi-byte เพราะไฟล์จะพังทั้งบรรทัด
     Google/Outlook ทนบรรทัดยาวได้ แต่ Apple Calendar ไม่ทน */
  function fold(line) {
    var out = '', cur = 0, i = 0;
    while (i < line.length) {
      var ch = line.charAt(i), step = 1, code = line.charCodeAt(i);
      if (code >= 0xD800 && code <= 0xDBFF && i + 1 < line.length) { ch = line.substr(i, 2); step = 2; }
      var n = octetsOf(ch);
      if (cur + n > 73) { out += '\r\n '; cur = 1; }
      out += ch; cur += n; i += step;
    }
    return out;
  }
  function stampUTC(d) {
    d = d || new Date();
    return d.getUTCFullYear() + U.pad(d.getUTCMonth() + 1) + U.pad(d.getUTCDate()) + 'T' +
           U.pad(d.getUTCHours()) + U.pad(d.getUTCMinutes()) + U.pad(d.getUTCSeconds()) + 'Z';
  }

  function describe(p) {
    var bits = [];
    if (p.notes) bits.push(p.notes);
    var cn = p.customerId ? SP.Cust.name(p.customerId) : '';
    var j = p.jobId ? U.byId(SP.state.jobs, p.jobId) : null;
    if (j) bits.push('งาน: ' + j.customerName + (j.product ? ' — ' + j.product : ''));
    else if (cn && cn.indexOf('—') !== 0) bits.push('ลูกค้า: ' + cn);
    if (p.owner) bits.push('ผู้รับผิดชอบ: ' + p.owner);
    if (p.activityId) {
      var a = SP.Act.get(p.activityId);
      if (a && a.topic) bits.push('จากการติดต่อ: ' + a.topic);
    }
    bits.push('— จาก AndamanTech sale-pipeline');
    return bits.join('\n');
  }
  function locationOf(p) {
    return p.location || (p.customerId ? SP.Cust.name(p.customerId) : '');
  }

  function vevent(p, seq) {
    var w = whenOf(p); if (!w) return null;
    var L = [];
    L.push('BEGIN:VEVENT');
    L.push('UID:' + p.id + '@andamantech-sale-pipeline');
    L.push('DTSTAMP:' + stampUTC());
    if (w.timed) {
      L.push('DTSTART;TZID=Asia/Bangkok:' + compact(w.start, w.startTime));
      L.push('DTEND;TZID=Asia/Bangkok:' + compact(w.end, endTimeOf(w)));
    } else {
      /* DTEND ของงานทั้งวันเป็นแบบ exclusive — ต้อง +1 วันเสมอ
         ถ้าใส่วันเดียวกันทั้งคู่ ปฏิทินจะแสดงเป็นงาน 2 วันหรือไม่แสดงเลย */
      L.push('DTSTART;VALUE=DATE:' + compact(w.start));
      L.push('DTEND;VALUE=DATE:' + compact(addDays(w.end, 1)));
    }
    L.push('SUMMARY:' + icsEsc(p.action || '(ไม่ได้ระบุงาน)'));
    L.push('DESCRIPTION:' + icsEsc(describe(p)));
    var loc = locationOf(p);
    if (loc) L.push('LOCATION:' + icsEsc(loc));
    /* COMPLETED เป็นสถานะของ VTODO ไม่ใช่ VEVENT — ใส่แล้วบางปฏิทินทิ้งทั้งรายการ */
    L.push('STATUS:' + (p.done ? 'CANCELLED' : 'CONFIRMED'));
    L.push('SEQUENCE:' + (seq || 0));
    L.push('CATEGORIES:AndamanTech');
    L.push('END:VEVENT');
    return L;
  }

  function ics(plans, opts) {
    opts = opts || {};
    var L = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//AndamanTech//sale-pipeline//TH',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:' + icsEsc(opts.name || 'AndamanTech — แผนงาน'),
      'X-WR-TIMEZONE:Asia/Bangkok',
      /* ไทยไม่มี DST — STANDARD component เดียวจึงครบและถูกต้องตามสเปก */
      'BEGIN:VTIMEZONE',
      'TZID:Asia/Bangkok',
      'BEGIN:STANDARD',
      'DTSTART:19700101T000000',
      'TZOFFSETFROM:+0700',
      'TZOFFSETTO:+0700',
      'TZNAME:+07',
      'END:STANDARD',
      'END:VTIMEZONE'
    ];
    var skipped = 0;
    (plans || []).forEach(function (p) {
      var ev = vevent(p, (p.cal && p.cal.seq) || 0);
      if (!ev) { skipped++; return; }
      L = L.concat(ev);
    });
    L.push('END:VCALENDAR');
    return { text: L.map(fold).join('\r\n') + '\r\n', skipped:skipped, count:(plans || []).length - skipped };
  }

  function download(plans, name) {
    var r = ics(plans, { name:name });
    if (!r.count) {
      SP.Toast.show('ไม่มีงานที่ระบุวันที่ไว้ — ปฏิทินต้องมีวันที่อย่างน้อยหนึ่งช่อง', 'warn', 6000);
      return;
    }
    var m = SP.state.meta;
    var fn = 'andamantech-tasks-' + m.yearTH + '-W' + U.pad(m.weekNo) + '.ics';
    SP.Export.download(new Blob([r.text], { type:'text/calendar;charset=utf-8' }), fn);
    SP.Toast.show('ดาวน์โหลด ' + r.count + ' นัดแล้ว' +
      (r.skipped ? ' · ข้าม ' + r.skipped + ' งานที่ยังไม่มีวันที่' : '') +
      ' — เปิดไฟล์เพื่อเพิ่มเข้าปฏิทิน', 'ok', 7000);
  }

  function weekPlans() {
    /* เลือกจาก "ช่วงวันที่" ไม่ใช่ bucket W1 — คอมเมนต์ที่ C.BUCKETS ระบุชัดว่า
       bucket ไม่ได้ derive จากวันที่ ใช้ bucket จะได้งานที่ไม่มีวันด้วย */
    var a0 = U.monday(U.toDate(SP.state.meta.weekOf + 'T00:00:00') || new Date());
    var a1 = new Date(a0); a1.setDate(a1.getDate() + 7);
    var lo = U.isoDate(a0), hi = U.isoDate(a1);
    return SP.state.plans.filter(function (p) {
      if (p.done) return false;
      var d = p.dueDate || p.startDate;
      return d && d >= lo && d < hi;
    });
  }

  /* ---- ลิงก์ template ของ Google ------------------------------------------
     ใช้เวลาแบบ floating + ctz แทน UTC เพื่อให้ถูกแม้บัญชี Google ตั้งอยู่คนละโซน
     และผู้ใช้เอาตาตรวจได้ว่าเวลาตรงกับที่เห็นในแอป */
  function gcalUrl(p) {
    var w = whenOf(p); if (!w) return '';
    var dates = w.timed
      ? compact(w.start, w.startTime) + '/' + compact(w.end, endTimeOf(w))
      : compact(w.start) + '/' + compact(addDays(w.end, 1));
    var q = 'action=TEMPLATE' +
      '&text='     + encodeURIComponent(p.action || '(ไม่ได้ระบุงาน)') +
      '&details='  + encodeURIComponent(describe(p)) +
      '&location=' + encodeURIComponent(locationOf(p)) +
      '&dates='    + dates +
      (w.timed ? '&ctz=Asia/Bangkok' : '');
    return 'https://calendar.google.com/calendar/render?' + q;
  }

  /* ปุ่มท้ายแถวแผนงาน — ต้องไม่มี data-act บน <a> เด็ดขาด
     ตัวจับคลิกกลางใน BOOT เรียก preventDefault() กับทุกอย่างที่แมตช์ [data-act]
     ใส่แล้วลิงก์จะเงียบสนิทโดยไม่มี error ให้เห็น */
  function rowButtons(p) {
    if (!whenOf(p)) return '';
    var m = mode();
    var out = '<a class="btn btn-xs btn-ghost" target="_blank" rel="noopener" href="' +
      U.attr(gcalUrl(p)) + '" title="เปิด Google Calendar พร้อมข้อมูลนัดนี้">' +
      U.ic('calendar') + 'Google</a>' +
      '<button class="btn btn-xs btn-ghost" data-act="cal:ics1" data-id="' + p.id + '" title="ดาวน์โหลดไฟล์ .ics">' +
      U.ic('download') + '.ics</button>';
    if (m === 'api') {
      var s = (p.cal && p.cal.state) || 'none';
      var dirty = (s === 'synced' && hashOf(p) !== p.cal.syncHash);
      out += '<button class="btn btn-xs' + (s === 'synced' && !dirty ? ' btn-ghost' : '') +
        '" data-act="cal:push" data-id="' + p.id + '">' + U.ic('refresh') +
        (s === 'synced' ? (dirty ? 'อัปเดตปฏิทิน' : 'ซิงก์แล้ว') : 'ส่งเข้าปฏิทิน') + '</button>';
    }
    return out;
  }

  /* ---- ตรวจว่าแผนถูกแก้หลังซิงก์ ------------------------------------------
     ใช้ hash แทน hook โดยตั้งใจ: การแก้ผ่าน data-field วิ่งผ่าน Store.patch ทั่วไป
     hash จึงพลาด mutation path ไม่ได้ ส่วน hook มีโอกาสลืมเสียบสักทาง */
  function hashOf(p) {
    /* activityId อยู่ในชุดนี้ด้วยเพราะ describe() เอาหัวข้อการติดต่อไปใส่คำอธิบายนัด
       ถ้าไม่แฮช การเปลี่ยนบันทึกต้นทางจะไม่ถูกนับว่า "แก้หลังซิงก์" */
    var s = [p.action, p.notes, p.location, p.startDate, p.startTime,
             p.dueDate, p.endTime, p.allDay, p.done, p.activityId].join('|');
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return String(h);
  }

  /* ---- API (โหมด api เท่านั้น) -------------------------------------------- */
  function ensureGis() {
    return new Promise(function (ok, fail) {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) return ok();
      var s = document.createElement('script');
      s.src = C.GIS_CDN;
      s.setAttribute('data-runtime', '');   // ให้ buildHtml() ถอดออก ไม่ฝังไปกับไฟล์ที่ส่งต่อ
      s.onload = function () { ok(); };
      s.onerror = function () { fail(new Error('โหลด Google Identity Services ไม่สำเร็จ')); };
      document.head.appendChild(s);
    });
  }
  function auth() {
    if (token && Date.now() < tokenExp - 60000) return Promise.resolve(token);
    return ensureGis().then(function () {
      return new Promise(function (ok, fail) {
        try {
          tokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId(),
            scope: 'https://www.googleapis.com/auth/calendar.events',
            callback: function (resp) {
              if (resp && resp.access_token) {
                token = resp.access_token;
                tokenExp = Date.now() + (Number(resp.expires_in || 3600) * 1000);
                ok(token);
              } else fail(new Error('ไม่ได้รับสิทธิ์จาก Google'));
            },
            error_callback: function (e) { fail(new Error((e && e.message) || 'ผู้ใช้ปิดหน้าต่างอนุญาตสิทธิ์')); }
          });
          tokenClient.requestAccessToken({ prompt: token ? '' : 'consent' });
        } catch (e) { fail(e); }
      });
    });
  }
  function api(path, opts) {
    opts = opts || {};
    return auth().then(function (t) {
      var h = { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
      if (opts.etag) h['If-Match'] = opts.etag;
      return fetch(C.GCAL_API + path, {
        method: opts.method || 'GET', headers: h,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
    });
  }
  function bodyOf(p) {
    var w = whenOf(p);
    var b = {
      summary: p.action || '(ไม่ได้ระบุงาน)',
      description: describe(p),
      location: locationOf(p),
      /* แท็กนี้คือสิ่งที่ทำให้ดึงกลับได้อย่างปลอดภัย: query เฉพาะ event ของเอกสารนี้
         ไม่ต้องเดาด้วยช่วงเวลา และไม่มีทางไปแตะนัดส่วนตัวของผู้ใช้ */
      extendedProperties: { private: { spPlanId: p.id, spDocId: SP.state.meta.docId } }
    };
    if (w.timed) {
      b.start = { dateTime: w.start + 'T' + w.startTime + ':00', timeZone: cfg().tz || 'Asia/Bangkok' };
      b.end   = { dateTime: w.end + 'T' + endTimeOf(w) + ':00',  timeZone: cfg().tz || 'Asia/Bangkok' };
    } else {
      b.start = { date: w.start };
      b.end   = { date: addDays(w.end, 1) };
    }
    return b;
  }
  function calId() { return encodeURIComponent(cfg().calendarId || 'primary'); }

  function push(planId) {
    var p = U.byId(SP.state.plans, planId);
    if (!p) return;
    if (!whenOf(p)) { SP.Toast.show('งานนี้ยังไม่มีวันที่ — ใส่วันก่อนจึงจะส่งเข้าปฏิทินได้', 'warn'); return; }
    if (mode() !== 'api') { SP.Toast.show('โหมดนี้ยังต่อ Google ไม่ได้ — ใช้ปุ่ม .ics หรือลิงก์ Google แทน', 'warn', 6000); return; }

    var existing = p.cal && p.cal.eventId;
    var req = existing
      ? api('/calendars/' + calId() + '/events/' + encodeURIComponent(p.cal.eventId),
            { method:'PATCH', body:bodyOf(p), etag:p.cal.etag })
      : api('/calendars/' + calId() + '/events', { method:'POST', body:bodyOf(p) });

    req.then(function (res) {
      if (res.status === 412) {
        /* 412 = มีคนแก้ event นี้ใน Google หลังจากที่เราซิงก์ไป */
        p.cal.state = 'conflict'; SP.Store.touch(); SP.Render.current();
        SP.Modal.confirm({
          title:'มีการแก้ไขใน Google Calendar', icon:'alert',
          html:'<p class="small">นัดนี้ถูกแก้ใน Google หลังจากที่ส่งไปครั้งก่อน — จะเขียนทับด้วยข้อมูลในแอปไหม</p>',
          ok:'เขียนทับด้วยข้อมูลในแอป'
        }, function () {
          p.cal.etag = null;                  // ทิ้ง etag แล้วยิงใหม่แบบไม่เช็ค
          push(planId);
        });
        return null;
      }
      if (res.status === 404 || res.status === 410) {
        p.cal.eventId = null; p.cal.etag = null; p.cal.state = 'remoteDeleted';
        SP.Store.touch(); SP.Render.current();
        SP.Toast.show('นัดนี้ถูกลบไปจาก Google แล้ว — กดอีกครั้งเพื่อสร้างใหม่', 'warn', 6000);
        return null;
      }
      if (!res.ok) return res.text().then(function (t) { throw new Error('Google ตอบ ' + res.status + ': ' + t.slice(0, 200)); });
      return res.json();
    }).then(function (ev) {
      if (!ev) return;
      p.cal.eventId = ev.id;
      p.cal.calendarId = cfg().calendarId || 'primary';
      p.cal.etag = ev.etag || null;
      p.cal.syncedAt = U.nowISO();
      p.cal.syncHash = hashOf(p);
      p.cal.state = 'synced';
      p.cal.seq = (p.cal.seq || 0) + 1;
      SP.Store.touch(); SP.Render.current();
      SP.Toast.show(existing ? 'อัปเดตนัดใน Google Calendar แล้ว' : 'เพิ่มนัดเข้า Google Calendar แล้ว', 'ok');
    }).catch(function (e) {
      if (p.cal) p.cal.state = 'error';
      SP.Toast.show('ส่งเข้าปฏิทินไม่สำเร็จ: ' + e.message, 'bad', 8000);
    });
  }

  function pushWeek() {
    var list = weekPlans().filter(function (p) { return whenOf(p); });
    if (!list.length) { SP.Toast.show('ไม่มีงานที่มีวันที่ในสัปดาห์นี้', 'warn'); return; }
    list.forEach(function (p, i) { setTimeout(function () { push(p.id); }, i * 350); });  // เว้นจังหวะกัน rate limit
  }

  function remove(planId) {
    var p = U.byId(SP.state.plans, planId);
    if (!p || !p.cal || !p.cal.eventId) return;
    api('/calendars/' + calId() + '/events/' + encodeURIComponent(p.cal.eventId), { method:'DELETE' })
      .then(function (res) {
        if (res.ok || res.status === 404 || res.status === 410) {   // หายไปแล้วก็ถือว่าสำเร็จ
          p.cal.eventId = null; p.cal.etag = null; p.cal.state = 'none';
          SP.Store.touch(); SP.Render.current();
          SP.Toast.show('ลบนัดออกจาก Google Calendar แล้ว', 'ok');
        } else throw new Error('Google ตอบ ' + res.status);
      }).catch(function (e) { SP.Toast.show('ลบไม่สำเร็จ: ' + e.message, 'bad', 7000); });
  }

  function pull() {
    if (mode() !== 'api') { SP.Toast.show('ต้องเปิดผ่าน http และตั้ง Client ID ก่อน', 'warn'); return; }
    api('/calendars/' + calId() + '/events?privateExtendedProperty=' +
        encodeURIComponent('spDocId=' + SP.state.meta.docId) + '&showDeleted=true&maxResults=250')
      .then(function (res) {
        if (!res.ok) throw new Error('Google ตอบ ' + res.status);
        return res.json();
      }).then(function (data) {
        var n = { updated:0, gone:0 };
        (data.items || []).forEach(function (ev) {
          var pid = ev.extendedProperties && ev.extendedProperties.private && ev.extendedProperties.private.spPlanId;
          var p = pid ? U.byId(SP.state.plans, pid) : null;
          if (!p) return;
          if (ev.status === 'cancelled') {
            p.cal.state = 'remoteDeleted'; p.cal.eventId = null; n.gone++;
            return;
          }
          if (ev.summary && ev.summary !== p.action) { p.action = ev.summary; n.updated++; }
          if (ev.start) {
            if (ev.start.date) { p.startDate = ev.start.date; p.allDay = true; p.startTime = null; }
            else if (ev.start.dateTime) {
              p.startDate = ev.start.dateTime.slice(0, 10);
              p.startTime = ev.start.dateTime.slice(11, 16);
              p.allDay = false;
            }
          }
          p.cal.etag = ev.etag || p.cal.etag;
          p.cal.syncedAt = U.nowISO();
          p.cal.syncHash = hashOf(p);
          p.cal.state = 'synced';
        });
        SP.state.settings.calendar.lastSyncAt = U.nowISO();
        SP.Store.touch(); SP.Render.current();
        SP.Toast.show('ดึงจาก Google แล้ว — อัปเดต ' + n.updated + ' · ถูกลบที่ปลายทาง ' + n.gone, 'ok', 6000);
      }).catch(function (e) { SP.Toast.show('ดึงข้อมูลไม่สำเร็จ: ' + e.message, 'bad', 8000); });
  }

  return {
    mode:mode, clientId:clientId, ics:ics, icsEsc:icsEsc, fold:fold, octetsOf:octetsOf,
    gcalUrl:gcalUrl, rowButtons:rowButtons, hashOf:hashOf, whenOf:whenOf, weekPlans:weekPlans,
    download:download, push:push, pushWeek:pushWeek, remove:remove, pull:pull, addDays:addDays
  };
})();

SP.Actions.on('cal:ics1', function (ds) {
  var p = SP.U.byId(SP.state.plans, ds.id);
  if (p) SP.Cal.download([p], 'AndamanTech — ' + (p.action || 'งาน'));
});
SP.Actions.on('cal:icsweek', function () {
  SP.Cal.download(SP.Cal.weekPlans(), 'AndamanTech — แผนสัปดาห์นี้');
});
SP.Actions.on('cal:icsall', function () {
  SP.Cal.download(SP.state.plans.filter(function (p) { return !p.done; }), 'AndamanTech — แผนงานทั้งหมด');
});
SP.Actions.on('cal:push',     function (ds) { SP.Cal.push(ds.id); });
SP.Actions.on('cal:pushweek', function () { SP.Cal.pushWeek(); });
SP.Actions.on('cal:pull',     function () { SP.Cal.pull(); });
</script>

<script>
/* ============================================================================
   BLOCK 13 — BOOT  (บล็อกเดียวที่มี side effect ตอนโหลด)
   หมายเหตุสำคัญสำหรับคนที่จะมาแก้ไฟล์นี้ต่อ:
   - ไฟล์นี้บูตได้ 2 แบบ (ดู BLOCK 03b SYNC): ออนไลน์ = ดึง/ส่งข้อมูลผ่าน /api
     และ standalone = ไฟล์สำรองที่ export ออกไป ซึ่งยังต้องเปิดจาก file:// ได้
     ดังนั้นห้าม fetch() ไฟล์ในเครื่อง — ข้อมูลตั้งต้นและ SVG sprite ต้อง inline เท่านั้น
   - ห้ามใช้ <script type="module"> — Chrome บล็อกด้วย CORS บน file://
   - ห้าม re-render ตอน event 'input' เพราะ caret จะกระโดดกลางคำ
   ========================================================================= */
var SP = window.SP || (window.SP = {});

(function () {
  'use strict';
  var U = SP.U;

  SP.Actions.on('sync:now', function () { SP.Sync.sync(); });

  // ---- event delegation ทั้งหน้า -----------------------------------------
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    e.preventDefault();
    SP.Actions.run(t.getAttribute('data-act'), t.dataset, e);
  });

  /* change = เขียน state แล้ว re-render ได้ */
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-field')) { SP.Actions.field(t, true); return; }
    var ac = t.getAttribute && t.getAttribute('data-act-change');
    if (!ac) return;
    if (ac === 'imp:map')    { SP.Imp.st.map[t.dataset.k] = Number(t.value); SP.Render.current(); }
    else if (ac === 'imp:sheet')  { SP.Imp.st.sheet = t.value; SP.Imp.readWorkbook(SP.Imp.st.buf ? new Uint8Array(SP.Imp.st.buf) : null, 'array'); }
    else if (ac === 'imp:header') { SP.Imp.st.headerRow = Math.max(0, Number(t.value) - 1); SP.Imp.autoMap(); SP.Render.current(); }
    else if (ac === 'imp:mode')   { SP.Imp.st.mode = t.value; SP.Render.current(); }
    else if (ac === 'ui:me')      { SP.ui.me = t.value; SP.Store.saveUI(); SP.Render.current(); }
    else if (ac === 'owner:name') { renameOwner(t.dataset.id, t.value); }
    else if (SP.Actions.map[ac])  { SP.Actions.run(ac, t.dataset || {}, e); }   // ดูหมายเหตุที่ตัว listener 'input'
  });

  /* input = เขียน state + autosave เท่านั้น ห้าม re-render */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-field')) { SP.Actions.field(t, false); return; }
    var ai = t.getAttribute && t.getAttribute('data-act-input');
    if (!ai) return;
    if (ai === 'board:text') { SP.Board.f().text = t.value; clearTimeout(t._tm); t._tm = setTimeout(function () { SP.Render.current(); }, 300); }
    else if (ai === 'contact') {
      var j = U.byId(SP.state.jobs, t.dataset.id);
      if (j && j.contacts[Number(t.dataset.i)]) { j.contacts[Number(t.dataset.i)][t.dataset.k] = t.value; SP.Store.touch(); }
    }
    else if (ai === 'owner:name') { /* รอ change เพื่อ cascade ทีเดียว */ }
    /* ชื่อที่ไม่อยู่ในรายการข้างบน ให้ตกไปที่ทะเบียน SP.Actions
       ไม่งั้นบล็อกที่มาทีหลังจะ SP.Actions.on('x') แล้วงงว่าทำไมไม่เคยถูกเรียก
       — ห่วงโซ่ if/else นี้คือจุดที่ลืมง่ายที่สุดเวลาเพิ่มหน้าจอใหม่ */
    else if (SP.Actions.map[ai]) { SP.Actions.run(ai, t.dataset || {}, e); }
  });

  /* ลากเพื่อเลื่อนบอร์ด — เริ่มจับจริงเมื่อลากเกิน 6px เพื่อไม่ให้กินการคลิกปุ่ม
     และกลืน click ที่ตามมาหลังลาก ไม่งั้นลากทับการ์ดแล้วฟอร์มแก้ไขจะเด้งขึ้นมาเอง */
  var pan = null, swallowClick = false;
  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || !e.target.closest) return;
    var board = e.target.closest('.board');
    if (!board) return;
    if (e.target.closest('input,textarea,select,option,a')) return;
    pan = { board: board, x: e.clientX, y: e.clientY, left: board.scrollLeft, active: false };
  });
  document.addEventListener('pointermove', function (e) {
    if (!pan) return;
    var dx = e.clientX - pan.x;
    if (!pan.active) {
      if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(e.clientY - pan.y)) return;
      pan.active = true;
      pan.board.classList.add('panning');
    }
    pan.board.scrollLeft = pan.left - dx;
    if (e.cancelable) e.preventDefault();
  });
  function endPan() {
    if (!pan) return;
    if (pan.active) { pan.board.classList.remove('panning'); swallowClick = true; }
    pan = null;
  }
  document.addEventListener('pointerup', endPan);
  document.addEventListener('pointercancel', endPan);
  document.addEventListener('click', function (e) {
    if (!swallowClick) return;
    swallowClick = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (SP.Modal.isOpen()) { SP.Modal.close(); return; }
    if (SP.Drawer.isOpen()) { SP.Drawer.close(); }
  });

  /* แก้ชื่อผู้รับผิดชอบ -> เปลี่ยนตามไปทุกที่ที่อ้างถึง พร้อมบอกจำนวนก่อนยืนยัน */
  function renameOwner(id, to) {
    var o = U.byId(SP.state.owners, id);
    if (!o) return;
    to = String(to || '').trim();
    var from = o.name;
    if (!to || to === from) { SP.Render.current(); return; }
    if (SP.state.owners.some(function (x) { return x.id !== id && x.name === to; })) {
      SP.Toast.show('มีชื่อ "' + to + '" อยู่แล้ว', 'bad');
      SP.Render.current();
      return;
    }
    var r = SP.Settings.refs(from);
    function apply() {
      SP.Settings.renameEverywhere(from, to);
      o.name = to;
      SP.Store.touch();
      SP.Render.current();
    }
    if (!r.total) { apply(); return; }
    SP.Modal.confirm({
      title:'เปลี่ยนชื่อเป็น "' + to + '"?', icon:'edit', ok:'เปลี่ยนทั้งหมด',
      html:'<p>จะเปลี่ยนชื่อใน <b>' + SP.Settings.refsText(r) + '</b></p>'
    }, apply);
    SP.Modal.el().addEventListener('click', function h(ev) {
      var b = ev.target.closest && ev.target.closest('[data-id="no"]');
      if (b) { SP.Render.current(); SP.Modal.el().removeEventListener('click', h); }
    });
  }

  /* เตือนตอนปิดเฉพาะเมื่อมีการแก้หลังบันทึกไฟล์ — เตือนทุกครั้งคือเตือนที่ถูกกดผ่าน */
  window.addEventListener('beforeunload', function (e) {
    var warn = (SP.Sync && SP.Sync.online()) ? SP.Sync.pending()
             : (SP.state && (SP.state.meta.editsSinceSave || 0) > 0);
    if (warn) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  // ---- boot ---------------------------------------------------------------
  function askWhichVersion(seed, saved, why) {
    var edits = saved.meta.editsSinceSave || 0;
    var html;
    if (why === 'fileNewer') {
      html = '<p>ไฟล์นี้เป็น <b>รอบที่ ' + U.esc(seed.meta.revision) + '</b>' +
             (seed.meta.savedBy ? ' บันทึกโดย <b>' + U.esc(seed.meta.savedBy) + '</b>' : '') +
             (seed.meta.savedAt ? ' เมื่อ ' + U.esc(U.fmtDate(seed.meta.savedAt, 'datetime')) : '') + '</p>' +
             '<p>ข้อมูลในเครื่องนี้เป็น <b>รอบที่ ' + U.esc(saved.meta.revision) + '</b></p>' +
             (edits > 0
               ? '<div class="banner banner-bad">' + U.ic('alert') + '<div><b>ในเครื่องนี้มีการแก้ไข ' + edits +
                 ' ครั้ง หลังส่งไฟล์รอบที่ ' + U.esc(saved.meta.revision) + ' ออกไป</b><br>' +
                 'ถ้าเลือกใช้ไฟล์ใหม่ การแก้ไขเหล่านั้นจะหาย — กด “ดาวน์โหลดของในเครื่อง” เก็บไว้ก่อนได้</div></div>'
               : '<p class="muted small">ในเครื่องนี้ไม่มีการแก้ไขค้างอยู่ ใช้ไฟล์ใหม่ได้เลย</p>');
    } else {
      html = '<p>ไฟล์ที่เปิดเป็น <b>รอบที่ ' + U.esc(seed.meta.revision) + '</b> ' +
             'แต่ข้อมูลในเครื่องนี้เป็น <b>รอบที่ ' + U.esc(saved.meta.revision) + '</b> ซึ่งใหม่กว่า</p>' +
             '<p class="muted small">มักเกิดตอนเผลอเปิดไฟล์แนบเก่าในเมล</p>';
    }
    SP.Modal.open({
      title: why === 'fileNewer' ? 'ไฟล์นี้ใหม่กว่าข้อมูลในเครื่อง' : 'ข้อมูลในเครื่องใหม่กว่าไฟล์นี้',
      icon:'users', html:html,
      buttons: why === 'fileNewer'
        ? [{ label:'ดาวน์โหลดของในเครื่อง (JSON)', id:'dl', cls:'btn', icon:'download' },
           { label:'เก็บของในเครื่องไว้', id:'local', cls:'btn' },
           { label:'ใช้ไฟล์รอบที่ ' + seed.meta.revision, id:'file', cls:'btn btn-primary' }]
        : [{ label:'ย้อนไปใช้ไฟล์รอบที่ ' + seed.meta.revision, id:'file', cls:'btn' },
           { label:'เก็บของในเครื่องไว้', id:'local', cls:'btn btn-primary' }],
      onClick: function (id) {
        if (id === 'dl') {
          var name = 'andamantech-pipeline-local-backup-r' + saved.meta.revision + '.json';
          SP.Export.download(new Blob([JSON.stringify(saved, null, 1)], { type:'application/json;charset=utf-8' }), name);
          return true;                       // เปิด modal ค้างไว้ ให้เลือกต่อ
        }
        finish(id === 'file' ? seed : saved, id === 'file' ? seed : null);
      }
    });
  }

  function finish(doc, received) {
    SP.Store.use(doc);
    SP.Store.flush();
    if (!SP.ui.activeTab) SP.ui.activeTab = 'week';
    applyBrand();
    SP.Render.all();
    if (received && received.meta.savedBy) {
      SP.Toast.show('รับไฟล์รอบที่ ' + received.meta.revision + ' จาก ' + received.meta.savedBy +
                    (received.meta.handoffTo ? ' (ส่งต่อให้ ' + received.meta.handoffTo + ')' : ''), 'ok', 8000);
    }
    askWhoAmI();
  }

  /* ถามครั้งเดียวต่อเครื่อง — ใช้เป็นชื่อผู้บันทึกตอนส่งต่อ และค่าเริ่มต้นของงานใหม่
     เก็บใน spw_v1_ui ไม่ใช่ในเอกสาร เพราะเอกสารเดินทางข้ามเครื่อง */
  function askWhoAmI() {
    var owners = SP.state.owners.filter(function (o) { return o.active; });
    if (!owners.length) return;
    if (SP.ui.me && U.ownerByName(SP.ui.me)) return;
    if (SP.ui.me && !U.ownerByName(SP.ui.me)) SP.ui.me = '';
    SP.Modal.open({
      title:'คุณคือใคร?', icon:'user',
      html:'<p class="muted small">ใช้เป็นชื่อผู้บันทึกตอนส่งไฟล์ต่อ และเป็นผู้รับผิดชอบเริ่มต้นของงานใหม่<br>' +
           'ค่านี้เก็บไว้เฉพาะเครื่องนี้ ไม่เดินทางไปกับไฟล์ · เปลี่ยนได้ที่หน้าตั้งค่า</p>' +
           '<div class="field"><select class="inp" id="sp-me">' +
           '<option value="">— ยังไม่ระบุ —</option>' +
           owners.map(function (o) { return '<option value="' + U.attr(o.name) + '">' + U.esc(o.name) + '</option>'; }).join('') +
           '</select></div>',
      buttons:[{ label:'ข้ามไปก่อน', id:'no' }, { label:'บันทึก', id:'yes', cls:'btn btn-primary' }],
      onClick: function (id, root) {
        if (id !== 'yes') return;
        SP.ui.me = root.querySelector('#sp-me').value;
        SP.Store.saveUI();
        SP.Render.current();
      }
    });
  }


  /* ---- ประตู PIN ----------------------------------------------------------
     ออนไลน์: ส่งรหัสไปตรวจที่ server (env CRM_PIN) ได้ token กลับมา — รหัสไม่อยู่ในซอร์สของหน้า
     standalone (ไฟล์สำรอง): เทียบแฮชที่ติดมากับไฟล์ตอน export (#pin-gate[data-pin-hash])
     กันคนเปิดผ่าน ๆ เท่านั้น เพราะข้อมูลในไฟล์สำรองเป็น JSON อ่านได้อยู่แล้ว */
  var PIN_LEN = 5;

  function gateEl() { return document.getElementById('pin-gate'); }

  function unlock(afterUnlock) {
    var g = gateEl();
    if (g) g.hidden = true;
    SP.ui.unlocked = true;
    SP.Store.saveUI();
    afterUnlock();
  }

  function guard(afterUnlock) {
    var g = gateEl();
    if (!g) { afterUnlock(); return; }          // ไม่มีประตูก็ผ่านไป
    var online = SP.Sync.online();
    if (online ? SP.Sync.hasToken() : SP.ui.unlocked) { g.hidden = true; afterUnlock(); return; }

    g.hidden = false;
    var inp = document.getElementById('pin-input');
    var msg = document.getElementById('pin-msg');
    var btn = document.getElementById('pin-go');
    var busy = false;

    function fail(text) {
      msg.textContent = text || 'รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง';
      var card = g.querySelector('.pin-card');
      card.classList.remove('pin-shake');
      void card.offsetWidth;                     // บังคับ reflow ให้ animation เล่นซ้ำได้
      card.classList.add('pin-shake');
      inp.value = '';
      inp.focus();
    }
    function tryPin() {
      if (busy) return;
      if (online) {
        busy = true;
        msg.textContent = 'กำลังตรวจสอบ…';
        SP.Sync.login(inp.value).then(function () {
          busy = false; msg.textContent = ''; unlock(afterUnlock);
        }, function (err) {
          busy = false;
          fail(err.code === 'BAD_PIN' ? '' : err.message);
        });
        return;
      }
      var want = g.getAttribute('data-pin-hash');
      if (!want || SP.Sync.pinHash(inp.value) === want) unlock(afterUnlock); else fail();
    }

    inp.addEventListener('input', function () {
      msg.textContent = '';
      if (inp.value.length === PIN_LEN) tryPin();   // ครบ 5 หลักแล้วตรวจให้เลย
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); tryPin(); }
    });
    btn.addEventListener('click', function (e) { e.preventDefault(); tryPin(); });
    try { inp.focus(); } catch (e) {}
  }

  function boot() {
    SP.Store.loadUI();
    guard(startApp);
  }

  /* ติดแบรนด์ให้ส่วนที่อยู่นอก [data-render-root] — ประตู PIN กับ <title>
     ต้องทำที่นี่ ไม่ใช่ตอน boot() เพราะ guard() ทำงานก่อนที่ SP.state จะมีตัวตน
     (state ถูกตั้งใน finish()) ผลคือไฟล์ที่เพิ่งได้รับมาจะโชว์สัญลักษณ์เริ่มต้น
     ตอนใส่ PIN ครั้งแรกครั้งเดียว แล้วตั้งแต่บันทึกครั้งแรกเป็นต้นไปจะมีโลโก้ —
     แลกกับการไม่ต้องแกะ seed ก่อนประตู ซึ่งดีไซน์เดิมตั้งใจเลื่อนออกไป */
  function applyBrand() {
    if (!SP.state) return;
    var b = SP.state.settings.brand || {};
    var mark = document.getElementById('pin-mark');
    if (mark) mark.innerHTML = SP.U.brandMark('ic-xl');
    /* หัวข้อเป็นชื่อหน้าจอ ไม่ใช่ชื่อบริษัท — ชื่อบริษัทอยู่ที่โลโก้เหนือมันแล้ว
       (เดิมเขียนทับ h1 ด้วย brand.name ตอนที่การ์ดยังไม่มีโลโก้เป็นคำ) */
    var sub = document.querySelector('#pin-gate .pin-card > p');
    if (sub && b.name) sub.textContent = 'สำหรับทีมขาย ' + b.name + ' ที่ได้รับไฟล์รอบนี้';
    if (b.accent) {
      try {
        document.documentElement.style.setProperty('--brand-1', b.accent);
        document.documentElement.style.setProperty('--brand-2', b.accent);
      } catch (e) {}
    }
    document.title = (b.name || 'AndamanTech') + ' — ' + (SP.state.meta.title || 'สรุป Pipeline');
  }

  function startApp() {
    if (SP.Sync.online()) {
      var host = document.getElementById('view-week');
      host.hidden = false;
      host.innerHTML = '<div class="empty">กำลังโหลดข้อมูลจาก server…</div>';
      SP.Sync.boot(function (doc, note) {
        finish(doc);
        SP.Sync.start();
        if (note) SP.Toast.show(note, 'warn', 8000);
      }, function (err) {
        host.innerHTML = '<div class="wrap"><div class="banner banner-bad">' + U.ic('alert') +
          '<div><b>โหลดข้อมูลไม่ได้</b> — ' + U.esc(err.message) + '<br><span class="small">ตรวจการเชื่อมต่ออินเทอร์เน็ต แล้วลองใหม่ ' +
          '(server บน Render แบบฟรีอาจใช้เวลาตื่นราว 1 นาทีหลังไม่มีคนใช้นาน ๆ)</span></div>' +
          '<button class="btn btn-sm btn-primary" onclick="location.reload()">ลองใหม่</button></div></div>';
      });
      return;
    }
    var seed = SP.Store.readSeed();
    if (!seed) {
      document.getElementById('view-week').innerHTML =
        '<div class="banner banner-bad">' + U.ic('alert') + 'อ่านข้อมูลที่ฝังในไฟล์ไม่ได้ — ไฟล์อาจเสียหายระหว่างส่ง ลองขอไฟล์ใหม่อีกครั้ง</div>';
      return;
    }
    var saved = SP.Store.readLocal(seed.meta.docId);
    var d = SP.Store.decide(seed, saved);
    if (d.use === 'seed')       finish(seed, saved ? null : (seed.meta.savedBy ? seed : null));
    else if (d.use === 'local') finish(saved);
    else                        { SP.Store.use(saved); askWhichVersion(seed, saved, d.why); }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
